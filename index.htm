<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CPL SPORTS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#191f28;font-family:Arial,"Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1200px;margin:auto}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e9edf2}
.top{height:68px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:27px;font-weight:900;color:#3182f6}.logo span{color:#191f28}
.admin{border:0;background:#f2f4f6;border-radius:12px;padding:10px 14px;font-weight:800}
.nav{display:flex;gap:5px;padding:0 15px 10px;overflow-x:auto}
.nav button{border:0;background:#fff;border-radius:12px;padding:10px 15px;font-weight:800;white-space:nowrap}
.nav button.on{background:#e8f3ff;color:#3182f6}
main{padding:22px 16px 80px}
.hero{background:#191f28;color:white;border-radius:24px;padding:30px;margin-bottom:16px}
.hero h1{font-size:31px;margin:8px 0}.hero p{color:#c8d0d9;margin:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:15px;box-shadow:0 2px 12px #00000008}
.card h2{margin:0 0 15px}
.muted{color:#8b95a1}
.stat{font-size:29px;font-weight:900;margin-top:5px}
.match{display:flex;align-items:center;gap:10px;padding:15px 0;border-bottom:1px solid #edf0f2}
.match:last-child{border-bottom:0}
.mdate{width:100px;font-size:13px}.mteam{flex:1;text-align:center;font-weight:900}.score{min-width:65px;text-align:center;font-size:21px;font-weight:900}
.badge{display:inline-block;background:#eef1f5;color:#66717d;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:800}
.practice{background:#f0edff;color:#6845e8}
.gray,.primary,.danger,.dark{border:0;border-radius:12px;padding:11px 15px;font-weight:800}
.gray{background:#eef1f5}.primary{background:#3182f6;color:#fff}.danger{background:#ffe8ea;color:#d9303e}.dark{background:#191f28;color:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.tabs button{border:0;background:#eef1f5;border-radius:11px;padding:9px 14px;font-weight:800}
.tabs button.on{background:#3182f6;color:#fff}
.team{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px;cursor:pointer;box-shadow:0 2px 12px #00000008}
.teamhead{display:flex;align-items:center;justify-content:space-between}.teamname{font-size:21px;font-weight:900}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:8px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi div{background:#f7f8fa;border-radius:14px;padding:14px}.kpi strong{display:block;font-size:20px;margin-top:4px}
.members{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.member{background:#f7f8fa;border-radius:12px;padding:12px;cursor:pointer}
.member b{display:block;margin-bottom:3px}
.list{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #edf0f2}
table{width:100%;border-collapse:collapse}th,td{padding:11px 7px;border-bottom:1px solid #e9edf2;text-align:center}th{background:#fafbfc;color:#78838e;font-size:13px}
.news{padding:16px 0;border-bottom:1px solid #e9edf2;cursor:pointer}.news h3{margin:0 0 7px}
.notice{background:#e8f3ff;color:#176bd3;padding:14px;border-radius:14px;margin-bottom:15px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
input,select,textarea{width:100%;padding:12px;border:1px solid #dfe3e8;border-radius:11px;background:white}
textarea{min-height:120px;resize:vertical}
.empty{text-align:center;padding:35px;color:#8b95a1}
.modal{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.modalbox{background:#fff;width:100%;max-width:800px;max-height:92vh;overflow:auto;border-radius:22px;padding:22px}
.close{float:right;border:0;background:#eef1f5;border-radius:10px;padding:7px 11px}
.comment{padding:12px 0;border-bottom:1px solid #edf0f2}.comment b{display:block}.comment small{color:#929aa4}
.predict{border:1px solid #e4e8ed;border-radius:15px;padding:15px;margin:10px 0}
.predict button{margin:4px}
.manager{background:#191f28;color:#fff;border-radius:13px;padding:13px}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
@media(max-width:800px){
.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}
.kpi{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}
.members{grid-template-columns:1fr}.mdate{width:80px}
}
</style>
</head>

<body>
<div class="app">
<header>
<div class="top">
<div class="logo">CPL <span>SPORTS</span></div>
<button class="admin" onclick="adminLogin()">⚙ 관리자</button>
</div>
<div class="nav" id="nav"></div>
</header>
<main id="main"></main>
</div>

<div class="modal" id="modal">
<div class="modalbox" id="modalbox"></div>
</div>

<script>
/* =========================
   CPL DATA
========================= */

const STORAGE_KEY="CPL_SPORTS_V3";

const defaultData={
teams:{
"시환팀":{
icon:"🟦",color:"#3182f6",manager:"시환",
hitters:["시환1","시환2","시환3","시환4","시환5","시환6"],
pitchers:["시환투수1","시환투수2","시환투수3","시환투수4","시환투수5","시환투수6","시환투수7","시환투수8"],
starters:["시환","해찬","재우","준열","시환"],
win:"해찬",bull:"재우",closer:"시환"
},
"해찬팀":{
icon:"🟨",color:"#f5b900",manager:"해찬",
hitters:["해찬1","해찬2","해찬3","해찬4","해찬5","해찬6"],
pitchers:["해찬투수1","해찬투수2","해찬투수3","해찬투수4","해찬투수5","해찬투수6","해찬투수7","해찬투수8"],
starters:["해찬","시환","재우","준열","해찬"],
win:"시환",bull:"준열",closer:"해찬"
},
"재우팀":{
icon:"🟥",color:"#f04452",manager:"재우",
hitters:["재우1","재우2","재우3","재우4","재우5","재우6"],
pitchers:["재우투수1","재우투수2","재우투수3","재우투수4","재우투수5","재우투수6","재우투수7","재우투수8"],
starters:["시환","재우","해찬","준열","재우"],
win:"해찬",bull:"시환",closer:"시환"
},
"준열팀":{
icon:"⬜",color:"#9aa1a9",manager:"준열",
hitters:["준열1","준열2","준열3","준열4","준열5","준열6"],
pitchers:["준열투수1","준열투수2","준열투수3","준열투수4","준열투수5","준열투수6","준열투수7","준열투수8"],
starters:["해찬","준열","시환","재우","준열"],
win:"시환",bull:"해찬",closer:"해찬"
}
},

schedule:[
["2026-08-24","준열팀","시환팀","정규"],
["2026-08-26","해찬팀","재우팀","정규"],
["2026-08-28","해찬팀","준열팀","정규"],
["2026-08-31","준열팀","재우팀","정규"],
["2026-09-02","준열팀","해찬팀","정규"],
["2026-09-04","해찬팀","시환팀","정규"],
["2026-09-07","준열팀","시환팀","정규"],
["2026-09-09","해찬팀","재우팀","정규"],
["2026-09-11","해찬팀","준열팀","정규"],
["2026-09-14","준열팀","재우팀","정규"],
["2026-09-16","준열팀","해찬팀","정규"],
["2026-09-18","해찬팀","시환팀","정규"],

["2026-08-25","시환팀","해찬팀","연습"],
["2026-08-27","재우팀","준열팀","연습"],
["2026-09-01","해찬팀","준열팀","연습"],
["2026-09-03","시환팀","재우팀","연습"],
["2026-09-08","시환팀","준열팀","연습"],
["2026-09-10","해찬팀","재우팀","연습"],
["2026-09-15","재우팀","시환팀","연습"],
["2026-09-17","준열팀","해찬팀","연습"]
].map(x=>({
date:x[0],away:x[1],home:x[2],type:x[3],time:"12:30"
})),

results:[],
stats:{},
predictions:{},
comments:[],
news:[
{
id:1,
date:"2026-08-22",
title:"CPL SPORTS 공식 포털 오픈",
content:"CPL의 경기 일정, 경기 결과, 팀 정보, 선수 기록, 순위, 뉴스와 승부예측을 한 곳에서 확인할 수 있습니다."
},
{
id:2,
date:"2026-08-22",
title:"CPL 정규시즌 일정 공개",
content:"정규경기는 월요일·수요일·금요일에 진행되며 경기 시간은 12:30으로 통일합니다. 연습경기는 화요일·목요일에 진행됩니다."
},
{
id:3,
date:"2026-08-22",
title:"CPL 4팀 운영 체계 확정",
content:"시환·해찬·재우·준열은 각 팀 감독으로 운영되며, 타자 6명과 투수 8명은 별도의 선수로 관리합니다."
}
],
settings:{
predictionUser:"CPL 팬",
adminPassword:"1234"
}
};

let data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");

if(!data){
data=structuredClone(defaultData);
save();
}

function save(){
localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

const menus=["홈","팀","일정","경기결과","순위","선수","통계","뉴스","규정"];

function $(id){return document.getElementById(id)}

function nav(active){
$("nav").innerHTML=menus.map(x=>
`<button class="${x===active?"on":""}" onclick="go('${x}')">${x}</button>`
).join("");
}

function go(page){
nav(page);
({
"홈":home,
"팀":teamsPage,
"일정":schedulePage,
"경기결과":resultsPage,
"순위":standingsPage,
"선수":playersPage,
"통계":statsPage,
"뉴스":newsPage,
"규정":rulesPage
}[page])();
}

function dateText(d){
const x=new Date(d+"T12:30:00");
return `${x.getMonth()+1}/${x.getDate()} (${["일","월","화","수","목","금","토"][x.getDay()]})`;
}

function allPlayers(){
let arr=[];
Object.values(data.teams).forEach(t=>{
arr.push(...t.hitters);
arr.push(...t.pitchers);
});
return [...new Set(arr)];
}

function getGame(date,home,away){
return data.schedule.find(g=>g.date===date&&g.home===home&&g.away===away);
}

function getResult(date,home,away){
return data.results.find(r=>r.date===date&&r.home===home&&r.away===away);
}

/* =========================
   HOME
========================= */

function home(){
const next=data.schedule
.filter(g=>!getResult(g.date,g.home,g.away))
.sort((a,b)=>a.date.localeCompare(b.date))
.slice(0,5);

$("main").innerHTML=`
<div class="hero">
<small>CPL SPORTS</small>
<h1>⚾ CPL 자체 스포츠 포털</h1>
<p>경기 · 일정 · 선수 · 기록 · 뉴스 · 승부예측</p>
</div>

<div class="grid">
<div class="card"><span class="muted">팀</span><div class="stat">4</div></div>
<div class="card"><span class="muted">선수</span><div class="stat">${allPlayers().length}</div></div>
<div class="card"><span class="muted">정규경기</span><div class="stat">${data.schedule.filter(x=>x.type==="정규").length}</div></div>
<div class="card"><span class="muted">경기시간</span><div class="stat">12:30</div></div>
</div>

<div class="two">
<div class="card">
<div class="sectionTitle"><h2>📅 다음 경기</h2><button class="gray" onclick="go('일정')">전체 ›</button></div>
${next.length?next.map(gameRow).join(""):`<div class="empty">예정된 경기가 없습니다.</div>`}
</div>

<div>
<div class="card">
<h2>📰 최신 뉴스</h2>
${data.news.slice().reverse().slice(0,3).map(n=>
`<div class="news" onclick="newsDetail(${n.id})">
<h3>${n.title}</h3>
<span class="muted">${n.date} · 내용 보기 ›</span>
</div>`).join("")}
</div>

<div class="card">
<h2>🔮 승부예측</h2>
<p class="muted">다음 경기를 예측해보세요.</p>
${next[0]?`<button class="primary" style="width:100%" onclick="gameDetail('${next[0].date}','${next[0].home}','${next[0].away}')">승부예측 참여 ›</button>`:""}
</div>
</div>
</div>`;
}

/* =========================
   GAME ROW
========================= */

function gameRow(g){
const r=getResult(g.date,g.home,g.away);

return `
<div class="match">
<div class="mdate">
<span class="badge ${g.type==="연습"?"practice":""}">${g.type}</span><br>
<span class="muted">${dateText(g.date)}<br>${g.time}</span>
</div>

<div class="mteam">${data.teams[g.away].icon}<br>${g.away}</div>

<div class="score">${r?`${r.awayScore}:${r.homeScore}`:"VS"}</div>

<div class="mteam">${data.teams[g.home].icon}<br>${g.home}</div>

<button class="gray" onclick="gameDetail('${g.date}','${g.home}','${g.away}')">›</button>
</div>`;
}

/* =========================
   TEAMS
========================= */

function teamsPage(){
$("main").innerHTML=`
<div class="card">
<h2>⚾ CPL 팀</h2>
<p class="muted">감독과 선수는 완전히 분리되어 관리됩니다.</p>
</div>

${Object.keys(data.teams).map(t=>{
const x=data.teams[t];

return `
<div class="team" onclick="teamDetail('${t}')">
<div class="teamhead">
<div class="teamname">
<i class="dot" style="background:${x.color}"></i>
${x.icon} ${t}
</div>
<span class="badge">상세 ›</span>
</div>

<div class="kpi">
<div><span class="muted">감독</span><strong>${x.manager}</strong></div>
<div><span class="muted">타자</span><strong>${x.hitters.length}명</strong></div>
<div><span class="muted">투수</span><strong>${x.pitchers.length}명</strong></div>
<div><span class="muted">마무리</span><strong>${x.closer}</strong></div>
</div>
</div>`;
}).join("")}`;
}

function teamDetail(team){
const t=data.teams[team];

modal(`
<button class="close" onclick="closeModal()">닫기</button>
<h2>${t.icon} ${team}</h2>

<div class="manager">
👔 감독 <b>${t.manager}</b>
</div>

<br>

<h3>🧢 타자 ${t.hitters.length}명</h3>
<div class="members">
${t.hitters.map((p,i)=>
`<div class="member" onclick="playerDetail('${p}')">
<b>${i+1}번 ${p}</b>
<span class="muted">타자</span>
</div>`).join("")}
</div>

<br>

<h3>⚾ 투수 ${t.pitchers.length}명</h3>
<div class="members">
${t.pitchers.map((p,i)=>
`<div class="member" onclick="playerDetail('${p}')">
<b>${p}</b>
<span class="muted">투수 ${i+1}</span>
</div>`).join("")}
</div>

<br>

<h3>🔥 투수진 운영</h3>
<div class="kpi">
<div><span>필승조</span><strong>${t.win}</strong></div>
<div><span>불펜</span><strong>${t.bull}</strong></div>
<div><span>마무리</span><strong>${t.closer}</strong></div>
<div><span>감독</span><strong>${t.manager}</strong></div>
</div>

<br>

<h3>🔄 선발 로테이션</h3>
<div class="notice">${t.starters.map((x,i)=>`${i+1}선발 ${x}`).join("　→　")}</div>
`);
}

/* =========================
   SCHEDULE
========================= */

function schedulePage(){
$("main").innerHTML=`
<div class="card">
<h2>📅 전체 일정</h2>
<div class="tabs">
<button class="on" onclick="filterSchedule('전체',this)">전체</button>
<button onclick="filterSchedule('정규',this)">정규</button>
<button onclick="filterSchedule('연습',this)">연습</button>
</div>
<div id="scheduleList">
${data.schedule.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(gameRow).join("")}
</div>
</div>`;
}

function filterSchedule(type,btn){
document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
btn.classList.add("on");

$("scheduleList").innerHTML=
data.schedule
.filter(g=>type==="전체"||g.type===type)
.sort((a,b)=>a.date.localeCompare(b.date))
.map(gameRow).join("");
}

/* =========================
   GAME DETAIL + PREDICTION
========================= */

function gameDetail(date,home,away){
const g=getGame(date,home,away);
const r=getResult(date,home,away);
const h=data.teams[home];
const a=data.teams[away];

const key=date+"_"+away+"_"+home;
const prediction=data.predictions[key];

let predictionHTML="";

if(!r){
predictionHTML=`
<div class="predict">
<h3>🔮 승부예측</h3>
<p class="muted">예상되는 결과를 선택하세요.</p>
<button class="gray" onclick="predict('${key}','${away}')">${a.icon} ${away} 승</button>
<button class="gray" onclick="predict('${key}','DRAW')">무승부</button>
<button class="gray" onclick="predict('${key}','${home}')">${h.icon} ${home} 승</button>
${prediction?`<p>내 예측: <b>${prediction}</b></p>`:""}
</div>`;
}else{
let result=r.awayScore>r.homeScore?away:r.homeScore>r.awayScore?home:"DRAW";
predictionHTML=`
<div class="notice">
🔮 승부예측 결과:
<b>${result==="DRAW"?"무승부":result}</b>
${prediction?`<br>내 예측: <b>${prediction}</b> · ${prediction===result?"🎯 적중":"❌ 미적중"}`:""}
</div>`;
}

modal(`
<button class="close" onclick="closeModal()">닫기</button>
<span class="badge ${g.type==="연습"?"practice":""}">${g.type}</span>
<p class="muted">${dateText(date)} · ${g.time}</p>

<h2 style="text-align:center">
${a.icon} ${away}
${r?`${r.awayScore} : ${r.homeScore}`:" VS "}
${home} ${h.icon}
</h2>

<div class="two">
<div class="card">
<h3>${away}</h3>
<p>선발: <b>${a.starters[0]}</b></p>
<p>필승조: <b>${a.win}</b></p>
<p>불펜: <b>${a.bull}</b></p>
<p>마무리: <b>${a.closer}</b></p>
</div>

<div class="card">
<h3>${home}</h3>
<p>선발: <b>${h.starters[0]}</b></p>
<p>필승조: <b>${h.win}</b></p>
<p>불펜: <b>${h.bull}</b></p>
<p>마무리: <b>${h.closer}</b></p>
</div>
</div>

${r?

:""}

/* =========================
   MVP AUTOMATIC
========================= */

function calculateMVP(home,away,homeScore,awayScore){
const candidates=[...data.teams[home].hitters,...data.teams[away].hitters];

let best=null;
let bestScore=-1;

candidates.forEach(p=>{
const s=data.stats[p]||{};

const score=
(s.h||0)*3+
(s.hr||0)*6+
(s.rbi||0)*4+
(s.sb||0)*2+
(s.k||0)*0.5;

if(score>bestScore){
bestScore=score;
best=p;
}
});

return {player:best,score:bestScore};
}

if(!confirm("뉴스를 삭제할까요?"))return;

data.news.splice(i,1);
save();
editNews();
}

/* =========================
   COMMENT ADMIN
========================= */

function editComments(){
let html=`
<button class="close" onclick="adminPage()">돌아가기</button>
<h2>💬 댓글 관리</h2>
`;

if(!data.comments.length){
html+=`<div class="empty">댓글이 없습니다.</div>`;
}else{
data.comments.forEach(c=>{
html+=`
<div class="card">
<b>${escapeHTML(c.name)}</b>
<p>${escapeHTML(c.text)}</p>
<small class="muted">${c.date}</small>
<br><br>
<button class="danger" onclick="adminDeleteComment(${c.id})">삭제</button>
</div>`;
});
}

$("main").innerHTML=html;
}

function adminDeleteComment(id){
data.comments=data.comments.filter(c=>c.id!==id);
save();
editComments();
}

/* =========================
   UTILITIES
========================= */

function escapeAttr(s){
return String(s)
.replaceAll("&","&amp;")
.replaceAll('"',"&quot;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");
}

function modal(html){
$("modalbox").innerHTML=html;
$("modal").classList.add("show");
}

function closeModal(){
$("modal").classList.remove("show");
}

$("modal").addEventListener("click",e=>{
if(e.target.id==="modal")closeModal();
});

   START
========================= */

nav("홈");
home();
