/* ---------- TEAM CALCULATION ---------- */

function getTeamStats(teamId){

  const played=games.filter(g=>
    g.status==="종료" &&
    (g.home===teamId||g.away===teamId)
  );

  let w=0,l=0,d=0,runs=0,allowed=0;

  played.forEach(g=>{
    const isHome=g.home===teamId;
    const my=isHome?g.homeScore:g.awayScore;
    const opp=isHome?g.awayScore:g.homeScore;

    runs+=Number(my||0);
    allowed+=Number(opp||0);

    if(my>opp)w++;
    else if(my<opp)l++;
    else d++;
  });

  const pct=played.length?
    (w+0.5*d)/played.length:0;

  let streak=0;
  let streakType="";

  [...played].reverse().some(g=>{
    const isHome=g.home===teamId;
    const my=isHome?g.homeScore:g.awayScore;
    const opp=isHome?g.awayScore:g.homeScore;

    const type=my>opp?"W":my<opp?"L":"D";

    if(!streakType)streakType=type;

    if(type!==streakType)return true;

    streak++;
    return false;
  });

  return {
    played:played.length,
    w,l,d,
    pct,
    runs,
    allowed,
    runAvg:played.length?runs/played.length:0,
    allowedAvg:played.length?allowed/played.length:0,
    streak,
    streakType
  };
}

function gameDiff(teamId){

  const stats=getTeamStats(teamId);

  const table=TEAMS.map(t=>({
    id:t.id,
    stats:getTeamStats(t.id)
  })).sort((a,b)=>
    b.stats.pct-a.stats.pct ||
    b.stats.w-a.stats.w
  );

  const index=table.findIndex(x=>x.id===teamId);

  if(index===0)return 0;

  const leader=table[0].stats;

  return (
    (leader.w-stats.w)+
    (stats.l-leader.l)
  )/2;
}

function headToHead(a,b){

  const list=games.filter(g=>
    g.status==="종료" &&
    (
      (g.home===a&&g.away===b)||
      (g.home===b&&g.away===a)
    )
  );

  let aw=0,bw=0,d=0;

  list.forEach(g=>{
    const aHome=g.home===a;
    const as=aHome?g.homeScore:g.awayScore;
    const bs=aHome?g.awayScore:g.homeScore;

    if(as>bs)aw++;
    else if(as<bs)bw++;
    else d++;
  });

  return {games:list.length,aw,bw,d};
}

function powerRank(){

  return TEAMS.map(t=>{
    const s=getTeamStats(t.id);

    const score=
      s.pct*60+
      Math.min(s.runAvg,20)*2+
      Math.max(0,20-s.allowedAvg)*1.5+
      s.streak*(s.streakType==="W"?3:-2);

    return {
      team:t,
      stats:s,
      score:Math.max(0,score)
    };
  }).sort((a,b)=>b.score-a.score);
}

function renderGames(){

      <span>${games.length}경기</span>
    </div>

function gameCards(list){

  if(!list.length){
    return `<div class="notice">경기가 없습니다.</div>`;
  }

  return list.map(g=>{

    const h=team(g.home);
    const a=team(g.away);

    let result="";

    if(g.status==="종료"){
      result=`
        <div style="font-size:26px;font-weight:900">
          ${g.homeScore} : ${g.awayScore}
        </div>
      `;
    }else{
      result=`
        <div style="font-size:14px;color:#888">
          ${g.time}
        </div>
      `;
    }

    return `
      <div
        class="card clickable"
        style="margin-bottom:10px"
        onclick="openGame('${g.id}')">

        <div class="space">
          <span class="small">
            ${fmtDate(g.date)} · ${g.time}
          </span>

          <span class="badge ${
            g.status==="종료"?"win":""
          }">
            ${g.status}
          </span>
        </div>

        <div
          class="match-teams"
          style="margin:25px 0">

          <div>
            <div>${h.name}</div>
          </div>

          <div>
            ${result}
          </div>

          <div>
            <div>${a.name}</div>
          </div>

        </div>

        <div class="small" style="text-align:center">
          클릭 → 경기정보 · 상대전적 · 팀전력 · 선수기록 · 예상 · 댓글
        </div>

      </div>
    `;
  }).join("");
}

function gameFilter(type,el){

  document.querySelectorAll(".tab")
    .forEach(x=>x.classList.remove("active"));

  el.classList.add("active");

  let list=[...games];

  if(type==="scheduled")
    list=list.filter(g=>g.status==="예정");

  if(type==="finished")
    list=list.filter(g=>g.status==="종료");

  if(type==="first")
    list=list.filter(g=>
      g.date>="2026-09-02" &&
      g.date<="2026-09-18"
    );

  if(type==="second")
    list=list.filter(g=>
      g.date>="2026-10-12" &&
      g.date<="2026-11-06"
    );

  document.getElementById("gameList").innerHTML=gameCards(list);
}

function gameTab(id,type,el){

  document.querySelectorAll(".modal-box .tab")
    .forEach(x=>x.classList.remove("active"));

  el.classList.add("active");

  const g=game(id);
  const h=team(g.home);
  const a=team(g.away);

  const box=document.getElementById("gameDetailContent");

  if(type==="info"){
    box.innerHTML=gameInfo(g);
    return;
  }

  if(type==="h2h"){

    const x=headToHead(g.home,g.away);

    box.innerHTML=`
      <div class="grid">

        <div class="card">
          <div class="small">맞대결</div>
          <div class="stat">${x.games}</div>
          <div class="muted">경기</div>
        </div>

        <div class="card">
          <div class="small">${h.name}</div>
          <div class="stat">${x.aw}</div>
          <div class="muted">승</div>
        </div>

        <div class="card">
          <div class="small">${a.name}</div>
          <div class="stat">${x.bw}</div>
          <div class="muted">승</div>
        </div>

        <div class="card">
          <div class="small">무승부</div>
          <div class="stat">${x.d}</div>
        </div>

      </div>
    `;

    return;
  }

  if(type==="power"){

    const hs=getTeamStats(g.home);
    const as=getTeamStats(g.away);

    box.innerHTML=`
      <div class="table-wrap">
        <table>
          <tr>
            <th>항목</th>
            <th>${h.name}</th>
            <th>${a.name}</th>
          </tr>

          <tr>
            <td>승률</td>
            <td>${(hs.pct*100).toFixed(1)}%</td>
            <td>${(as.pct*100).toFixed(1)}%</td>
          </tr>

          <tr>
            <td>득점력</td>
            <td>${hs.runAvg.toFixed(2)}</td>
            <td>${as.runAvg.toFixed(2)}</td>
          </tr>

          <tr>
            <td>실점력</td>
            <td>${hs.allowedAvg.toFixed(2)}</td>
            <td>${as.allowedAvg.toFixed(2)}</td>
          </tr>

          <tr>
            <td>연승/연패</td>
            <td>${streakText(hs)}</td>
            <td>${streakText(as)}</td>
          </tr>

          <tr>
            <td>게임차</td>
            <td>${gameDiff(g.home).toFixed(1)}</td>
            <td>${gameDiff(g.away).toFixed(1)}</td>
          </tr>
        </table>
      </div>
    `;

    return;
  }

  if(type==="players"){

    box.innerHTML=`
      <div class="grid">
        ${PLAYERS.map(p=>`
          <div class="card clickable"
            onclick="openPlayer('${p}')">
            <h3>${p}</h3>
            <div class="muted">
              선수 상세 기록 보기
            </div>
          </div>
        `).join("")}
      </div>
    `;

    return;
  }

  if(type==="predict"){

    const hs=getTeamStats(g.home);
    const as=getTeamStats(g.away);

    let hScore=
      50+
      (hs.pct-as.pct)*35+
      (hs.runAvg-as.runAvg)*2+
      (as.allowedAvg-hs.allowedAvg)*1.5;

    hScore=Math.max(5,Math.min(95,hScore));

    box.innerHTML=`
      <div class="grid">

        <div class="card">
          <div class="small">${h.name} 예상 승률</div>
          <div class="stat">${hScore.toFixed(1)}%</div>
        </div>

        <div class="card">
          <div class="small">${a.name} 예상 승률</div>
          <div class="stat">${(100-hScore).toFixed(1)}%</div>
        </div>

      </div>

      <div class="section">
        <div class="notice">
          현재 시즌 승률 · 득점력 · 실점력 · 최근 흐름을
          이용한 CPL 내부 예상치입니다.
        </div>
      </div>
    `;

    return;
  }

  if(type==="comments"){
    renderComments(id,box);
  }
}

function streakText(s){

  if(!s.streak)return "-";

  if(s.streakType==="W")
    return `🔥 ${s.streak}연승`;

  if(s.streakType==="L")
    return `⚠️ ${s.streak}연패`;

  return `${s.streak}경기`;
}

function renderComments(gameId,box){

  const list=comments.filter(c=>c.gameId===gameId);

  box.innerHTML=`

    <div class="card">

      <div class="field">
        <label>완전 익명 댓글</label>
        <textarea
          id="commentText"
          placeholder="댓글을 입력하세요"></textarea>
      </div>

      <button
        class="btn primary"
        style="margin-top:10px"
        onclick="addComment('${gameId}')">
        댓글 등록
      </button>

    </div>

    <div class="section">

      ${
        list.length
        ?
        list.map(c=>`
          <div class="comment">

            <div class="space">
              <b>익명</b>
              <span class="small">
                ${escapeHTML(c.date)}
              </span>
            </div>

            <div style="margin-top:7px">
              ${escapeHTML(c.text)}
            </div>

            ${
              adminMode?
              `<button
                class="btn"
                style="margin-top:7px"
                onclick="deleteComment('${c.id}','${gameId}')">
                삭제
              </button>`:""
            }

          </div>
        `).join("")
        :
        `<div class="muted">아직 댓글이 없습니다.</div>`
      }

    </div>
  `;
}

function addComment(gameId){

  const input=document.getElementById("commentText");

  if(!input||!input.value.trim())return;

  comments.push({
    id:"C"+Date.now(),
    gameId,
    text:input.value.trim(),
    date:new Date().toLocaleString("ko-KR")
  });

  saveLocal();

  const box=document.getElementById("gameDetailContent");

  renderComments(gameId,box);
}

function deleteComment(id,gameId){

  comments=comments.filter(c=>c.id!==id);

  saveLocal();

  renderComments(
    gameId,
    document.getElementById("gameDetailContent")
  );
}

      games:0,
      ab:0,
      hits:0,
      hr:0,
      rbi:0,
      runs:0,
      walks:0,
      k:0,

      er:0,

      starts:0,
      FS:0,
      DS:0,
      CS:0,

  return playerStats[p];
}

  s.hits+=Number(document.getElementById("stH").value||0);
  s.hr+=Number(document.getElementById("stHR").value||0);
  s.rbi+=Number(document.getElementById("stRBI").value||0);
  s.k+=Number(document.getElementById("stK").value||0);
  s.ip+=Number(document.getElementById("stIP").value||0);
  s.er+=Number(document.getElementById("stER").value||0);
  s.starts+=Number(document.getElementById("stStart").value||0);

  saveLocal();

/* ---------- BACKUP ---------- */

function backupData(){

  const data={
    games,
    comments,
    playerStats,
    teams:TEAMS,
    season:SEASON,
    backupDate:new Date().toISOString()
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download="CPL-backup.json";
  a.click();

  URL.revokeObjectURL(url);
}
