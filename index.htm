<script>

/* =====================================================
   CPL DATA
===================================================== */

const TEAMS = {

    {id:4,name:"민푹",team:"민푹",role:"투타겸업"}
];


/* =====================================================
   SCHEDULE
===================================================== */

const GAMES = [

    /* 전반기 */
    {id:"G001",date:"2026-09-02",a:"시환",b:"해찬"},
    {id:"G002",date:"2026-09-04",a:"재우",b:"민푹"},
    {id:"G003",date:"2026-09-07",a:"시환",b:"재우"},
    {id:"G004",date:"2026-09-09",a:"해찬",b:"민푹"},
    {id:"G005",date:"2026-09-11",a:"시환",b:"민푹"},
    {id:"G006",date:"2026-09-14",a:"재우",b:"해찬"},
    {id:"G007",date:"2026-09-16",a:"시환",b:"해찬"},
    {id:"G008",date:"2026-09-18",a:"재우",b:"민푹"},

    /* 후반기 */
    {id:"G009",date:"2026-10-12",a:"시환",b:"재우"},
    {id:"G010",date:"2026-10-14",a:"해찬",b:"민푹"},
    {id:"G011",date:"2026-10-16",a:"시환",b:"민푹"},
    {id:"G012",date:"2026-10-19",a:"재우",b:"해찬"},
    {id:"G013",date:"2026-10-21",a:"시환",b:"해찬"},
    {id:"G014",date:"2026-10-23",a:"재우",b:"민푹"},
    {id:"G015",date:"2026-10-26",a:"시환",b:"재우"},
    {id:"G016",date:"2026-10-28",a:"해찬",b:"민푹"},
    {id:"G017",date:"2026-10-30",a:"시환",b:"민푹"},
    {id:"G018",date:"2026-11-02",a:"재우",b:"해찬"},
    {id:"G019",date:"2026-11-04",a:"시환",b:"해찬"},
    {id:"G020",date:"2026-11-06",a:"재우",b:"민푹"}
];


/* =====================================================
   LOCAL DATA
===================================================== */

let results =
    JSON.parse(localStorage.getItem("CPL_RESULTS") || "{}");

let comments =
    JSON.parse(localStorage.getItem("CPL_COMMENTS") || "[]");

let predictions =
    JSON.parse(localStorage.getItem("CPL_PREDICTIONS") || "[]");

let currentUser =
    JSON.parse(localStorage.getItem("CPL_USER") || "null");

let isAdmin =
    sessionStorage.getItem("CPL_ADMIN") === "true";


/* =====================================================
   NAVIGATION
===================================================== */

const MENU = [
    ["home","🏠 홈"],
    ["schedule","📅 일정"],
    ["players","👤 선수"],
    ["rankings","🏆 랭킹"],
    ["teams","🏟️ 팀"],
    ["analysis","📊 자동분석"],
    ["fun","🎮 CPL 재미"],
    ["news","📰 뉴스"],
    ["community","💬 커뮤니티"]
];

function makeNav(){

    document.getElementById("nav").innerHTML =
        MENU.map(item => `
            <button onclick="showPage('${item[0]}')">
                ${item[1]}
            </button>
        `).join("");
}

function showPage(id){

    document.querySelectorAll(".page")
        .forEach(page => page.classList.remove("active"));

    const target = document.getElementById(id);

    if(!target) return;

    target.classList.add("active");

    if(id === "home") home();
    if(id === "schedule") schedule();
    if(id === "players") players();
    if(id === "rankings") rankings();
    if(id === "teams") teams();
    if(id === "analysis") analysis();
    if(id === "fun") fun();
    if(id === "news") news();
    if(id === "community") community();
    if(id === "account") account();
    if(id === "admin") adminPage();

    document.querySelectorAll("#nav button")
        .forEach(btn => btn.classList.remove("active"));

    const buttons = document.querySelectorAll("#nav button");

    MENU.forEach((item,index)=>{
        if(item[0] === id && buttons[index]){
            buttons[index].classList.add("active");
        }
    });

    window.scrollTo(0,0);
}


/* =====================================================
   SAVE
===================================================== */

function saveAll(){

    localStorage.setItem(
        "CPL_RESULTS",
        JSON.stringify(results)
    );

    localStorage.setItem(
        "CPL_COMMENTS",
        JSON.stringify(comments)
    );

    localStorage.setItem(
        "CPL_PREDICTIONS",
        JSON.stringify(predictions)
    );

    localStorage.setItem(
        "CPL_USER",
        JSON.stringify(currentUser)
    );
}


/* =====================================================
   UTIL
===================================================== */

function teamName(team){

    return TEAMS[team]
        ? TEAMS[team].icon + " " + TEAMS[team].name
        : team;
}

function findGame(id){

    return GAMES.find(g => g.id === id);
}

function statBox(title,value){

    return `
        <div class="card stat">
            <span>${title}</span>
            <b>${value}</b>
        </div>
    `;
}

function toast(message){

    const box = document.getElementById("toast");

    box.innerText = message;
    box.style.display = "block";

    setTimeout(()=>{
        box.style.display = "none";
    },2200);
}


/* =====================================================
   HOME
===================================================== */

function home(){

    const next = GAMES.find(g => !results[g.id]) || GAMES[0];

    document.getElementById("home").innerHTML = `

        <div class="hero">

            <small>CPL 2026</small>

            <h1>

                VS
                ${teamName(next.b)}
            </h1>

            <p class="muted">
                ${next.date} · 12:30
            </p>

            <button class="btn primary"
                onclick="openGame('${next.id}')">
                경기 상세
            </button>

            <button class="btn"
                onclick="openPrediction('${next.id}')">
                🎯 승부예측
            </button>

        </div>

        <div class="section">
            <h2>🔥 핫한 선수</h2>
        </div>

        <div class="grid g4">
            ${PLAYERS.map(playerCard).join("")}
        </div>

        <div class="section">
            <h2>📢 공지사항</h2>
        </div>

        <div class="card">

            <div class="notice">
                <b>개막전</b><br>
                9월 2일 · 시환팀 VS 해찬팀
            </div>

            <div class="notice">
                <b>전반기</b><br>
                9월 2일 ~ 9월 18일
            </div>

            <div class="notice">
                <b>후반기</b><br>
                10월 12일 ~ 11월 6일
            </div>

        </div>

        <div class="section">
            <h2>🏆 팀 순위</h2>
        </div>

        ${teamTable()}

    `;
}


/* =====================================================
   SCHEDULE
===================================================== */

function schedule(){

    document.getElementById("schedule").innerHTML = `

        <div class="hero">

            <small>SCHEDULE</small>

            <h1>📅 CPL 경기 일정</h1>

            <p class="muted">
                월요일 · 수요일 · 금요일 / 12:30
            </p>

        </div>

        <div class="grid g2">

            <div class="card">
                <h2>전반기</h2>
                <h3>9월 2일 ~ 9월 18일</h3>
                <p class="muted">
                    개막전: 시환팀 VS 해찬팀
                </p>
            </div>

            <div class="card">
                <h2>후반기</h2>
                <h3>10월 12일 ~ 11월 6일</h3>
                <p class="muted">
                    월 · 수 · 금 경기
                </p>
            </div>

        </div>

        <div class="section">
            <h2>⚾ 전체 경기</h2>
        </div>

        <div class="grid g2">
            ${GAMES.map(gameCard).join("")}
        </div>

    `;
}

function gameCard(g){

    const result = results[g.id];

    return `

        <div class="card click"
             onclick="openGame('${g.id}')">

            <div class="muted">
                ${g.date} · 12:30
            </div>

            <div class="match">

                <div class="team">
                    ${teamName(g.a)}
                </div>

                <div class="score">
                    ${result
                        ? result.a + " : " + result.b
                        : "VS"}
                </div>

                <div class="team">
                    ${teamName(g.b)}
                </div>

            </div>

            <p class="muted">
                ${result ? "경기 종료" : "경기 예정"}
            </p>

        </div>
    `;
}


/* =====================================================
   GAME DETAIL
===================================================== */

function openGame(id){

    const g = findGame(id);

    if(!g) return;

    modal(`

        <button class="close"
            onclick="closeModal()">×</button>

        <small>GAME CENTER</small>

        <h1>
            ${teamName(g.a)}
            VS
            ${teamName(g.b)}
        </h1>

        <p class="muted">
            ${g.date} · 12:30
        </p>

        <div class="tabs">

            <button class="active"
                onclick="gameTab('${id}','info',this)">
                경기정보
            </button>

            <button
                onclick="gameTab('${id}','head',this)">
                상대전적
            </button>

            <button
                onclick="gameTab('${id}','power',this)">
                팀전력
            </button>

            <button
                onclick="gameTab('${id}','recent',this)">
                최근 5경기
            </button>

            <button
                onclick="gameTab('${id}','players',this)">
                선수기록
            </button>

            <button
                onclick="openPrediction('${id}')">
                🎯 승부예측
            </button>

            <button
                onclick="gameTab('${id}','comments',this)">
                💬 댓글
            </button>

        </div>

        <div id="gameContent">
            ${gameInfo(g)}
        </div>

    `);
}

function gameTab(id,type,button){

    document.querySelectorAll(".tabs button")
        .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    const g = findGame(id);

    let html = "";

    if(type === "info")
        html = gameInfo(g);

    if(type === "head")
        html = headToHead(g);

    if(type === "power")
        html = teamPower(g);

    if(type === "recent")
        html = recentGames(g);

    if(type === "players")
        html = gamePlayers(g);

    if(type === "comments")
        html = gameComments(g);

    document.getElementById("gameContent").innerHTML = html;
}

function gameInfo(g){

    const r = results[g.id];

    return `

        <div class="grid g3">

            ${statBox("상태",r ? "종료" : "예정")}

            ${statBox(
                "스코어",
                r ? `${r.a} : ${r.b}` : "VS"
            )}

            ${statBox(
                "MVP",
                r?.mvp || "-"
            )}

        </div>

        <div class="section">
            <h2>📌 경기 정보</h2>
        </div>

        <div class="card">

            <p>
                ${teamName(g.a)}
                VS
                ${teamName(g.b)}
            </p>

            <p class="muted">
                경기일: ${g.date}
            </p>

            <p class="muted">
                경기시간: 12:30
            </p>

        </div>

    `;
}


/* =====================================================
   HEAD TO HEAD
===================================================== */

function headToHead(g){

    let games = GAMES.filter(x =>
        results[x.id] &&
        (
            (x.a === g.a && x.b === g.b) ||
            (x.a === g.b && x.b === g.a)
        )
    );

    let aWins = 0;
    let bWins = 0;

    games.forEach(x=>{

        const r = results[x.id];

        if(x.a === g.a){

            if(r.a > r.b) aWins++;
            if(r.b > r.a) bWins++;

        }else{

            if(r.b > r.a) aWins++;
            if(r.a > r.b) bWins++;

        }

    });

    return `

        <div class="grid g3">

            ${statBox("맞대결",games.length+"경기")}

            ${statBox(g.a+" 승",aWins)}

            ${statBox(g.b+" 승",bWins)}

        </div>

        <div class="section">
            <h2>📊 상대전적</h2>
        </div>

        <div class="card table-wrap">

            <table>

                <tr>
                    <th>항목</th>
                    <th>${g.a}</th>
                    <th>${g.b}</th>
                </tr>

                <tr>
                    <td>승률</td>
                    <td>
                        ${games.length
                            ? (aWins/games.length*100).toFixed(1)+"%"
                            : "-"}
                    </td>
                    <td>
                        ${games.length

function recentGames(g){

    `;
}

function teamRecent(team){

    const arr = GAMES.filter(g =>
        results[g.id] &&
        (g.a === team || g.b === team)
    ).slice(-5);

    if(!arr.length){
        return `<div class="empty">최근 경기 없음</div>`;
    }

    return arr.map(g=>{

        const r = results[g.id];

        return `
            <div class="notice">
                ${g.date}<br>
                ${g.a} ${r.a} : ${r.b} ${g.b}
            </div>
        `;

    }).join("");
}

function gameComments(g){

    );

    return `

            arr.length

              </div>`
        }

                id="commentText"
                placeholder="경기에 대한 의견을 남겨주세요">

                onclick="addComment('${g.id}')">

            </button>

function addComment(id){

    if(!currentUser){

        toast("먼저 일반 계정으로 로그인하세요.");

        showPage("account");

        return;
    }

    const input =
        document.getElementById("commentText");

    if(!input) return;

    const text = input.value.trim();

    if(!text){
        toast("댓글 내용을 입력하세요.");
        return;
    }

    comments.push({
        gameId:id,
        user:currentUser.name,
        text:text,
        time:new Date().toLocaleString("ko-KR")
    });

    saveAll();

    toast("댓글이 등록되었습니다.");

    openGame(id);
}

function openPrediction(id){

    const g = findGame(id);

    modal(`

        <button class="close"
            onclick="closeModal()">×</button>

        <small>PREDICTION</small>

        <h1>🎯 승부예측</h1>

        <h2>
            ${teamName(g.a)}
            VS
            ${teamName(g.b)}
        </h2>

        ${
            currentUser
            ? `
                <div class="form">

                    <select id="predictionWinner">

                        <option value="${g.a}">
                            ${g.a} 승
                        </option>

                        <option value="${g.b}">
                            ${g.b} 승
                        </option>

                    </select>

                    <div class="grid g2">

                        <input
                            id="predictionA"
                            type="number"
                            min="0"
                            placeholder="${g.a} 예상 점수">

                        <input
                            id="predictionB"
                            type="number"
                            min="0"
                            placeholder="${g.b} 예상 점수">

                    </div>

                    <select id="predictionMvp">

                        <option value="">
                            예상 MVP
                        </option>

                        ${
                            PLAYERS
                            .filter(p =>
                                p.team === g.a ||
                                p.team === g.b
                            )
                            .map(p =>
                                `<option value="${p.name}">
                                    ${p.name}
                                </option>`
                            ).join("")
                        }

                    </select>

                    <button
                        class="btn primary"
                        onclick="savePrediction('${id}')">
                        예측 저장
                    </button>

                </div>
            `
            : `
                <div class="empty">
                    승부예측을 하려면
                    일반 계정으로 로그인하세요.
                    <br><br>
                    <button
                        class="btn primary"
                        onclick="closeModal();showPage('account')">
                        계정 만들기
                    </button>
                </div>
            `
        }

    `);
}

function savePrediction(id){

    if(!currentUser){
        toast("로그인이 필요합니다.");
        return;
    }

    const winner =
        document.getElementById("predictionWinner").value;

    const a =
        Number(document.getElementById("predictionA").value);

    const b =
        Number(document.getElementById("predictionB").value);

    const mvp =
        document.getElementById("predictionMvp").value;

    predictions.push({
        gameId:id,
        user:currentUser.name,
        winner:winner,
        a:a || 0,
        b:b || 0,
        mvp:mvp,
        time:new Date().toLocaleString("ko-KR")
    });

    saveAll();

    closeModal();

    toast("승부예측이 저장되었습니다.");
}

function loginUser(){

    const input =
        document.getElementById("userName");

    const name = input.value.trim();

        return;

    currentUser = {
        name:name,
        role:"user"
    };

    account();
}

function logoutUser(){

function editResult(id){

    if(!isAdmin){

        toast("관리자 로그인이 필요합니다.");

        return;
    }

    const g = findGame(id);

    const old = results[id] || {};

    modal(`

        <button class="close"
            onclick="closeModal()">×</button>

        <small>GAME RESULT</small>

        <h1>
            ${teamName(g.a)}
            VS
            ${teamName(g.b)}
        </h1>

        <div class="form">

            <label>
                ${g.a} 득점
            </label>

            <input
                id="resultA"
                type="number"
                min="0"
                value="${old.a ?? ""}">

            <label>
                ${g.b} 득점
            </label>

            <input
                id="resultB"
                type="number"
                min="0"
                value="${old.b ?? ""}">

            <label>
                MVP
            </label>

            <select id="resultMvp">

                <option value="">
                    선택
                </option>

                ${
                    PLAYERS
                    .filter(p =>
                        p.team === g.a ||
                        p.team === g.b
                    )
                    .map(p=>`
                        <option
                            value="${p.name}"
                            ${old.mvp === p.name ? "selected":""}>
                            ${p.name}
                        </option>
                    `).join("")
                }

            </select>

            <button
                class="btn primary"
                onclick="saveResult('${id}')">
                경기 결과 저장
            </button>

        </div>

    `);
}

function saveResult(id){

    if(!isAdmin){

        toast("관리자 로그인이 필요합니다.");

        return;
    }

    const a =
        Number(document.getElementById("resultA").value);

    const b =
        Number(document.getElementById("resultB").value);

    const mvp =
        document.getElementById("resultMvp").value;

    if(a < 0 || b < 0){

        toast("점수를 확인하세요.");

        return;
    }

    results[id] = {
        a:a,
        b:b,
        mvp:mvp
    };

    saveAll();

    closeModal();

    toast("경기 결과가 저장되었습니다.");

    adminPage();
}

function adminLogout(){

    isAdmin = false;

    sessionStorage.removeItem("CPL_ADMIN");

    toast("관리자 로그아웃");

    showPage("home");
}


/* =====================================================
   NOTICE
===================================================== */

function addNotice(){

    const title =
        document.getElementById("noticeTitle").value.trim();

    const text =
        document.getElementById("noticeText").value.trim();

    if(!title || !text){

        toast("제목과 내용을 입력하세요.");

        return;
    }

    const notices =
        JSON.parse(
            localStorage.getItem("CPL_NOTICES") || "[]"
        );

    notices.push({
        title:title,
        text:text,
        date:new Date().toLocaleString("ko-KR")
    });

    localStorage.setItem(
        "CPL_NOTICES",
        JSON.stringify(notices)
    );

    toast("공지 등록 완료");

    adminSection("공지관리");
}


/* =====================================================
   COMMENT DELETE
===================================================== */

function deleteComment(index){

    if(!isAdmin){

        toast("관리자 로그인이 필요합니다.");

        return;
    }

    if(!confirm("이 댓글을 삭제할까요?"))
        return;

    comments.splice(index,1);

    saveAll();

    toast("댓글 삭제 완료");

    adminSection("댓글관리");
}


/* =====================================================
   MODAL
===================================================== */

function modal(html){

    document.getElementById("modalBox").innerHTML = html;

    document.getElementById("modal")
        .classList.add("open");
}

function closeModal(){

    document.getElementById("modal")
        .classList.remove("open");
}

document.getElementById("modal")
    .addEventListener("click",function(e){

        if(e.target === this){
            closeModal();
        }

    });


/* =====================================================
   SECURITY HELPER
===================================================== */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

   START
===================================================== */

home();

</script>
