<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CPL SPORTS</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f6f8;
  color:#191f28;
  font-family:Arial,"Noto Sans KR",sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1200px;margin:auto}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid #e9edf2
}
.top{
  height:68px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between
}
.logo{
  font-size:27px;
  font-weight:900;
  color:#3182f6
}
.logo span{color:#191f28}

.admin{
  border:0;
  background:#191f28;
  color:#fff;
  border-radius:12px;
  padding:10px 14px;
  font-weight:800
}

.nav{
  display:flex;
  gap:5px;
  padding:0 15px 10px;
  overflow-x:auto
}
.nav button{
  border:0;
  background:#fff;
  border-radius:12px;
  padding:10px 15px;
  font-weight:800;
  white-space:nowrap
}
.nav button.on{
  background:#e8f3ff;
  color:#3182f6
}

main{padding:22px 16px 80px}

.hero{
  background:#191f28;
  color:white;
  border-radius:24px;
  padding:30px;
  margin-bottom:16px
}
.hero h1{font-size:31px;margin:8px 0}
.hero p{color:#c8d0d9;margin:0}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}
.two{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:14px
}
.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 2px 12px #00000008
}
.card h2{margin:0 0 15px}

.muted{color:#8b95a1}
.stat{font-size:29px;font-weight:900;margin-top:5px}

.match{
  display:flex;
  align-items:center;
  gap:10px;
  padding:15px 0;
  border-bottom:1px solid #edf0f2
}
.match:last-child{border-bottom:0}
.mdate{width:105px;font-size:13px}
.mteam{flex:1;text-align:center;font-weight:900}
.score{
  min-width:70px;
  text-align:center;
  font-size:21px;
  font-weight:900
}

.badge{
  display:inline-block;
  background:#eef1f5;
  color:#66717d;
  border-radius:8px;
  padding:5px 9px;
  font-size:12px;
  font-weight:800
}
.practice{
  background:#f0edff;
  color:#6845e8
}
.replace{
  background:#fff0d7;
  color:#a65c00
}

.gray,.primary,.danger,.dark{
  border:0;
  border-radius:12px;
  padding:11px 15px;
  font-weight:800
}
.gray{background:#eef1f5}
.primary{background:#3182f6;color:#fff}
.danger{background:#ffe8ea;color:#d9303e}
.dark{background:#191f28;color:#fff}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px
}
.tabs button{
  border:0;
  background:#eef1f5;
  border-radius:11px;
  padding:9px 14px;
  font-weight:800
}
.tabs button.on{
  background:#3182f6;
  color:#fff
}

.team{
  background:#fff;
  border-radius:20px;
  padding:20px;
  margin-bottom:14px;
  cursor:pointer;
  box-shadow:0 2px 12px #00000008
}
.teamhead{
  display:flex;
  align-items:center;
  justify-content:space-between
}
.teamname{font-size:21px;font-weight:900}
.dot{
  display:inline-block;
  width:13px;
  height:13px;
  border-radius:50%;
  margin-right:8px
}

.kpi{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}
.kpi div{
  background:#f7f8fa;
  border-radius:14px;
  padding:14px
}
.kpi strong{
  display:block;
  font-size:20px;
  margin-top:4px
}

.members{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px
}
.member{
  background:#f7f8fa;
  border-radius:12px;
  padding:12px;
  cursor:pointer
}
.member b{
  display:block;
  margin-bottom:3px
}

.list{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid #edf0f2
}

table{
  width:100%;
  border-collapse:collapse
}
th,td{
  padding:11px 7px;
  border-bottom:1px solid #e9edf2;
  text-align:center
}
th{
  background:#fafbfc;
  color:#78838e;
  font-size:13px
}

.news{
  padding:16px 0;
  border-bottom:1px solid #e9edf2;
  cursor:pointer
}
.news h3{margin:0 0 7px}

.notice{
  background:#e8f3ff;
  color:#176bd3;
  padding:14px;
  border-radius:14px;
  margin-bottom:15px
}

.form{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #dfe3e8;
  border-radius:11px;
  background:white
}
textarea{
  min-height:120px;
  resize:vertical
}

.empty{
  text-align:center;
  padding:35px;
  color:#8b95a1
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px
}
.modal.show{display:flex}

.modalbox{
  background:#fff;
  width:100%;
  max-width:850px;
  max-height:92vh;
  overflow:auto;
  border-radius:22px;
  padding:22px
}

.close{
  float:right;
  border:0;
  background:#eef1f5;
  border-radius:10px;
  padding:7px 11px
}

.comment{
  padding:12px 0;
  border-bottom:1px solid #edf0f2
}
.comment b{display:block}
.comment small{color:#929aa4}

.predict{
  border:1px solid #e4e8ed;
  border-radius:15px;
  padding:15px;
  margin:10px 0
}
.predict button{margin:4px}

.manager{
  background:#191f28;
  color:#fff;
  border-radius:13px;
  padding:13px
}

.sectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px
}

.rank1{
  background:#fff8df
}
.rank2{
  background:#f4f5f7
}
.rank3{
  background:#fff0e7
}

.starting{
  background:#e8f3ff;
  color:#176bd3;
  padding:10px;
  border-radius:12px;
  font-weight:800
}

.substitute{
  background:#fff4df;
  color:#9b5b00;
  padding:10px;
  border-radius:12px;
  font-weight:800
}

@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .kpi{grid-template-columns:repeat(2,1fr)}
  .form{grid-template-columns:1fr}
  .members{grid-template-columns:1fr}
  .mdate{width:80px}
}
</style>
</head>

try{
  data=JSON.parse(localStorage.getItem(STORAGE_KEY));
}catch(e){
  data=null;
}

if(!data){
  data=structuredClone(defaultData);
  save();
}

/* 구버전 데이터 보정 */
function normalizeData(){

  if(!data.teams) data.teams=structuredClone(defaultData.teams);
  if(!data.schedule) data.schedule=structuredClone(defaultData.schedule);
  if(!data.results) data.results=[];
  if(!data.stats) data.stats={};
  if(!data.predictions) data.predictions={};
  if(!data.comments) data.comments=[];
  if(!data.news) data.news=structuredClone(defaultData.news);
  if(!data.overrides) data.overrides={};
  if(!data.settings) data.settings={adminPassword:"1234"};

  Object.keys(defaultData.teams).forEach(team=>{

    if(!data.teams[team]){
      data.teams[team]=structuredClone(defaultData.teams[team]);
      return;
    }

    const t=data.teams[team];

    if(!Array.isArray(t.hitters) || t.hitters.length!==6)
      t.hitters=structuredClone(defaultData.teams[team].hitters);

    if(!Array.isArray(t.pitchers) || t.pitchers.length!==8)
      t.pitchers=structuredClone(defaultData.teams[team].pitchers);

    if(!Array.isArray(t.starters) || t.starters.length!==5)
      t.starters=structuredClone(defaultData.teams[team].starters);

  });

  save();
}

normalizeData();

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function $(id){
  return document.getElementById(id);
}

/* =========================================================
   NAVIGATION
   ========================================================= */

const menus=[
  "홈","팀","일정","경기결과",
  "순위","선수","통계","뉴스","규정"
];

function nav(active){

  $("nav").innerHTML=menus.map(x=>
    `<button class="${x===active?"on":""}" data-page="${x}">${x}</button>`
  ).join("");

  document.querySelectorAll("#nav button").forEach(btn=>{
    btn.onclick=()=>go(btn.dataset.page);
  });
}

function go(page){

  nav(page);

  const pages={
    "홈":home,
    "팀":teamsPage,
    "일정":schedulePage,
    "경기결과":resultsPage,
    "순위":standingsPage,
    "선수":playersPage,
    "통계":statsPage,
    "뉴스":newsPage,
    "규정":rulesPage
  };

  if(pages[page]) pages[page]();
}

/* =========================================================
   UTIL
   ========================================================= */

function dateText(d){

  const x=new Date(d+"T12:30:00");

  return `${x.getMonth()+1}/${x.getDate()} (${
    ["일","월","화","수","목","금","토"][x.getDay()]
  })`;
}

function allPlayers(){

  const arr=[];

  Object.values(data.teams).forEach(t=>{
    arr.push(...t.hitters);
    arr.push(...t.pitchers);
  });

  return [...new Set(arr)];
}

function getGame(date,home,away){

  return data.schedule.find(
    g=>g.date===date &&
       g.home===home &&
       g.away===away
  );
}

function getResult(date,home,away){

  return data.results.find(
    r=>r.date===date &&
       r.home===home &&
       r.away===away
  );
}

function gameKey(date,home,away){

  return `${date}_${away}_${home}`;
}

function escapeHTML(s){

  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(s){

  return escapeHTML(s);
}

/* =========================================================
   ⭐ 선발 로테이션 핵심
   =========================================================

   팀별 경기 횟수를 계산해서
   0 -> 1선발
   1 -> 2선발
   ...
   4 -> 5선발
   5 -> 다시 1선발

   단,
   관리자가 특정 경기에서 대체투수를 선택하면
   그 경기만 override로 사용.
*/

function regularGamesForTeam(team){

  return data.schedule
    .filter(g=>
      g.type==="정규" &&
      (g.home===team || g.away===team)
    )
    .sort((a,b)=>a.date.localeCompare(b.date));
}

function getRotationIndex(team,game){

  const games=regularGamesForTeam(team);

  const index=games.findIndex(g=>
    g.date===game.date &&
    g.home===game.home &&
    g.away===game.away
  );

  if(index<0) return 0;

  return index%5;
}

function getAutoStarter(team,game){

  const t=data.teams[team];

  if(!t || !Array.isArray(t.starters)) return "";

  const idx=getRotationIndex(team,game);

  return t.starters[idx] || "";
}

/*
  관리자가 특정 경기에서 선택한 대체 선발.
*/
function getStarter(team,game){

  const key=gameKey(game.date,game.home,game.away);

  const o=data.overrides[key];

  if(o && o[team]){

    if(data.teams[team].pitchers.includes(o[team])){
      return {
        name:o[team],
        replaced:true,
        reason:"관리자 선택 대체"
      };
    }
  }

  return {
    name:getAutoStarter(team,game),
    replaced:false,
    reason:"자동 로테이션"
  };
}

/* =========================================================

    <div>

        ${

              <h3>${escapeHTML(n.title)}</h3>
              <span class="muted">

  $("homeSchedule").onclick=()=>go("일정");

  document.querySelectorAll("[data-news]").forEach(el=>{

        <p>

/* =========================================================
   STANDINGS
   ========================================================= */

function standingsPage(){

  const d={};

  Object.keys(data.teams).forEach(t=>{
    d[t]={
      g:0,
      w:0,
      l:0,
      draw:0,
      rs:0,
      ra:0
    };
  });

  data.results
    .filter(r=>r.type==="정규")
    .forEach(r=>{

      if(!d[r.home]||!d[r.away])return;

      d[r.home].g++;
      d[r.away].g++;

      d[r.home].rs+=r.homeScore;
      d[r.home].ra+=r.awayScore;

      d[r.away].rs+=r.awayScore;
      d[r.away].ra+=r.homeScore;

      if(r.homeScore>r.awayScore){

        d[r.home].w++;
        d[r.away].l++;

      }else if(r.homeScore<r.awayScore){

        d[r.away].w++;
        d[r.home].l++;

      }else{

        d[r.home].draw++;
        d[r.away].draw++;

      }

    });

  const arr=Object.keys(d)
    .map(team=>({
      team,
      ...d[team]
    }))
    .sort((a,b)=>{

      const wpb=
        (b.w+b.draw*.5)/(b.g||1);

      const wpa=
        (a.w+a.draw*.5)/(a.g||1);

      if(wpb!==wpa)return wpb-wpa;

      return (b.rs-b.ra)-(a.rs-a.ra);

    });

  $("main").innerHTML=`

  <div class="card">

    <h2>🏆 팀 순위</h2>

    <table>

      <tr>
        <th>순위</th>
        <th>팀</th>
        <th>경기</th>
        <th>승</th>
        <th>패</th>
        <th>무</th>
        <th>승률</th>
        <th>득실</th>
      </tr>

      ${
        arr.map((r,i)=>`

          <tr class="${
            i===0
            ?"rank1"
            :i===1
            ?"rank2"
            :i===2
            ?"rank3"
            :""
          }">

            <td>
              <b>${i+1}</b>
            </td>

            <td>
              ${data.teams[r.team].icon}
              <b>${r.team}</b>
            </td>

            <td>${r.g}</td>
            <td>${r.w}</td>
            <td>${r.l}</td>
            <td>${r.draw}</td>

            <td>
              ${
                r.g
                ?((r.w+r.draw*.5)/r.g).toFixed(3)
                :".000"
              }
            </td>

            <td>${r.rs-r.ra}</td>

          </tr>

        `).join("")
      }

    </table>

  </div>
  `;
}

function renderBatting(){

  const arr=allPlayers()
    .filter(p=>{

      return Object.values(data.teams)
        .some(t=>t.hitters.includes(p));

    })
    .map(p=>{

      const s=data.stats[p]||{};
      const ab=Number(s.ab||0);
      const h=Number(s.h||0);

      return {
        player:p,
        ab,
        h,
        avg:ab?h/ab:0,
        hr:Number(s.hr||0),
        rbi:Number(s.rbi||0),
        sb:Number(s.sb||0)
      };

    });

  $("statContent").innerHTML=`

    <h3>🥇 타율 순위</h3>

      [...arr].sort((a,b)=>b.avg-a.avg),
      "avg"

    ${batTable(
      [...arr].sort((a,b)=>b.hr-a.hr),
      "hr"
    )}

      [...arr].sort((a,b)=>b.rbi-a.rbi),
      "rbi"
    )}

    ${batTable(
      [...arr].sort((a,b)=>b.sb-a.sb),
      "sb"
    )}
  `;
}

function batTable(arr,type){

  return `

        <th>타수</th>

        arr.map((r,i)=>`

/* =========================================================
   MVP
   ========================================================= */

function calculateMVP(home,away){

  const candidates=[
    ...data.teams[home].hitters,
    ...data.teams[away].hitters
  ];

  let best=null;
  let bestScore=-1;

  candidates.forEach(p=>{

    const s=data.stats[p]||{};

    const score=
      Number(s.h||0)*3+
      Number(s.hr||0)*6+
      Number(s.rbi||0)*4+
      Number(s.sb||0)*2;

    if(score>bestScore){

      bestScore=score;
      best=p;

    }

  });

  return{
    player:best,
    score:bestScore
  };
}

          </option>

          ${
            t.pitchers.map(p=>`

              <option
                value="${escapeAttr(p)}"
                ${current.replaced&&current.name===p
                  ?"selected"
                  :""}>

                ${escapeHTML(p)}

              </option>

            `).join("")
          }

        </select>

      </div>
    `;
  });

  html+=`

    <button
      class="primary"
      id="saveGameStarter"
      style="width:100%">
      선발 변경 저장
    </button>
  `;

  $("main").innerHTML=html;

  $("starterBack").onclick=editSchedule;

  $("saveGameStarter").onclick=()=>{

    const key=
      gameKey(
        game.date,
        game.home,
        game.away
      );

    if(!data.overrides[key])
      data.overrides[key]={};

    teams.forEach(team=>{

            id="ed_${i}"
            type="date"
            value="${r.date}">

          <input
            id="eh_${i}"
            value="${escapeAttr(r.home)}">

          <input
            id="ea_${i}"
            value="${escapeAttr(r.away)}">

          <input
            id="ehs_${i}"
            type="number"
            value="${r.homeScore}">

          <input
            id="eas_${i}"
            type="number"
            value="${r.awayScore}">

          <input
            id="em_${i}"
            value="${escapeAttr(r.mvp||"")}"
            placeholder="MVP">

        </div>

        <br>

        <button
          class="primary"
          data-update-result="${i}">
          수정
        </button>

        <button
          class="danger"
          data-delete-result="${i}">
          삭제
        </button>

      </div>
    `;
  });

  if(!data.results.length){

    html+=`
      <div class="empty">
        등록된 결과가 없습니다.
      </div>
    `;
  }

  $("main").innerHTML=html;

  $("resultBack").onclick=adminPage;

  document
    .querySelectorAll("[data-update-result]")
    .forEach(btn=>{
      btn.onclick=()=>{
        updateResult(
          Number(btn.dataset.updateResult)
        );
      };
    });

  document
    .querySelectorAll("[data-delete-result]")
    .forEach(btn=>{
      btn.onclick=()=>{
        deleteResult(
          Number(btn.dataset.deleteResult)
        );
      };
    });
}

function updateResult(i){

  const r=data.results[i];

  r.date=$(`ed_${i}`).value;
  r.home=$(`eh_${i}`).value;
  r.away=$(`ea_${i}`).value;
  r.homeScore=
    Number($(`ehs_${i}`).value||0);
  r.awayScore=
    Number($(`eas_${i}`).value||0);
  r.mvp=$(`em_${i}`).value;

  save();

  editResults();
}

function deleteResult(i){

  if(!confirm("경기 결과를 삭제할까요?"))
    return;

  data.results.splice(i,1);

  save();

  editResults();
}

function editNews(){

  let html=`

    <button class="close" id="newsBack">
      돌아가기
    </button>

    <h2>📰 뉴스 관리</h2>

    <div class="card">

      <h3>뉴스 추가</h3>

      <input
        id="newstitle"
        placeholder="뉴스 제목">

      <br><br>

      <textarea
        id="newscontent"
        placeholder="뉴스 내용"></textarea>

      <br><br>

      <input
        id="newsdate"
        type="date">

      <br><br>

      <button
        class="primary"
        id="addNewsBtn">
        뉴스 등록
      </button>

    </div>
  `;

  data.news.forEach((n,i)=>{

    html+=`

      <div class="card">

        <input
          id="nt_${i}"
          value="${escapeAttr(n.title)}">

        <br><br>

        <textarea
          id="nc_${i}">${escapeHTML(n.content)}</textarea>

        <br><br>

        <input
          id="nd_${i}"
          type="date"
          value="${n.date}">

        <br><br>

        <button
          class="primary"
          data-update-news="${i}">
          수정
        </button>

        <button
          class="danger"
          data-delete-news="${i}">
          삭제
        </button>

      </div>
    `;
  });

  $("main").innerHTML=html;

  $("newsBack").onclick=adminPage;

  $("addNewsBtn").onclick=addNews;

  document
    .querySelectorAll("[data-update-news]")
    .forEach(btn=>{
      btn.onclick=()=>{
        updateNews(
          Number(btn.dataset.updateNews)
        );
      };
    });

  document
    .querySelectorAll("[data-delete-news]")
    .forEach(btn=>{
      btn.onclick=()=>{
        deleteNews(
          Number(btn.dataset.deleteNews)
        );
      };
    });
}

function addNews(){

  const title=
    $("newstitle").value.trim();

  const content=
    $("newscontent").value.trim();

  const date=
    $("newsdate").value||
    new Date().toISOString().slice(0,10);

  if(!title||!content){

    alert("제목과 내용을 입력하세요.");
    return;
  }

  data.news.push({

    id:Date.now(),
    title,
    content,
    date

  });

  save();

  editNews();
}

function updateNews(i){

  data.news[i].title=
    $(`nt_${i}`).value;

  data.news[i].content=
    $(`nc_${i}`).value;

  data.news[i].date=
    $(`nd_${i}`).value;

  save();

  editNews();
}

function deleteNews(i){

  if(!confirm("뉴스를 삭제할까요?"))
    return;

  data.news.splice(i,1);

  save();

  editNews();
}
