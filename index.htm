<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLD MARBLE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#eef1f5;
  color:#172033;
}
button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700;
  background:#172033;
  color:white;
}
button:disabled{
  opacity:.4;
  cursor:not-allowed;
}
.app{
  max-width:1500px;
  margin:auto;
  padding:18px;
}
header{
  background:#fff;
  border:1px solid #dfe4ea;
  border-radius:18px;
  padding:18px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:1px;
}
.sub{
  color:#718096;
  font-size:13px;
  margin-top:4px;
}
.headerBtns{
  display:flex;
  gap:8px;
}
.layout{
  display:grid;
  grid-template-columns:minmax(650px,1fr) 380px;
  gap:16px;
}
.panel,.boardWrap{
  background:#fff;
  border:1px solid #dfe4ea;
  border-radius:18px;
}
.boardWrap{
  padding:14px;
}
.board{
  width:min(100%,850px);
  aspect-ratio:1/1;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(11,1fr);
  grid-template-rows:repeat(11,1fr);
  gap:3px;
  background:#cbd2db;
  padding:3px;
  border-radius:12px;
}
.cell{
  position:relative;
  background:#fff;
  border-radius:5px;
  padding:4px;
  overflow:hidden;
  border:1px solid #d8dde4;
}
.cell.corner{
  background:#f6f7f9;
}
.cell.gold{
  background:#fff8dc;
}
.cell.vehicle{
  background:#edf6ff;
}
.cell.special{
  background:#f3f1ff;
}
.cell.seoul{
  background:#fff0f0;
}
.cellName{
  font-size:clamp(7px,1vw,12px);
  font-weight:800;
  line-height:1.1;
  text-align:center;
  margin-top:3px;
  word-break:keep-all;
}
.cellType{
  font-size:7px;
  text-align:center;
  color:#7a8492;
  margin-top:2px;
}
.price{
  font-size:8px;
  text-align:center;
  margin-top:2px;
  color:#4d5968;
}
.buildingMark{
  position:absolute;
  left:3px;
  bottom:3px;
  display:flex;
  gap:2px;
}
.build{
  min-width:14px;
  height:13px;
  border-radius:3px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:7px;
  font-weight:900;
  box-shadow:0 1px 3px #999;
}
.build.villa{height:10px}
.build.building{height:15px}
.build.hotel{height:20px}
.tokens{
  position:absolute;
  right:3px;
  bottom:3px;
  display:flex;
  gap:2px;
}
.token{
  width:17px;
  height:17px;
  border-radius:50%;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:8px;
  font-weight:900;
  border:2px solid #fff;
  box-shadow:0 1px 3px #777;
}
.center{
  grid-column:2/11;
  grid-row:2/11;
  background:linear-gradient(135deg,#101827,#26364f);
  border-radius:10px;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
.center h1{
  margin:0;
  font-size:clamp(24px,5vw,58px);
  letter-spacing:3px;
}
.center p{
  margin:8px 0 0;
  color:#cbd5e1;
  font-size:12px;
}
.side{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.panel{
  padding:15px;
}
.turnBox{
  display:flex;
  align-items:center;
  gap:10px;
}
.turnDot{
  width:16px;
  height:16px;
  border-radius:50%;
}
.turnName{
  font-size:20px;
  font-weight:900;
}
.money{
  margin-left:auto;
  font-size:18px;
  font-weight:900;
}
.diceArea{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.dice{
  display:flex;
  gap:7px;
}
.die{
  width:48px;
  height:48px;
  border:1px solid #d8dde4;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:900;
  background:#fafafa;
}
.actionRow{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.actionRow button{
  flex:1;
}
.primary{
  background:#2563eb;
}
.green{
  background:#16a34a;
}
.red{
  background:#dc2626;
}
.goldBtn{
  background:#b88700;
}
.sectionTitle{
  font-size:14px;
  font-weight:900;
  margin-bottom:9px;
}
.players{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.playerRow{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  background:#f7f8fa;
  border-radius:9px;
}
.playerDot{
  width:13px;
  height:13px;
  border-radius:50%;
}
.playerRow .name{
  font-weight:800;
}
.playerRow .cash{
  margin-left:auto;
  font-weight:800;
}
.playerRow .pos{
  font-size:11px;
  color:#77808c;
}
.log{
  height:190px;
  overflow:auto;
  background:#111827;
  color:#e5e7eb;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  line-height:1.55;
}
.infoGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.info{
  background:#f7f8fa;
  border-radius:9px;
  padding:9px;
}
.info b{
  display:block;
  font-size:11px;
  color:#687385;
  margin-bottom:3px;
}
.info span{
  font-weight:900;
}
.modalBack{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:15px;
}
.modal{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:20px;
}
.modal h2{
  margin:0 0 10px;
}
.modalText{
  line-height:1.65;
  font-size:14px;
  white-space:pre-line;
}
.modalBtns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}
.assetBtn{
  background:#f4f6f8;
  color:#172033;
  text-align:left;
  border:1px solid #dce1e7;
}
.assetBtn:hover{
  background:#e9edf2;
}
.notice{
  padding:9px;
  background:#fff7df;
  border:1px solid #f1df9c;
  border-radius:9px;
  font-size:12px;
  margin-bottom:10px;
}
@media(max-width:1050px){
  .layout{grid-template-columns:1fr}
}
@media(max-width:700px){
  .app{padding:8px}
  header{padding:14px}
  .logo{font-size:21px}
  .headerBtns button{padding:8px}
  .boardWrap{padding:5px}
  .board{gap:1px;padding:1px}
  .cell{padding:2px}
  .side{gap:8px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <div class="logo">WORLD MARBLE</div>
    <div class="sub">WORLD TRAVEL BOARD GAME</div>
  </div>

    <button onclick="showRules()">규칙</button>
    <button onclick="newGame()" class="primary">새 게임</button>

</header>

<div class="layout">

<div class="boardWrap">

</div>

<div class="side">

  <div class="actionRow">
    <button id="endBtn" class="green" onclick="endTurn()" disabled>턴 종료</button>
    <button onclick="showCurrentProperty()">현재 지역</button>
  </div>

  <div class="actionRow">
    <button onclick="showBank()">은행 / 자산매각</button>
    <button onclick="showGoldInfo()">황금열쇠</button>
  </div>
</div>

<div class="panel">
  <div class="sectionTitle">현재 지역 정보</div>
  <div id="currentInfo" class="infoGrid"></div>
</div>

<div class="panel">
  <div class="sectionTitle">플레이어</div>
  <div id="players" class="players"></div>
</div>

<div class="panel">
  <div class="sectionTitle">사회복지기금</div>
  <div id="fund">₩0</div>
</div>

<div class="panel">
  <div class="sectionTitle">게임 기록</div>
  <div id="log" class="log"></div>
</div>

</div>
</div>
</div>

<div id="modalBack" class="modalBack">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div id="modalBtns" class="modalBtns"></div>
  </div>
</div>

function money(v){
  return "₩"+(v*10000).toLocaleString("ko-KR");
}

function log(msg){
  const el=document.getElementById("log");
  const time=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
  el.innerHTML=`<div>[${time}] ${msg}</div>`+el.innerHTML;
}

function activePlayers(){
  return players.filter(p=>p.alive);
}

function initPlayers(){
  players=names.slice(0,playerCount).map((name,i)=>({
    id:i,
    name,
    money:500,
    pos:0,
    props:{},
    completedRounds:0,
    inIsland:0,
    escapeCard:0,
    pendingSpace:false,
    alive:true
  }));
}

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-.5);
}

function newGame(){
  showModal(
    "게임 인원 선택",
    "플레이할 인원 수를 선택하세요.\n시작 자금은 500만원입니다.",
    [
      ["2명",()=>startGame(2)],
      ["3명",()=>startGame(3)],
      ["4명",()=>startGame(4)]
    ]
  );
}

  turn=0;
  rolled=false;
  dice=[1,1];
  fund=0;
  round=0;
  deck=shuffle(golden.map((c,i)=>({...c,id:i+1})));
  deckPos=0;

  boardData.forEach(c=>{
    delete c.owner;
    delete c.building;
    delete c.purchaseRound;
  });

  closeModal();
  log(`${count}인 게임 시작. 시작 자금 ${money(500)}.`);
  render();
}

/* =========================================================
   BOARD
   ========================================================= */

function perimeterPositions(){
  const arr=[];
  for(let c=0;c<11;c++)arr.push([0,c]);
  for(let r=1;r<11;r++)arr.push([r,10]);
  for(let c=9;c>=0;c--)arr.push([10,c]);
  for(let r=9;r>0;r--)arr.push([r,0]);
  return arr;
}

function buildBoard(){
  const board=document.getElementById("board");
  board.innerHTML="";

  const coords=perimeterPositions();

  for(let i=0;i<40;i++){
    const c=boardData[i];
    const div=document.createElement("div");
    const [r,col]=coords[i];

    div.className="cell";
    div.style.gridRow=r+1;
    div.style.gridColumn=col+1;

    if(i===0||i===10||i===20||i===30)div.classList.add("corner");
    if(c.type==="gold")div.classList.add("gold");
    if(c.type==="vehicle")div.classList.add("vehicle");
    if(c.type==="tour"||c.type==="welfare")div.classList.add("special");
    if(c.seoul)div.classList.add("seoul");

    let html=`<div class="cellName">${c.name}</div>`;

    if(c.type==="property"){
      html+=`<div class="price">${money(c.price)}</div>`;
      html+=`<div class="cellType">대지료 ${money(c.landFee)}</div>`;
    }else if(c.type==="vehicle"){
      html+=`<div class="price">구입 ${money(c.price)}</div>`;
      html+=`<div class="cellType">통행료 ${money(c.toll)}</div>`;
    }else{
      html+=`<div class="cellType">${typeText(c.type)}</div>`;
    }

    if(c.owner!==undefined){
      const owner=players[c.owner];
      if(owner){
        html+=`<div style="position:absolute;top:2px;left:2px;width:7px;height:7px;border-radius:50%;background:${colors[c.owner]}"></div>`;
      }
    }

    if(c.building){
      const owner=players[c.owner];
      const color=owner?colors[c.owner]:"#555";
      const label=c.building==="villa"?"별장":c.building==="building"?"빌딩":"호텔";
      html+=`
        <div class="buildingMark">
          <div class="build ${c.building}" style="background:${color}" title="${label}">
            ${c.building==="villa"?"별":c.building==="building"?"빌":"호"}
          </div>
        </div>
      `;
    }

    const tokens=players.filter(p=>p.alive&&p.pos===i);
    if(tokens.length){
      html+=`<div class="tokens">`;
      tokens.forEach(p=>{
        html+=`<div class="token" style="background:${colors[p.id]}">${p.id+1}</div>`;
      });
      html+=`</div>`;
    }

    div.innerHTML=html;

    /* 클릭은 구매가 아니라 정보 확인 */
    div.onclick=()=>showProperty(i);

    board.appendChild(div);
  }

  const center=document.createElement("div");
  center.className="center";
  center.innerHTML=`
    <h1>WORLD MARBLE</h1>
    <p>WORLD TRAVEL</p>
  `;
  board.appendChild(center);
}

function typeText(type){
  return {
    start:"출발",
    gold:"황금열쇠",
    island:"무인도",
    welfare:"사회복지기금",
    tour:"우주여행"
  }[type]||"";
}

/* =========================================================
   RENDER
   ========================================================= */

function render(){
  buildBoard();

  if(!players.length){
    document.getElementById("turnName").textContent="게임 시작 전";
    document.getElementById("turnState").textContent="새 게임을 시작하세요.";
    document.getElementById("turnMoney").textContent=money(0);
    return;
  }

  const p=players[turn];

  document.getElementById("turnName").textContent=p.name;
  document.getElementById("turnDot").style.background=colors[p.id];
  document.getElementById("turnMoney").textContent=money(p.money);

  let state="";
  if(p.money<0) state="⚠ 빚 상태";
  else if(!rolled) state="주사위를 굴리세요.";
  else if(dice[0]===dice[1]) state="더블! 한 번 더 굴릴 수 있습니다.";
  else state="이동 완료. 턴 종료를 누르세요.";

  if(p.pendingSpace)state+=" · 우주여행 가능";

  document.getElementById("turnState").textContent=state;

  document.getElementById("die1").textContent=dice[0]||"–";
  document.getElementById("die2").textContent=dice[1]||"–";

  document.getElementById("rollBtn").disabled=rolled && dice[0]!==dice[1];
  document.getElementById("endBtn").disabled=!rolled || dice[0]===dice[1];

  document.getElementById("fund").textContent=money(fund);

  const pl=document.getElementById("players");
  pl.innerHTML=players.map(p=>`
    <div class="playerRow" style="${p.id===turn?'outline:2px solid '+colors[p.id]:''}">
      <div class="playerDot" style="background:${colors[p.id]}"></div>
      <div>
        <div class="name">${p.name}</div>
        <div class="pos">${boardData[p.pos].name}${p.alive?"":" · 탈락"}</div>
      </div>
      <div class="cash">${money(p.money)}</div>
    </div>
  `).join("");

  showCurrentInfo();
}

/* =========================================================
   DICE / MOVEMENT
   ========================================================= */

function rollDice(){
  if(!players.length){
    newGame();
    return;
  }

  const p=players[turn];

  if(p.money<0){
    settleDebt();
    return;
  }

  if(rolled && dice[0]!==dice[1])return;

  dice=[
    Math.floor(Math.random()*6)+1,
    Math.floor(Math.random()*6)+1
  ];

  rolled=true;

  const steps=dice[0]+dice[1];

  log(`${p.name} 주사위 ${dice[0]} + ${dice[1]} = ${steps}.`);

  movePlayer(p,steps);

  render();
}

function movePlayer(p,steps){
  const old=p.pos;
  const newPos=(p.pos+steps)%40;

  if(old+steps>=40){
    p.completedRounds++;
    round++;
    p.money+=20;
    log(`${p.name}이(가) 출발점을 지나 ${money(20)}을 받았습니다.`);
  }

  p.pos=newPos;

  log(`${p.name} → ${boardData[newPos].name}`);

  resolveLanding(p,newPos);
}

/* =========================================================
   LANDING
   ========================================================= */

function resolveLanding(p,pos){
  const c=boardData[pos];

  if(c.type==="start"){
    return;
  }

  if(c.type==="property"){
    propertyLanding(p,pos);
    return;
  }

  if(c.type==="vehicle"){
    vehicleLanding(p,pos);
    return;
  }

  if(c.type==="gold"){
    drawGold();
    return;
  }

  if(c.type==="welfare"){
    if(c.name.includes("수령")){
      const amount=fund;
      p.money+=amount;
      fund=0;
      log(`${p.name}이(가) 사회복지기금 ${money(amount)}을 받았습니다.`);
    }else{
      fund+=10;
      p.money-=10;
      log(`${p.name}이(가) 사회복지기금에 ${money(10)}을 냈습니다.`);
    }
    return;
  }

  if(c.type==="island"){
    if(p.escapeCard>0){
      log(`${p.name}은(는) 무인도 탈출권을 보유하고 있습니다.`);
    }else{
      p.inIsland=3;
      log(`${p.name} 무인도.`);
    }
    return;
  }

  if(c.type==="tour"){
    /*
      우주여행 도착 즉시 사용하지 않음.
      다음 턴부터 사용 가능.
    */
    p.pendingSpace=true;
    log(`${p.name} 우주여행 도착. 다음 턴부터 우주여행을 이용할 수 있습니다.`);
  }
}

/* =========================================================
   PROPERTY
   ========================================================= */

function propertyLanding(p,pos){
  const c=boardData[pos];

  /* 빈 땅 */
  if(c.owner===undefined){
    showModal(
      `${c.name} 도착`,
      `빈 땅입니다.\n\n땅 가격: ${money(c.price)}\n대지료: ${money(c.landFee)}\n\n지금은 땅만 구매할 수 있습니다.\n건물은 한 바퀴 이상 돈 뒤 이 지역에 다시 와야 합니다.`,
      [
        [`땅 구매 ${money(c.price)}`,()=>buyLand(p,pos)],
        ["구매하지 않기",closeModal]
      ]
    );
    return;
  }

  /* 자기 땅 */
  if(c.owner===p.id){
    if(c.seoul){
      log(`${p.name} 서울: 건물 설치 불가.`);
      return;
    }

    /*
      구매 후 한 바퀴 이상 + 같은 지역 재방문
    */
    const purchaseRound=c.purchaseRound??0;

    if(p.completedRounds>purchaseRound){
      showBuildMenu(p,pos);
    }else{
      log(`${c.name}: 아직 한 바퀴를 완료하지 않아 건물을 살 수 없습니다.`);
    }
    return;
  }

  /* 남의 땅 */
  const owner=players[c.owner];
  const toll=calcPropertyToll(c);

  p.money-=toll;
  owner.money+=toll;

  log(`${p.name} → ${owner.name}에게 ${c.name} 통행료 ${money(toll)} 지급.`);

  if(p.money<0)settleDebt();
}

function buyLand(p,pos){
  const c=boardData[pos];

  if(p.money<c.price){
    alert("돈이 부족합니다.");
    return;
  }

  p.money-=c.price;
  c.owner=p.id;
  c.purchaseRound=p.completedRounds;
  c.building=null;

  log(`${p.name}이(가) ${c.name}을(를) ${money(c.price)}에 구매했습니다.`);
  closeModal();
  render();
}

/* =========================================================
   BUILDINGS
   ========================================================= */

function showBuildMenu(p,pos){
  const c=boardData[pos];

  if(c.seoul){
    alert("서울은 건물을 지을 수 없습니다.");
    return;
  }

  let buttons=[];

  if(!c.building){
    buttons.push([`별장 구매 ${money(c.villa)}`,()=>buyBuilding(p,pos,"villa")]);
    buttons.push([`빌딩 구매 ${money(c.building)}`,()=>buyBuilding(p,pos,"building")]);
    buttons.push([`호텔 구매 ${money(c.hotel)}`,()=>buyBuilding(p,pos,"hotel")]);
  }else if(c.building==="villa"){
    buttons.push([`별장 → 호텔 ${money(c.hotel)}`,()=>buyBuilding(p,pos,"hotel")]);
  }else if(c.building==="building"){
    buttons.push([`빌딩 → 호텔 ${money(c.hotel)}`,()=>buyBuilding(p,pos,"hotel")]);
  }else{
    buttons.push(["호텔 완성 — 추가 건설 불가",()=>{}]);
  }

  buttons.push(["취소",closeModal]);

  showModal(
    `${c.name} 건물`,
    `현재 지역: ${c.name}\n\n대지료: ${money(c.landFee)}\n현재 건물: ${c.building?buildingName(c.building):"없음"}\n\n※ 한 땅에는 건물 한 채만 가능합니다.\n※ 별장/빌딩이 있으면 호텔로 교체할 수 있습니다.\n※ 현재 플레이어가 이 지역에 있을 때만 건설할 수 있습니다.`,
    buttons
  );
}

function buyBuilding(p,pos,type){
  const c=boardData[pos];

  if(c.owner!==p.id){
    alert("자기 땅만 건설할 수 있습니다.");
    return;
  }

  if(c.seoul){
    alert("서울은 건물 설치가 불가능합니다.");
    return;
  }

  if(p.completedRounds<=(c.purchaseRound??0)){
    alert("땅을 산 후 한 바퀴 이상 돌아 다시 와야 합니다.");
    return;
  }

  let cost=0;

  if(type==="villa")cost=c.villa;
  if(type==="building")cost=c.building;
  if(type==="hotel")cost=c.hotel;

  if(p.money<cost){
    alert("돈이 부족합니다.");
    return;
  }

  p.money-=cost;
  c.building=type;

  log(`${p.name}이(가) ${c.name}에 ${buildingName(type)}을(를) 건설했습니다. 비용 ${money(cost)}.`);
  closeModal();
  render();
}

function buildingName(type){
  return type==="villa"?"별장":type==="building"?"빌딩":"호텔";
}

function calcPropertyToll(c){
  if(c.building==="villa")return c.villaFee;
  if(c.building==="building")return c.buildingFee;
  if(c.building==="hotel")return c.hotelFee;
  return c.landFee;
}

/* =========================================================
   VEHICLES
   ========================================================= */

function vehicleLanding(p,pos){
  const c=boardData[pos];

  if(c.owner===undefined){
    showModal(
      `${c.name} 도착`,
      `구입 가격: ${money(c.price)}\n통행료: ${money(c.toll)}\n\n탈것은 건물을 지을 수 없습니다.`,
      [
        [`구매 ${money(c.price)}`,()=>buyVehicle(p,pos)],
        ["구매하지 않기",closeModal]
      ]
    );
    return;
  }

  if(c.owner===p.id){
    log(`${p.name}의 ${c.name}입니다.`);
    return;
  }

  p.money-=c.toll;
  players[c.owner].money+=c.toll;

  log(`${p.name} → ${players[c.owner].name}에게 ${c.name} 통행료 ${money(c.toll)} 지급.`);

  if(p.money<0)settleDebt();
}

function buyVehicle(p,pos){
  const c=boardData[pos];

  if(p.money<c.price){
    alert("돈이 부족합니다.");
    return;
  }

  p.money-=c.price;
  c.owner=p.id;
  c.purchasePrice=c.price;

  log(`${p.name}이(가) ${c.name}을(를) ${money(c.price)}에 구매했습니다.`);
  closeModal();
  render();
}

/* =========================================================
   SPACE TRAVEL
   ========================================================= */

function useSpaceTravel(){
  const p=players[turn];

  if(!p.pendingSpace){
    alert("우주여행은 우주여행 칸에 도착한 다음 턴부터 이용할 수 있습니다.");
    return;
  }

  const destinations=[
    1,3,4,5,7,8,9,11,13,14,16,18,19,
    21,23,24,25,26,27,29,31,33,34,36,37,39
  ];

  const buttons=destinations.map(pos=>[
    boardData[pos].name,
    ()=>{
      const fee=20;

      const col=boardData[32];

      if(col.owner!==undefined && col.owner!==p.id){
        p.money-=fee;
        players[col.owner].money+=fee;
        log(`${p.name}이(가) 콜럼비아호 우주여행 이용료 ${money(fee)} 지급.`);
      }

      p.pos=pos;
      p.pendingSpace=false;

      log(`${p.name} 우주여행 → ${boardData[pos].name}`);
      resolveLanding(p,pos);
      closeModal();
      render();
    }
  ]);

  buttons.push(["취소",closeModal]);

  showModal(
    "우주여행",
    "지난 턴에 우주여행 칸에 도착했습니다.\n지금부터 목적지를 선택할 수 있습니다.",
    buttons
  );
}

/* =========================================================
   GOLDEN KEY
   ========================================================= */

function drawGold(){
  const card=deck[deckPos];
  deckPos=(deckPos+1)%deck.length;

  showModal(
    `황금열쇠 — ${card.title}`,
    card.text,
    [
      ["확인",()=>applyCard(card)]
    ]
  );
}

function applyCard(card){
  const p=players[turn];

  if(card.action==="money"){
    p.money+=card.value;
    log(`${p.name}: 황금열쇠 ${card.title} → ${money(Math.abs(card.value))}${card.value>=0?" 수령":" 지불"}.`);
  }

  if(card.action==="hotelBonus"){
    p.money+=card.value;
    log(`${p.name}: 호텔 건설비 지원 ${money(card.value)} 수령.`);
  }

  if(card.action==="start"){
    p.pos=0;
    log(`${p.name}: 출발점으로 이동.`);
  }

  if(card.action==="move"){
    p.pos=card.value;
    log(`${p.name}: 황금열쇠로 ${boardData[p.pos].name} 이동.`);
    resolveLanding(p,p.pos);
  }

  if(card.action==="concord"){
    const concord=boardData.findIndex(x=>x.name==="콩코드 여객기");
    p.pos=concord;
    log(`${p.name}: 콩코드 여객기로 이동.`);
    resolveLanding(p,concord);
  }

  if(card.action==="escape"){
    p.escapeCard++;
    log(`${p.name}: 무인도 탈출권 획득.`);
  }

  closeModal();
  render();

  if(p.money<0)settleDebt();
}

function showGoldInfo(){
  const card=deck.length?deck[deckPos]:null;

  if(!card){
    alert("게임을 먼저 시작하세요.");
    return;
  }

  showModal(
    "황금열쇠",
    `황금열쇠는 총 ${golden.length}장 데이터로 구성되어 있습니다.\n현재 다음 카드: ${card.title}`,
    [
      ["닫기",closeModal]
    ]
  );
}

/* =========================================================
   BANK / SALE / DEBT
   ========================================================= */

function showBank(){
  if(!players.length){
    alert("게임을 먼저 시작하세요.");
    return;
  }

  const p=players[turn];

  let buttons=[];

  Object.keys(p.props).forEach(pos=>{
    const c=boardData[pos];
    buttons.push([
      `${c.name} — ${money(c.price)}에 매각`,
      ()=>sellLand(Number(pos))
    ]);
  });

  boardData.forEach((c,i)=>{
    if(c.owner===p.id && c.type==="property" && !p.props[i]){
      buttons.push([
        `${c.name} — ${money(c.price)}에 매각`,
        ()=>sellLand(i)
      ]);
    }
  });

  boardData.forEach((c,i)=>{
    if(c.owner===p.id && c.type==="vehicle"){
      buttons.push([
        `${c.name} — ${money(c.purchasePrice||c.price)}에 매각`,
        ()=>sellVehicle(i)
      ]);
    }
  });

  if(!buttons.length){
    buttons.push(["매각할 자산 없음",()=>{}]);
  }

  buttons.push(["닫기",closeModal]);

  showModal(
    "은행 / 자산 매각",
    `현재 자금: ${money(p.money)}\n\n땅 거래는 은행과만 가능합니다.\n땅은 최초 구매가격으로 은행에 판매할 수 있습니다.\n건물이 있는 땅을 판매하면 건물은 함께 없어집니다.`,
    buttons
  );
}

function sellLand(pos){
  const p=players[turn];
  const c=boardData[pos];

  if(c.owner!==p.id){
    alert("본인 소유 자산만 판매할 수 있습니다.");
    return;
  }

  const value=c.price;

  p.money+=value;

  delete c.owner;
  delete c.building;
  delete c.purchaseRound;

  log(`${p.name}이(가) ${c.name}을(를) 은행에 ${money(value)}에 판매했습니다.`);

  closeModal();
  render();

  if(p.money>=0 && p.money===0){
    log(`${p.name}의 자금이 0원이 되었습니다. 아직 파산이 아닙니다.`);
  }
}

function sellVehicle(pos){
  const p=players[turn];
  const c=boardData[pos];

  if(c.owner!==p.id)return;

  const value=c.purchasePrice||c.price;

  p.money+=value;

  delete c.owner;
  delete c.purchasePrice;

  log(`${p.name}이(가) ${c.name}을(를) 은행에 ${money(value)}에 판매했습니다.`);

  closeModal();
  render();
}

function settleDebt(){
  const p=players[turn];

  if(p.money>=0){
    render();
    return;
  }

  showModal(
    "빚 상환",
    `${p.name}의 현재 자금은 ${money(p.money)}입니다.\n\n원하는 자산을 골라 은행에 팔아 빚을 갚을 수 있습니다.\n\n자산을 모두 팔아도 0원 미만이면 파산 처리됩니다.\n0원은 파산이 아닙니다.`,
    [
      ["자산 매각",showBank],
      ["파산 확인",checkBankruptcy]
    ]
  );
}

function checkBankruptcy(){
  const p=players[turn];

  if(p.money>=0){
    closeModal();
    render();
    return;
  }

  const hasAsset=boardData.some(c=>c.owner===p.id);

  if(hasAsset){
    alert("아직 자산을 팔아 빚을 갚을 수 있습니다.");
    showBank();
    return;
  }

  p.alive=false;

  boardData.forEach(c=>{
    if(c.owner===p.id){
      delete c.owner;
      delete c.building;
      delete c.purchaseRound;
    }
  });

  log(`${p.name} 파산.`);
  closeModal();

  if(activePlayers().length<=1){
    endGame();
  }else{
    nextTurn();
  }
}

/* =========================================================
   TURN
   ========================================================= */

function endTurn(){
  if(!players.length)return;

  const p=players[turn];

  if(!rolled)return;

  if(dice[0]===dice[1]){
    alert("더블이므로 한 번 더 굴려야 합니다.");
    return;
  }

  if(p.money<0){
    settleDebt();
    return;
  }

  nextTurn();
}

function nextTurn(){
  if(activePlayers().length<=1){
    endGame();
    return;
  }

  let next=turn;
  let guard=0;

  do{
    next=(next+1)%players.length;
    guard++;
  }while(!players[next].alive && guard<players.length+2);

  turn=next;
  rolled=false;
  dice=[1,1];

  const p=players[turn];

  /*
    우주여행은 다음 턴부터 사용 가능
  */
  if(p.pendingSpace){
    setTimeout(()=>{
      showModal(
        "우주여행 가능",
        `${p.name}은(는) 지난 턴에 우주여행 칸에 도착했습니다.\n이번 턴부터 우주여행을 이용할 수 있습니다.`,
        [
          ["우주여행 이용",useSpaceTravel],
          ["이번에는 이용하지 않기",closeModal]
        ]
      );
    },100);
  }

  log(`${p.name}의 턴.`);
  render();
}

function endGame(){
  const alive=activePlayers();

  if(alive.length===1){
    showModal(
      "게임 종료",
      `${alive[0].name}만 남았습니다.\n게임이 종료되었습니다.`,
      [["확인",closeModal]]
    );
    log(`게임 종료 — ${alive[0].name} 생존.`);
  }
}

/* =========================================================
   PROPERTY INFO
   ========================================================= */

function showCurrentProperty(){
  if(!players.length)return;
  showProperty(players[turn].pos);
}

function showProperty(pos){
  const c=boardData[pos];

  let text=`지역: ${c.name}\n\n`;

  if(c.type==="property"){
    text+=`땅 가격: ${money(c.price)}\n`;
    text+=`대지료: ${money(c.landFee)}\n`;

    if(c.seoul){
      text+=`\n서울은 땅만 구매할 수 있습니다.\n별장 / 빌딩 / 호텔 불가능`;
    }else{
      text+=`\n별장 건설비: ${money(c.villa)}\n별장 대지료: ${money(c.villaFee)}\n`;
      text+=`빌딩 건설비: ${money(c.building)}\n빌딩 대지료: ${money(c.buildingFee)}\n`;
      text+=`호텔 건설비: ${money(c.hotel)}\n호텔 대지료: ${money(c.hotelFee)}\n`;
      text+=`\n현재 건물: ${c.building?buildingName(c.building):"없음"}`;
    }

    if(c.owner!==undefined){
      text+=`\n소유자: ${players[c.owner].name}`;
    }else{
      text+=`\n소유자: 없음`;
    }
  }

  if(c.type==="vehicle"){
    text+=`구입 가격: ${money(c.price)}\n`;
    text+=`통행료: ${money(c.toll)}\n`;
    if(c.spaceFee)text+=`우주여행 이용료: ${money(c.spaceFee)}\n`;
    text+=`\n건물 설치: 불가능`;
    if(c.owner!==undefined)text+=`\n소유자: ${players[c.owner].name}`;
  }

  if(c.type==="tour"){
    text+="우주여행 칸\n도착 후 다음 턴부터 우주여행 이용 가능";
  }

  if(c.type==="gold"){
    text+="황금열쇠 카드 칸";
  }

  showModal(
    c.name,
    text,
    [["닫기",closeModal]]
  );
}

function showCurrentInfo(){
  const el=document.getElementById("currentInfo");

  if(!players.length){
    el.innerHTML="";
    return;
  }

  const p=players[turn];
  const c=boardData[p.pos];

  let html="";

  html+=infoBox("현재 위치",c.name);

  if(c.type==="property"){
    html+=infoBox("땅 가격",money(c.price));
    html+=infoBox("대지료",money(c.landFee));

    if(c.seoul){
      html+=infoBox("건물","불가능");
    }else{
      html+=infoBox("별장",money(c.villa));
      html+=infoBox("빌딩",money(c.building));
      html+=infoBox("호텔",money(c.hotel));
    }

    html+=infoBox(
      "소유자",

    );

  el.innerHTML=html;

function infoBox(a,b){
  return `<div class="info"><b>${a}</b><span>${b}</span></div>`;
}

/* =========================================================
   MODAL
   ========================================================= */

function showModal(title,text,buttons=[]){
  modalOpen=true;

  document.getElementById("modalTitle").textContent=title;

  document.getElementById("modalBody").innerHTML=
    `<div class="modalText">${escapeHtml(text)}</div>`;

  const mb=document.getElementById("modalBtns");
  mb.innerHTML="";

  buttons.forEach(([label,fn])=>{
    const b=document.createElement("button");
    b.textContent=label;
    b.onclick=fn;
    mb.appendChild(b);
  });

  document.getElementById("modalBack").style.display="flex";
}

function closeModal(){
  modalOpen=false;
  document.getElementById("modalBack").style.display="none";
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/\n/g,"<br>");
}
