function shuffle(arr){
  return [...arr].sort(()=>Math.random()-.5);
}

function log(msg){

  const d=document.createElement('div');

========================================================= */

  players=PNames

      money:300,

      favor:0,

      alive:true,

/* =========================================================
   게임 시작
========================================================= */

function startGame(count){

  playerCount=count;

  initPlayers();

  turn=0;

  rolled=false;

  dice=[1,1];

  fund=0;

  deck=shuffle(
    golden.map((c,i)=>({
      ...c,
      id:i+1
    }))
  );

  deckPos=0;

  pendingMove=null;

  gameStarted=true;

  board.forEach(c=>{

    if(c){

      delete c.owner;

      delete c.purchasePrice;

      delete c.purchaseRound;

      c.build=0;

    }

  });

  log(
    `${playerCount}인 게임을 시작했습니다.`
  );

  closeModal();

  render();

}


/* =========================================================

========================================================= */

function showModal(title,body,buttons=[]){

  document.getElementById('modalTitle').textContent=title;

  document.getElementById('modalBody').innerHTML=body;

  const box=document.getElementById('modalButtons');

  box.innerHTML='';

  buttons.forEach((b,i)=>{

    const btn=document.createElement('button');

    btn.textContent=b[0];

    if(i===buttons.length-1){
      btn.classList.add('primary');
    }

    btn.onclick=b[1];

    box.appendChild(btn);

  });

  document
    .getElementById('modalBg')
    .classList.add('show');

}

function closeModal(){

  document
    .getElementById('modalBg')
    .classList.remove('show');

}

========================================================= */

function buildBoard(){

  const el=document.getElementById('board');

  el.innerHTML='';

  board=boardData.map(c=>({
    ...c,
    build:0
  }));

  board.forEach((c,i)=>{

    const cell=document.createElement('div');

    cell.className='cell';

    if(c.type==='start')
      cell.classList.add('start');

    if(c.type==='gold')
      cell.classList.add('gold');

    if(c.type==='island')
      cell.classList.add('island');

    if(c.type==='vehicle'||c.type==='tour')
      cell.classList.add('vehicle');

    if(c.type==='welfare')
      cell.classList.add('welfare');

    cell.id='cell-'+i;

    /*
      ★ 클릭은 정보 확인만 한다.
      ★ 여기서 땅을 구매할 수 없다.
    */

    cell.onclick=()=>{
      showSpaceInfo(i);
    };

    el.appendChild(cell);

  });


  const cells=[...el.children];

  const positions=[];

  for(let x=0;x<11;x++)
    positions.push([0,x]);

  for(let y=1;y<11;y++)
    positions.push([y,10]);

  for(let x=9;x>=0;x--)
    positions.push([10,x]);

  for(let y=9;y>=1;y--)
    positions.push([y,0]);


  positions.forEach((pos,i)=>{

    cells[i].style.gridRow=pos[0]+1;

    cells[i].style.gridColumn=pos[1]+1;

  });


  const center=document.createElement('div');

  center.className='cell center';

  center.innerHTML=
    '<div class="center-title">WORLD MARBLE</div>';

  el.appendChild(center);

}


/* =========================================================
   보드 렌더링
========================================================= */

function renderBoard(){

  board.forEach((c,i)=>{

    const cell=document.getElementById('cell-'+i);

    if(!cell)return;

    cell.className='cell';

    if(c.type==='start')
      cell.classList.add('start');

    if(c.type==='gold')
      cell.classList.add('gold');

    if(c.type==='island')
      cell.classList.add('island');

    if(c.type==='vehicle'||c.type==='tour')
      cell.classList.add('vehicle');

    if(c.type==='welfare')
      cell.classList.add('welfare');

    if(c.owner!==undefined)
      cell.classList.add('owner'+(c.owner+1));


    let html=
      `<div class="cell-name">${c.name}</div>`;


    if(c.price){

      html+=
        `<div class="cell-price">
          ${fmt(c.price)}
        </div>`;

    }


    if(c.type==='property'){

      const level=c.build||0;

      html+=
        `<div class="cell-toll">
          통행료 ${fmt(calcToll(c))}
        </div>`;

      if(level>0){

        html+=
          `<div class="cell-toll">
            ${BUILDING_NAMES[level]}
          </div>`;

      }

    }


    const tokens=players

      .filter(p=>p.alive&&p.pos===i)

      .map(p=>
        `<div class="token"
          style="background:${PColors[p.id]}">
          ${p.id+1}
        </div>`
      )

      .join('');


    html+=
      `<div class="tokens">
        ${tokens}
      </div>`;


    cell.innerHTML=html;

  });

}


/* =========================================================
   플레이어 렌더링
========================================================= */

function renderPlayers(){

  const el=document.getElementById('playersPanel');

  el.innerHTML='';

  players.forEach(p=>{

    const row=document.createElement('div');

    row.className='player';

    row.innerHTML=`

      <div class="player-dot"
        style="background:${PColors[p.id]}">
      </div>

      <div class="player-info">

        <div class="player-name">
          ${p.name}
          ${turn===p.id?' ◀':''}
        </div>

        <div class="player-money">
          ${fmt(p.money)}
          ·
          ${board[p.pos]?.name||''}
        </div>

    `;

/* =========================================================
   전체 렌더
========================================================= */

function render(){

  renderBoard();

  renderPlayers();

  const p=players[turn];

  if(p){

    document.getElementById('turnName').textContent=
      p.name;

    document.getElementById('turnMoney').textContent=
      fmt(p.money);

  }

  document.getElementById('fund').textContent=
    fmt(fund);

  renderDice();

}


/* =========================================================
   주사위
========================================================= */

const diceFace=[
  '',
  '⚀',
  '⚁',
  '⚂',
  '⚃',
  '⚄',
  '⚅'
];

function renderDice(){

  document.getElementById('die1').textContent=
    diceFace[dice[0]];

  document.getElementById('die2').textContent=
    diceFace[dice[1]];

  const btn=document.getElementById('rollBtn');

  btn.disabled=
    !gameStarted||
    rolled||
    !players.length||
    !players[turn]?.alive;

}


/* =========================================================
   ★ 주사위
========================================================= */

function rollDice(){

  if(!gameStarted){

    newGame();

    return;

  }

  if(rolled)return;

  const p=players[turn];

  if(!p.alive){

    nextTurn();

    return;

  }


  /* 무인도 */

  if(p.island>0){

    islandTurn(p);

    return;

  }


  dice=[
    1+Math.floor(Math.random()*6),
    1+Math.floor(Math.random()*6)
  ];

  rolled=true;

  renderDice();

  const total=
    dice[0]+dice[1];

  log(
    `${p.name} 주사위 ${dice[0]} + ${dice[1]} = ${total}`
  );

  moveSteps(

    p,

    total,

    ()=>{

      afterMove(
        p,
        dice[0]===dice[1]
      );

    }

  );

}


/* =========================================================
   이동
========================================================= */

function moveSteps(p,n,done){

  let count=0;

  function step(){

    if(count>=n){

      done();

      return;

    }

    const oldPos=p.pos;

    p.pos=(p.pos+1)%40;

    if(p.pos===0){

      p.money+=20;

      p.completedRounds++;

      log(
        `${p.name} 출발 통과 +20만원`
      );

    }

    count++;

    render();

    setTimeout(
      step,
      180
    );

  }

  step();

}


/* =========================================================
   도착
========================================================= */

function afterMove(p,doubles){

  /*
    ★ 실제 도착한 칸만 행동
  */

  arrivalAction(

    p.pos,

    ()=>{

      if(doubles){

        log(
          `${p.name} 더블! 한 번 더 굴릴 수 있습니다.`
        );

        rolled=false;

        render();

      }else{

        nextTurn();

      }

    }

  );

}


/* =========================================================
   ★ 도착 행동
========================================================= */

function arrivalAction(index,done){

  const c=board[index];

  const p=players[turn];

  if(!c||!p){

    done();

    return;

  }


  /* 도시 */

  if(c.type==='property'){

    handlePropertyArrival(
      index,
      done
    );

    return;

  }


  /* 황금열쇠 */

  if(c.type==='gold'){

    drawGolden(
      p,
      done
    );

    return;

  }


  /* 무인도 */

  if(c.type==='island'){

    p.island=2;

    log(
      `${p.name} 무인도 도착`
    );

    render();

    done();

    return;

  }


  /* 사회복지기금 */

  if(c.type==='welfare'){

    if(index===38){

      const amount=
        Math.min(10,p.money);

      p.money-=amount;

      fund+=amount;

      log(
        `${p.name} 사회복지기금 ${fmt(amount)} 납부`
      );

    }else{

      p.money+=fund;

      log(
        `${p.name} 사회복지기금 ${fmt(fund)} 수령`
      );

      fund=0;

    }

    render();

    done();

    return;

  }


  /* 교통수단 */

  if(c.type==='vehicle'){

    log(
      `${p.name} ${c.name} 도착`
    );

    render();

    done();

    return;

  }


  /* 우주여행 */

  if(c.type==='tour'){

    showSpaceTravel(done);

    return;

  }


  render();

  done();

}


/* =========================================================
   ★ 도시 도착
========================================================= */

function handlePropertyArrival(index,done){

  const c=board[index];

  const p=players[turn];


  /* 내 땅 */

  if(c.owner===p.id){

    log(
      `${p.name}이(가) 자신의 ${c.name}에 도착했습니다.`
    );

    render();

    done();

    return;

  }


  /* 상대 땅 */

  if(c.owner!==undefined){

    payToll(
      p,
      c,
      done
    );

    return;

  }


  /* 빈 땅 */

  showModal(

    `${c.name} 도착`,

    `

    <div class="card">

      <h3>${c.name}</h3>

      <p>
        구매가격 :
        <b>${fmt(c.price)}</b>
      </p>

      <p>
        보유금액 :
        <b>${fmt(p.money)}</b>
      </p>

      <p>
        구매 후 한 바퀴를 완주해야
        건물을 건설할 수 있습니다.
      </p>

    </div>

    `,

    [

      [
        '구매',
        ()=>buyProperty(index,done)
      ],

      [
        '구매하지 않기',
        ()=>{
          closeModal();
          done();
        }
      ]

    ]

  );

}


/* =========================================================
   ★ 땅 구매
========================================================= */

function buyProperty(index,done){

  const p=players[turn];

  const c=board[index];

  if(p.money<c.price){

    log(
      `${p.name}은(는) ${c.name}을 구매할 돈이 부족합니다.`
    );

    closeModal();

    done();

    return;

  }


  p.money-=c.price;

  c.owner=p.id;

  c.build=0;

  /*
    ★ 실제 구매가격 저장
    ★ 거래 시 이 가격을 기준으로 사용
  */

  c.purchasePrice=c.price;

  c.purchaseRound=
    p.completedRounds;

  p.props[index]=true;

  log(
    `${p.name}이(가) ${c.name}을 ${fmt(c.price)}에 구매`
  );

  closeModal();

  render();

  done();

}


/* =========================================================
   ★ 통행료
========================================================= */

function calcToll(c){

  if(c.type==='vehicle')
    return c.toll||0;

  if(c.type!=='property')
    return 0;

  const level=c.build||0;

  return c.toll[level]||c.toll[0]||0;

}


function payToll(p,c,done){

  const owner=players[c.owner];

  if(!owner){

    done();

    return;

  }


  /* 우대권 */

  if(p.favor>0){

    p.favor--;

    log(
      `${p.name}이(가) 우대권을 사용하여 통행료 면제`
    );

    render();

    done();

    return;

  }


  const toll=
    Math.min(
      calcToll(c),
      p.money
    );


  p.money-=toll;

  owner.money+=toll;


  log(
    `${p.name} → ${owner.name} `
    +`${c.name} 통행료 ${fmt(toll)}`
  );


  if(toll<calcToll(c)){

    p.alive=false;

    log(
      `${p.name} 파산`
    );

  }


  render();

  done();

}

/* =========================================================
   특수칸 설명
========================================================= */

function getSpaceDescription(c){

/* =========================================================
   건물 이름
========================================================= */

const BUILDING_NAMES=[
  '맨땅',
  '별장',
  '빌딩',
  '호텔'
];


/* =========================================================
   ★ 건물 구매 가능 여부
   ---------------------------------------------------------
   구매한 뒤 최소 한 바퀴 완주해야 함
========================================================= */

function canBuild(p,c){

  if(!p||!c)return false;

  if(c.type!=='property')return false;

  if(c.owner!==p.id)return false;

  if((c.build||0)>=3)return false;

  const completed=
    p.completedRounds||0;

  const boughtAt=
    c.purchaseRound||0;

  return completed>boughtAt;

}


/* =========================================================
   건물 가격
========================================================= */

function getBuildingPrice(c,nextLevel){

  if(nextLevel===1)
    return c.villa||0;

  if(nextLevel===2)
    return c.building||0;

  if(nextLevel===3)
    return c.hotel||0;

  return 0;

}


/* =========================================================
   ★ 건물 건설
========================================================= */

function buildBuilding(index){

  const p=players[turn];

  const c=board[index];

  if(!canBuild(p,c)){

    log(
      `${c.name}은(는) 현재 건물을 지을 수 없습니다.`
    );

    return;

  }


  const nextLevel=
    (c.build||0)+1;


  const price=
    getBuildingPrice(
      c,
      nextLevel
    );


  if(p.money<price){

    log(
      `${p.name}의 건설비가 부족합니다.`
    );

    return;

  }


  p.money-=price;

  c.build=nextLevel;


  log(
    `${p.name} → ${c.name} `
    +`${BUILDING_NAMES[nextLevel]} 건설`
  );


  render();

  showBuildMenu();

}


/* =========================================================
   ★ 건물 메뉴
========================================================= */

function showBuildMenu(){

  if(!gameStarted){

    log('게임을 먼저 시작하세요.');

    return;

  }


  const p=players[turn];

  let html='';


  Object.keys(p.props).forEach(index=>{

    const c=board[index];

    if(!c||c.type!=='property')
      return;


    const level=c.build||0;

    const next=level+1;


    html+=`

      <div class="card">

        <b>${c.name}</b>

        <p>
          현재 : ${BUILDING_NAMES[level]}
          <br>
          현재 통행료 :
          ${fmt(calcToll(c))}
        </p>

    `;


    if(next<=3){

      const price=
        getBuildingPrice(c,next);


      html+=`

        <p>
          다음 :
          ${BUILDING_NAMES[next]}
          <br>
          건설비 :
          ${fmt(price)}
        </p>

        <button
          class="build-btn"
          onclick="buildBuilding(${index})"
          ${canBuild(p,c)?'':'disabled'}
        >
          ${canBuild(p,c)?'건설':'한 바퀴 후 가능'}
        </button>

      `;

    }else{

      html+=
        '<p>최고 단계인 호텔입니다.</p>';

    }


    html+=
      '</div>';

  });


  if(!html){

    html=
      '<p>보유한 토지가 없습니다.</p>';

  }


  showModal(

    '건물 건설',

    html,

    [['닫기',closeModal]]

  );

}


/* =========================================================
   ★ 거래 메뉴
========================================================= */

function showTradeMenu(){

  if(!gameStarted){

    log('게임을 먼저 시작하세요.');

    return;

  }


  const p=players[turn];

  let html='';


  players
    .filter(x=>x.id!==p.id&&x.alive)
    .forEach(other=>{

      const props=
        Object.keys(other.props);


      props.forEach(index=>{

        const c=board[index];

        if(!c||c.owner!==other.id)
          return;


        const tradePrice=
          c.purchasePrice||c.price;


        html+=`

          <div class="trade-row">

            <div>

              <b>${c.name}</b>

              <br>

              <small>
                소유자 : ${other.name}<br>
                기준가격 : ${fmt(tradePrice)}
              </small>

            </div>

            <button
              class="build-btn"
              onclick="requestTrade(${index},${other.id})"
            >
              거래
            </button>

          </div>

        `;

      });

    });


  if(!html){

    html='<p>현재 거래할 수 있는 토지가 없습니다.</p>';

  }


  showModal(

    '토지 거래',

    html,

    [['닫기',closeModal]]

  );

}


/* =========================================================
   ★ 거래 요청
   ---------------------------------------------------------
   거래 기준가격 = 실제 구매가격
========================================================= */

function requestTrade(index,ownerId){

  const buyer=players[turn];

  const owner=players[ownerId];

  const c=board[index];

  const price=
    c.purchasePrice||c.price;


  if(!buyer||!owner||!c)
    return;


  closeModal();


  showModal(

    '거래 제안',

    `

      <div class="card">

        <h3>${c.name}</h3>

        <p>
          판매자 :
          <b>${owner.name}</b>
        </p>

        <p>
          실제 구매가격 :
          <b>${fmt(price)}</b>
        </p>

        <p>
          거래 요청자는
          실제 구매가격으로 제안합니다.
        </p>

      </div>

    `,

    [

      [

        '거래 요청',

        ()=>{

          closeModal();

          ownerTradeConfirm(
            index,
            ownerId,
            buyer.id,
            price
          );

        }

      ],

      ['취소',closeModal]

    ]

  );

}


/* =========================================================
   ★ 소유자 거래 승인
========================================================= */

function ownerTradeConfirm(
  index,
  ownerId,
  buyerId,
  price
){

  const owner=players[ownerId];

  const buyer=players[buyerId];

  const c=board[index];


  if(!owner||!buyer||!c)
    return;


  showModal(

    '거래 요청',

    `

      <div class="card">

        <h3>${c.name}</h3>

        <p>
          ${buyer.name}이(가)
          <b>${fmt(price)}</b>에
          구매를 요청했습니다.
        </p>

      </div>

    `,

    [

      [

        '거래 승인',

        ()=>{

          if(buyer.money<price){

            log(
              `${buyer.name}은(는) 거래금액이 부족합니다.`
            );

            closeModal();

            return;

          }


          buyer.money-=price;

          owner.money+=price;


          delete owner.props[index];

          buyer.props[index]=true;

          c.owner=buyer.id;

          c.purchasePrice=price;

          c.purchaseRound=
            buyer.completedRounds;


          log(
            `${buyer.name}이(가) `
            +`${c.name}을 `
            +`${owner.name}에게 `
            +`${fmt(price)}에 구매`
          );


          closeModal();

          render();

        }

      ],

      ['거절',closeModal]

    ]

  );

}


/* =========================================================
   황금열쇠
========================================================= */

function drawGolden(p,done){

  const card=
    deck[deckPos];

  deckPos++;

  if(deckPos>=deck.length)
    deckPos=0;


  showModal(

    '황금열쇠',

    `

      <div class="card">

        <h3>${card.title}</h3>

        <p>${card.text}</p>

      </div>

    `,

    [

      [

        '확인',

        ()=>{

          card.action(p);

          closeModal();


          if(pendingMove){

            const n=
              pendingMove;

            pendingMove=null;


            moveSteps(

              p,

              n,

              ()=>{

                arrivalAction(
                  p.pos,
                  done
                );

              }

            );

          }else{

            render();

            done();

          }

        }

      ]

    ]

  );

}


/* =========================================================
   무인도
========================================================= */

function islandTurn(p){

  if(p.escapeCard>0){

    showModal(

      '무인도',

      `<p>무인도 탈출권을 사용할 수 있습니다.</p>`,

      [

        [

          '탈출권 사용',

          ()=>{

            p.escapeCard--;

            p.island=0;

            log(
              `${p.name} 무인도 탈출`
            );

            closeModal();

            rolled=true;

            render();

            setTimeout(
              nextTurn,
              400
            );

          }

        ],

        [

          '그냥 쉬기',

          ()=>{

            p.island--;

            log(
              `${p.name} 무인도에서 대기`
            );

            closeModal();

            rolled=true;

            render();

            setTimeout(
              nextTurn,
              400
            );

          }

        ]

      ]

    );

    return;

  }


  p.island--;

  log(
    `${p.name} 무인도 턴 ${p.island}`
  );


  if(p.island<=0){

    log(
      `${p.name} 무인도에서 나왔습니다.`
    );

  }


  rolled=true;

  render();


  setTimeout(
    nextTurn,
    400
  );

}


/* =========================================================
   우주여행
========================================================= */

function showSpaceTravel(done){

  const destinations=[
    1,3,7,8,9,11,13,14,16,18,
    19,21,23,24,26,27,29,31,33,34,
    36,37,39
  ];


  let html=
    '<p>이동할 목적지를 선택하세요.</p>';


  html+='<div class="modal-buttons">';


  destinations.forEach(index=>{

    html+=`

      <button
        onclick="travelTo(${index});window.__travelDone=window.__travelDone||null"
      >
        ${board[index].name}
      </button>

    `;

  });


  html+='</div>';


  window.__spaceDone=done;


  showModal(
    '우주여행',
    html,
    []
  );

}


function travelTo(index){

  const p=players[turn];

  if(!p)return;

  p.pos=index;

  log(
    `${p.name} 우주여행 → ${board[index].name}`
  );

  closeModal();

  render();

  if(window.__spaceDone){

    const done=
      window.__spaceDone;

    window.__spaceDone=null;

    arrivalAction(
      index,
      done
    );

  }

}


/* =========================================================
   다음 턴
   ★ 선택한 인원수만 순환
========================================================= */

function nextTurn(){

  if(activePlayers().length<=1){

    endGame();

    return;

  }


  rolled=false;


  let tries=0;


  do{

    turn=
      (turn+1)%players.length;

    tries++;

  }while(

    !players[turn].alive &&
    tries<players.length+2

  );


  render();

}


/* =========================================================
   게임 종료
========================================================= */

function endGame(){

  const alive=
    activePlayers();


  if(alive.length===1){

    showModal(

      '게임 종료',

      `<p>
        <b>${alive[0].name}</b>만 남았습니다.
      </p>`,

      [['닫기',closeModal]]

    );

    return;

  }


  showModal(

    '게임 종료',

    '<p>게임이 종료되었습니다.</p>',

    [['닫기',closeModal]]

  );

}
