<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CPL SPORTS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#191f28;font-family:Arial,"Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1200px;margin:auto}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e9edf2}
.top{height:68px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:27px;font-weight:900;color:#3182f6}
.logo span{color:#191f28}
.admin{border:0;background:#191f28;color:#fff;border-radius:12px;padding:10px 16px;font-weight:800}
.nav{display:flex;gap:5px;padding:0 15px 10px;overflow-x:auto}
.nav button{border:0;background:#fff;border-radius:12px;padding:10px 15px;font-weight:800;white-space:nowrap}
.nav button.on{background:#e8f3ff;color:#3182f6}
main{padding:22px 16px 80px}
.hero{background:#191f28;color:white;border-radius:24px;padding:30px;margin-bottom:16px}
.hero h1{font-size:31px;margin:8px 0}
.hero p{color:#c8d0d9}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:15px;box-shadow:0 2px 12px #00000008}
.card h2{margin:0 0 15px}
.muted{color:#8b95a1}
.stat{font-size:29px;font-weight:900;margin-top:5px}
.match{display:flex;align-items:center;gap:10px;padding:15px 0;border-bottom:1px solid #edf0f2}
.match:last-child{border-bottom:0}
.mdate{width:105px;font-size:13px}
.mteam{flex:1;text-align:center;font-weight:900}
.score{min-width:65px;text-align:center;font-size:21px;font-weight:900}
.badge{display:inline-block;background:#eef1f5;color:#66717d;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:800}
.practice{background:#f0edff;color:#6845e8}
.gray,.primary,.danger,.dark{border:0;border-radius:12px;padding:11px 15px;font-weight:800}
.gray{background:#eef1f5}.primary{background:#3182f6;color:#fff}
.danger{background:#ffe8ea;color:#d9303e}.dark{background:#191f28;color:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.tabs button{border:0;background:#eef1f5;border-radius:11px;padding:9px 14px;font-weight:800}
.tabs button.on{background:#3182f6;color:#fff}
.team{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px;cursor:pointer;box-shadow:0 2px 12px #00000008}
.teamhead{display:flex;align-items:center;justify-content:space-between}
.teamname{font-size:21px;font-weight:900}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:8px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi div{background:#f7f8fa;border-radius:14px;padding:14px}
.kpi strong{display:block;font-size:20px;margin-top:4px}
.members{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.member{background:#f7f8fa;border-radius:12px;padding:12px;cursor:pointer}
.member b{display:block;margin-bottom:3px}
.list{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #edf0f2}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 7px;border-bottom:1px solid #e9edf2;text-align:center}
th{background:#fafbfc;color:#78838e;font-size:13px}
tr.clickable{cursor:pointer}
.news{padding:16px 0;border-bottom:1px solid #e9edf2;cursor:pointer}
.news h3{margin:0 0 7px}
.notice{background:#e8f3ff;color:#176bd3;padding:14px;border-radius:14px;margin-bottom:15px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
input,select,textarea{width:100%;padding:12px;border:1px solid #dfe3e8;border-radius:11px;background:white}
textarea{min-height:120px;resize:vertical}
.empty{text-align:center;padding:35px;color:#8b95a1}
.modal{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.modalbox{background:#fff;width:100%;max-width:850px;max-height:92vh;overflow:auto;border-radius:22px;padding:22px}
.close{float:right;border:0;background:#eef1f5;border-radius:10px;padding:7px 11px}
.comment{padding:12px 0;border-bottom:1px solid #edf0f2}
.comment b{display:block}
.comment small{color:#929aa4}
.predict{border:1px solid #e4e8ed;border-radius:15px;padding:15px;margin:10px 0}
.predict button{margin:4px}
.manager{background:#191f28;color:#fff;border-radius:13px;padding:13px}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ranktabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:15px}
.ranktabs button{border:0;background:#eef1f5;border-radius:10px;padding:9px 13px;font-weight:800;white-space:nowrap}
.ranktabs button.on{background:#3182f6;color:#fff}
.adminTitle{background:#191f28;color:#fff;border-radius:18px;padding:20px;margin-bottom:15px}
.smallbtn{padding:7px 10px!important;font-size:12px}
@media(max-width:800px){
.grid{grid-template-columns:repeat(2,1fr)}
.two{grid-template-columns:1fr}
.kpi{grid-template-columns:repeat(2,1fr)}
.form{grid-template-columns:1fr}
.members{grid-template-columns:1fr}
.mdate{width:80px}
}
</style>
</head>

<body>
<div class="app">

<header>
<div class="top">
<div class="logo">CPL <span>SPORTS</span></div>
<button type="button" class="admin" id="adminButton">⚙ 관리자</button>
</div>
<div class="nav" id="nav"></div>
</header>

<main id="main"></main>
</div>

<div class="modal" id="modal">
<div class="modalbox" id="modalbox"></div>
</div>

<script>
"use strict";

/* =========================================================

========================================================= */

const STORAGE_KEY="CPL_SPORTS_FINAL_2026";

const DEFAULT={

["2026-08-26","해찬팀","재우팀","정규"],
["2026-08-28","해찬팀","준열팀","정규"],
["2026-08-31","준열팀","재우팀","정규"],
["2026-09-02","준열팀","해찬팀","정규"],
["2026-09-04","해찬팀","시환팀","정규"],
["2026-09-07","준열팀","시환팀","정규"],
["2026-09-09","해찬팀","재우팀","정규"],
["2026-09-11","해찬팀","준열팀","정규"],
["2026-09-14","준열팀","재우팀","정규"],
["2026-09-16","준열팀","해찬팀","정규"],
["2026-09-18","해찬팀","시환팀","정규"],

["2026-08-25","시환팀","해찬팀","연습"],
["2026-08-27","재우팀","준열팀","연습"],
["2026-09-01","해찬팀","준열팀","연습"],
["2026-09-03","시환팀","재우팀","연습"],
["2026-09-08","시환팀","준열팀","연습"],
["2026-09-10","해찬팀","재우팀","연습"],
["2026-09-15","재우팀","시환팀","연습"],
["2026-09-17","준열팀","해찬팀","연습"]
].map(x=>({
date:x[0],away:x[1],home:x[2],type:x[3],time:"12:30"
})),

results:[],
stats:{},
predictions:{},
comments:[],

news:[
{id:1,date:"2026-08-22",title:"CPL SPORTS 공식 포털 오픈",
content:"CPL의 경기 일정, 경기 결과, 선수 기록, 팀 순위, 타자 순위, 투수 순위, 뉴스와 승부예측을 한 곳에서 확인할 수 있습니다."},
{id:2,date:"2026-08-22",title:"CPL 정규시즌 일정 공개",
content:"정규경기는 월요일·수요일·금요일에 진행되며 경기 시간은 12:30으로 통일합니다. 연습경기는 화요일·목요일에 진행됩니다."},
{id:3,date:"2026-08-22",title:"CPL 팀 운영 체계 확정",
content:"시환·해찬·재우·준열은 각 팀 감독이며 타자 6명과 투수 8명은 별도의 선수로 관리됩니다."}
],

settings:{adminPassword:"1234"}
};

/* =========================================================
   DATA LOAD
========================================================= */

let data;

try{
data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
}catch(e){
data=null;
}

if(!data || !data.teams || !data.settings){
data=deepCopy(DEFAULT);
save();
}else{
repairData();
}

function deepCopy(obj){
return JSON.parse(JSON.stringify(obj));
}

function save(){
try{
localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}catch(e){
console.error(e);
}
}

function repairData(){

if(!data.settings)data.settings={};
if(!data.settings.adminPassword)data.settings.adminPassword="1234";

if(!data.results)data.results=[];
if(!data.stats)data.stats={};
if(!data.predictions)data.predictions={};
if(!data.comments)data.comments=[];
if(!data.news)data.news=deepCopy(DEFAULT.news);
if(!data.schedule)data.schedule=deepCopy(DEFAULT.schedule);

Object.keys(DEFAULT.teams).forEach(team=>{
if(!data.teams[team]){
data.teams[team]=deepCopy(DEFAULT.teams[team]);
return;
}

let t=data.teams[team];

if(!t.manager)t.manager=DEFAULT.teams[team].manager;
if(!Array.isArray(t.hitters))t.hitters=deepCopy(DEFAULT.teams[team].hitters);
if(!Array.isArray(t.pitchers))t.pitchers=deepCopy(DEFAULT.teams[team].pitchers);
if(!Array.isArray(t.starters))t.starters=deepCopy(DEFAULT.teams[team].starters);
if(!t.win)t.win=DEFAULT.teams[team].win;
if(!t.bull)t.bull=DEFAULT.teams[team].bull;
if(!t.closer)t.closer=DEFAULT.teams[team].closer;
});

save();
}

/* =========================================================
   BASIC
========================================================= */

const menus=["홈","팀","일정","경기결과","순위","선수","통계","뉴스","규정"];

function $(id){
return document.getElementById(id);
}

function nav(active){
$("nav").innerHTML=menus.map(x=>
`<button type="button" class="${x===active?"on":""}" onclick="go('${x}')">${x}</button>`
).join("");
}

function go(page){
nav(page);

const pages={
"홈":home,
"팀":teamsPage,
"일정":schedulePage,
"경기결과":resultsPage,
"순위":standingsPage,
"선수":playersPage,
"통계":statsPage,
"뉴스":newsPage,
"규정":rulesPage
};

if(pages[page])pages[page]();
}

function dateText(d){
const x=new Date(d+"T12:30:00");
return `${x.getMonth()+1}/${x.getDate()} (${["일","월","화","수","목","금","토"][x.getDay()]})`;
}

function teamNames(){
return Object.keys(data.teams);
}

function allPlayers(){
let arr=[];
Object.values(data.teams).forEach(t=>{
arr.push(...t.hitters);
arr.push(...t.pitchers);
});
return [...new Set(arr)];
}

function allManagers(){
return ["시환","해찬","재우","준열"];
}

function gameKey(date,away,home){
return date+"_"+away+"_"+home;
}

function getResult(date,home,away){
return data.results.find(r=>r.date===date&&r.home===home&&r.away===away);
}

function getGame(date,home,away){
return data.schedule.find(g=>g.date===date&&g.home===home&&g.away===away);
}

function esc(s){
return String(s??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function escAttr(s){
return esc(s);
}

/* =========================================================
   HOME
========================================================= */

function home(){

const next=data.schedule
.filter(g=>!getResult(g.date,g.home,g.away))
.sort((a,b)=>a.date.localeCompare(b.date))
.slice(0,5);

$("main").innerHTML=`
<div class="hero">
<small>CPL SPORTS</small>
<h1>⚾ CPL 자체 스포츠 포털</h1>
<p>네이버 스포츠처럼 경기 · 일정 · 순위 · 선수 · 기록 · 뉴스 · 승부예측을 한 곳에서</p>
</div>

<div class="grid">
<div class="card"><span class="muted">팀</span><div class="stat">4</div></div>
<div class="card"><span class="muted">선수</span><div class="stat">${allPlayers().length}</div></div>
<div class="card"><span class="muted">전체 경기</span><div class="stat">${data.schedule.length}</div></div>
<div class="card"><span class="muted">경기시간</span><div class="stat">12:30</div></div>
</div>

<div class="two">
<div class="card">
<div class="sectionTitle">
<h2>📅 다음 경기</h2>
<button class="gray" onclick="go('일정')">전체 ›</button>
</div>
${next.length?next.map(gameRow).join(""):`<div class="empty">예정된 경기가 없습니다.</div>`}
</div>

<div>
<div class="card">
<h2>📰 최신 뉴스</h2>
${data.news.slice().reverse().slice(0,3).map(n=>`
<div class="news" onclick="newsDetail(${n.id})">
<h3>${esc(n.title)}</h3>
<span class="muted">${n.date} · 기사 보기 ›</span>
</div>`).join("")}
</div>

<div class="card">
<h2>🔮 승부예측</h2>
<p class="muted">다음 경기 승자를 예측하세요.</p>
${next[0]?`
<button class="primary" style="width:100%"
onclick="gameDetail('${next[0].date}','${next[0].home}','${next[0].away}')">
승부예측 참여 ›
</button>`:""}
</div>
</div>
</div>`;
}

function gameRow(g){

const r=getResult(g.date,g.home,g.away);

return `
<div class="match">
<div class="mdate">
<span class="badge ${g.type==="연습"?"practice":""}">${g.type}</span><br>
<span class="muted">${dateText(g.date)}<br>${g.time}</span>
</div>

<div class="mteam">${data.teams[g.away].icon}<br>${g.away}</div>

<div class="score">${r?`${r.awayScore}:${r.homeScore}`:"VS"}</div>

<div class="mteam">${data.teams[g.home].icon}<br>${g.home}</div>

<button class="gray" onclick="gameDetail('${g.date}','${g.home}','${g.away}')">›</button>
</div>`;
}

/* =========================================================
   TEAMS
========================================================= */

function teamsPage(){

${teamNames().map(team=>{

function teamDetail(team){

const t=data.teams[team];

modal(`
<button class="close" onclick="closeModal()">닫기</button>
<h2>${t.icon} ${team}</h2>

<div class="manager">
👔 감독 <b>${esc(t.manager)}</b>

<h3>🧢 타자 ${t.hitters.length}명</h3>

<h3>⚾ 투수 ${t.pitchers.length}명</h3>
<div class="members">
${t.pitchers.map((p,i)=>`
<div class="member" onclick="playerDetail('${escAttr(p)}')">
<b>${esc(p)}</b>
<span class="muted">투수 · 기록 보기</span>
</div>`).join("")}
</div>

<br>

<h3>🔥 투수진 운영</h3>
<div class="kpi">
<div><span>필승조</span><strong>${esc(t.win)}</strong></div>
<div><span>불펜</span><strong>${esc(t.bull)}</strong></div>
<div><span>마무리</span><strong>${esc(t.closer)}</strong></div>
<div><span>감독</span><strong>${esc(t.manager)}</strong></div>
</div>

<br>

<h3>🔄 선발 로테이션</h3>
<div class="notice">
${t.starters.map((x,i)=>`${i+1}선발 ${esc(x)}`).join("　→　")}

/* =========================================================
   SCHEDULE
========================================================= */

function schedulePage(){

$("main").innerHTML=`
<div class="card">
<h2>📅 전체 일정</h2>

<div class="tabs">
<button class="on" onclick="filterSchedule('전체',this)">전체</button>
<button onclick="filterSchedule('정규',this)">정규</button>
<button onclick="filterSchedule('연습',this)">연습</button>
</div>

<div id="scheduleList">
${data.schedule.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(gameRow).join("")}
</div>
</div>`;
}

function filterSchedule(type,btn){

document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
btn.classList.add("on");

$("scheduleList").innerHTML=data.schedule
.filter(g=>type==="전체"||g.type===type)
.sort((a,b)=>a.date.localeCompare(b.date))
.map(gameRow).join("");
}

/* =========================================================
   GAME
========================================================= */

function gameDetail(date,home,away){

const g=getGame(date,home,away);

/*
선발 자동 선정:
정규/연습 경기의 해당 팀 경기 횟수를 기준으로
1→2→3→4→5 선발 순서가 자동으로 돌아감.
관리자가 직접 지정한 로테이션도 사용됨.
*/
function getStarterForGame(team,date){

const games=data.schedule
.filter(g=>
g.type==="정규" &&
(g.home===team || g.away===team) &&
g.date<=date
)
.sort((a,b)=>a.date.localeCompare(b.date));

if(!games.length)return team.starters[0];

const index=(games.length-1)%team.starters.length;

return team.starters[index];
}

function predict(key,value){

}

function getStandings(){

const d={};

teamNames().forEach(t=>{
d[t]={g:0,w:0,l:0,draw:0,rf:0,ra:0};
});

data.results.filter(r=>r.type==="정규").forEach(r=>{

if(!d[r.home]||!d[r.away])return;

d[r.home].g++;
d[r.away].g++;

d[r.home].rf+=Number(r.homeScore);
d[r.home].ra+=Number(r.awayScore);
d[r.away].rf+=Number(r.awayScore);
d[r.away].ra+=Number(r.homeScore);

if(r.homeScore>r.awayScore){
d[r.home].w++;
d[r.away].l++;
}else if(r.homeScore<r.awayScore){
d[r.away].w++;
d[r.home].l++;
}else{
d[r.home].draw++;
d[r.away].draw++;
}
});

return Object.keys(d)
.map(team=>({
team,
...d[team],
pct:d[team].g?
(d[team].w+d[team].draw*.5)/d[team].g:0
}))
.sort((a,b)=>b.pct-a.pct||b.w-a.w);
}

========================================================= */

function calculateMVP(home,away){

const candidates=[
...data.teams[home].hitters,
...data.teams[away].hitters
];

let best=null;
let bestScore=-1;

candidates.forEach(p=>{

const s=data.stats[p]||{};

const score=
Number(s.h||0)*3+
Number(s.hr||0)*6+
Number(s.rbi||0)*4+
Number(s.sb||0)*2+
Number(s.bb||0);

if(score>bestScore){
bestScore=score;
best=p;
}
});

return {
player:best,
score:bestScore
};
}

function editSchedule(){

function addSchedule(){

const date=$("ndate").value;

if(!date){
alert("날짜를 입력하세요.");
return;
}

if($("nhome").value===$("naway").value){
alert("홈팀과 원정팀이 같을 수 없습니다.");
return;
}

data.schedule.push({
date,
time:$("ntime").value||"12:30",
home:$("nhome").value,
away:$("naway").value,
type:$("ntype").value
});

save();
editSchedule();
}

function updateSchedule(i){

const g=data.schedule[i];

g.date=$(`sd_${i}`).value;
g.time=$(`st_${i}`).value||"12:30";
g.home=$(`sh_${i}`).value;
g.away=$(`sa_${i}`).value;
g.type=$(`sy_${i}`).value;

if(g.home===g.away){
alert("홈팀과 원정팀이 같을 수 없습니다.");
return;
}

save();
editSchedule();
}

function deleteSchedule(i){

if(!confirm("이 일정을 삭제할까요?"))return;

data.schedule.splice(i,1);
save();
editSchedule();
}

/* =========================================================
   RESULT EDITOR
========================================================= */

function saveResult(){

const home=$("rhome").value;
const away=$("raway").value;
const date=$("rdate").value;

if(home===away){
alert("홈팀과 원정팀이 같을 수 없습니다.");
return;
}

if(!date){
alert("날짜를 입력하세요.");
return;
}

const homeScore=Number($("rhs").value||0);
const awayScore=Number($("ras").value||0);

const mvp=calculateMVP(home,away);

const existing=data.results.find(r=>
r.date===date&&r.home===home&&r.away===away
);

if(existing){

existing.homeScore=homeScore;
existing.awayScore=awayScore;
existing.type=$("rtype").value;
existing.time="12:30";
existing.mvp=mvp.player;
existing.mvpScore=mvp.score;

}else{

data.results.push({
date,
time:"12:30",
home,
away,
homeScore,
awayScore,
type:$("rtype").value,
mvp:mvp.player,
mvpScore:mvp.score
});
}

save();

alert("경기 결과 저장 완료\nMVP: "+(mvp.player||"기록 부족"));

adminPage();
}

function safeId(player){
return String(player).replace(/[^a-zA-Z0-9가-힣_-]/g,"_");
}

function savePlayerStat(player,type){

const id=safeId(player);

if(!data.stats[player])data.stats[player]={};

if(type==="pitcher"){

data.stats[player].ip=Number($(`ip_${id}`).value||0);
data.stats[player].era=Number($(`era_${id}`).value||0);
data.stats[player].w=Number($(`w_${id}`).value||0);
data.stats[player].l=Number($(`l_${id}`).value||0);
data.stats[player].k=Number($(`k_${id}`).value||0);
data.stats[player].whip=Number($(`whip_${id}`).value||0);
data.stats[player].save=Number($(`save_${id}`).value||0);

}else{

data.stats[player].ab=Number($(`ab_${id}`).value||0);
data.stats[player].h=Number($(`h_${id}`).value||0);
data.stats[player].hr=Number($(`hr_${id}`).value||0);
data.stats[player].rbi=Number($(`rbi_${id}`).value||0);
data.stats[player].bb=Number($(`bb_${id}`).value||0);
data.stats[player].sb=Number($(`sb_${id}`).value||0);
data.stats[player].tb=Number($(`tb_${id}`).value||0);

}

save();
alert(player+" 기록 저장 완료");
editStats();
}
