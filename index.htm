<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#eef1f5;
  color:#172033;
}
button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700;
  background:#172033;
  color:white;
}
button:disabled{opacity:.4;cursor:not-allowed}
.app{max-width:1500px;margin:auto;padding:18px}
header{
  background:#fff;
  border:1px solid #dfe4ea;
  border-radius:18px;
  padding:18px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.logo{font-size:27px;font-weight:900;letter-spacing:1px}
.sub{color:#718096;font-size:13px;margin-top:4px}
.headerBtns{display:flex;gap:8px}
.layout{
  display:grid;
  grid-template-columns:minmax(650px,1fr) 380px;
  gap:16px;
}
.panel,.boardWrap{
  background:#fff;
  border:1px solid #dfe4ea;
  border-radius:18px;
}
.boardWrap{padding:14px}
.board{
  width:min(100%,850px);
  aspect-ratio:1/1;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(11,1fr);
  grid-template-rows:repeat(11,1fr);
  gap:3px;
  background:#cbd2db;
  padding:3px;
  border-radius:12px;
}
.cell{
  position:relative;
  background:#fff;
  border-radius:5px;
  padding:4px;
  overflow:hidden;
  border:1px solid #d8dde4;
}
.cell.corner{background:#f6f7f9}
.cell.gold{background:#fff8dc}
.cell.vehicle{background:#edf6ff}
.cell.special{background:#f3f1ff}
.cell.seoul{background:#fff0f0}
.cellName{
  font-size:clamp(7px,1vw,12px);
  font-weight:800;
  line-height:1.1;
  text-align:center;
  margin-top:3px;
  word-break:keep-all;
}
.cellType{
  font-size:7px;
  text-align:center;
  color:#7a8492;
  margin-top:2px;
}
.price{
  font-size:8px;
  text-align:center;
  margin-top:2px;
  color:#4d5968;
}
.buildingMark{
  position:absolute;
  left:3px;
  bottom:3px;
  display:flex;
  gap:2px;
}
.build{
  min-width:14px;
  height:13px;
  border-radius:3px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:7px;
  font-weight:900;
  box-shadow:0 1px 3px #999;
}
.build.villa{height:10px}
.build.building{height:15px}
.build.hotel{height:20px}
.tokens{
  position:absolute;
  right:3px;
  bottom:3px;
  display:flex;
  gap:2px;
}
.token{
  width:17px;
  height:17px;
  border-radius:50%;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:8px;
  font-weight:900;
  border:2px solid #fff;
  box-shadow:0 1px 3px #777;
}
.center{
  grid-column:2/11;
  grid-row:2/11;
  background:linear-gradient(135deg,#101827,#26364f);
  border-radius:10px;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
.center h1{
  margin:0;
  font-size:clamp(24px,5vw,58px);
  letter-spacing:3px;
}
.center p{
  margin:8px 0 0;
  color:#cbd5e1;
  font-size:12px;
}
.side{display:flex;flex-direction:column;gap:12px}
.panel{padding:15px}
.turnBox{display:flex;align-items:center;gap:10px}
.turnDot{width:16px;height:16px;border-radius:50%}
.turnName{font-size:20px;font-weight:900}
.money{margin-left:auto;font-size:18px;font-weight:900}
.diceArea{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.dice{display:flex;gap:7px}
.die{

  height:48px;

  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:900;
  background:#fafafa;
}
.actionRow{display:flex;gap:8px;margin-top:10px}
.actionRow button{flex:1}
.primary{background:#2563eb}
.green{background:#16a34a}
.red{background:#dc2626}
.goldBtn{background:#b88700}
.sectionTitle{font-size:14px;font-weight:900;margin-bottom:9px}
.players{display:flex;flex-direction:column;gap:7px}
.playerRow{
  display:flex;

  gap:8px;
  padding:8px;
  background:#f7f8fa;
  border-radius:9px;
}
.playerDot{width:13px;height:13px;border-radius:50%}
.playerRow .name{font-weight:800}
.playerRow .cash{margin-left:auto;font-weight:800}
.playerRow .pos{font-size:11px;color:#77808c}
.log{
  height:190px;

}
.infoGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.info{background:#f7f8fa;border-radius:9px;padding:9px}
.info b{

}
.info span{font-weight:900}
.modalBack{
  position:fixed;

  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:15px;
}
.modal{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:20px;
}
.modal h2{margin:0 0 10px}
.modalText{line-height:1.65;font-size:14px;white-space:pre-line}
.modalBtns{
  display:grid;

  gap:8px;
  margin-top:15px;
}
.assetBtn{
  background:#f4f6f8;
  color:#172033;

.notice{

  .side{gap:8px}
}
</style>

    {hour:"2-digit",minute:"2-digit"});
  el.innerHTML=`<div>[${time}] ${msg}</div>`+el.innerHTML;
}

function activePlayers(){
  return players.filter(p=>p.alive);
}

function initPlayers(){
  players=names.slice(0,playerCount).map((name,i)=>({
    id:i,
    name,
    money:500,
    pos:0,
    completedRounds:0,

    /*
      무인도 상태
      islandTurns = 실제 무인도에서 주사위를 굴린 횟수
    */
    inIsland:0,
    islandTurns:0,

    escapeCard:0,

    pendingSpace:false,

    /*
      반액 대매출 카드
      true이면 다음 자산 매각 1회만 절반
    */
    halfSale:false,

    welfareFree:false,

    alive:true
  }));
}

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-.5);
}

/* =========================================================
   새 게임
========================================================= */

function newGame(){

  showModal(
    "게임 인원 선택",
    "플레이할 인원 수를 선택하세요.\n시작 자금은 500만원입니다.",
    [
      ["2명",()=>startGame(2)],
      ["3명",()=>startGame(3)],
      ["4명",()=>startGame(4)]
    ]
  );
}

function startGame(count){

  actionLocked=false;
  moving=false;

  playerCount=count;
  initPlayers();

  turn=0;
  rolled=false;
  dice=[1,1];
  fund=0;
  round=0;

  deck=shuffle(golden.map((c,i)=>({...c,id:i+1})));
  deckPos=0;

  boardData.forEach(c=>{
    delete c.owner;
    delete c.building;
    delete c.purchaseRound;
    delete c.purchasePrice;
  });

  document.getElementById("log").innerHTML="";

  closeModal();

  log(`${count}인 게임 시작. 시작 자금 ${money(500)}.`);

  render();
}

/* =========================================================
   BOARD
========================================================= */

function perimeterPositions(){

  const arr=[];

  for(let c=0;c<11;c++)arr.push([0,c]);
  for(let r=1;r<11;r++)arr.push([r,10]);
  for(let c=9;c>=0;c--)arr.push([10,c]);
  for(let r=9;r>0;r--)arr.push([r,0]);

  return arr;
}

function buildBoard(){

  const board=document.getElementById("board");

  board.innerHTML="";

  const coords=perimeterPositions();

  for(let i=0;i<40;i++){

    const c=boardData[i];
    const div=document.createElement("div");
    const [r,col]=coords[i];

    div.className="cell";

    div.style.gridRow=r+1;
    div.style.gridColumn=col+1;

    if(i===0||i===10||i===20||i===30)
      div.classList.add("corner");

    if(c.type==="gold")
      div.classList.add("gold");

    if(c.type==="vehicle")
      div.classList.add("vehicle");

    if(c.type==="tour"||c.type==="welfare")
      div.classList.add("special");

    if(c.seoul)
      div.classList.add("seoul");

    let html=`<div class="cellName">${c.name}</div>`;

    if(c.type==="property"){

      html+=`<div class="price">${money(c.price)}</div>`;

      html+=`<div class="cellType">대지료 ${money(c.landFee)}</div>`;

    }else if(c.type==="vehicle"){

      html+=`<div class="price">구입 ${money(c.price)}</div>`;

      html+=`<div class="cellType">통행료 ${money(c.toll)}</div>`;

    }else{

      html+=`<div class="cellType">${typeText(c.type)}</div>`;

    }

    if(c.owner!==undefined){

      const owner=players[c.owner];

      if(owner){

        html+=`
        <div style="
        position:absolute;
        top:2px;
        left:2px;
        width:7px;
        height:7px;
        border-radius:50%;
        background:${colors[c.owner]}"></div>`;
      }
    }

    if(c.building){

      const owner=players[c.owner];

      const color=owner?colors[c.owner]:"#555";

      const label=
        c.building==="villa"?"별장":
        c.building==="building"?"빌딩":"호텔";

      html+=`
      <div class="buildingMark">
        <div class="build ${c.building}"
             style="background:${color}"
             title="${label}">
          ${c.building==="villa"?"별":
            c.building==="building"?"빌":"호"}
        </div>
      </div>`;
    }

    const tokens=
      players.filter(p=>p.alive&&p.pos===i);

    if(tokens.length){

      html+=`<div class="tokens">`;

      tokens.forEach(p=>{

        html+=`
        <div class="token"
             style="background:${colors[p.id]}">
          ${p.id+1}
        </div>`;

      });

      html+=`</div>`;
    }

    div.innerHTML=html;

    div.onclick=()=>showProperty(i);

    board.appendChild(div);
  }

  const center=document.createElement("div");

  center.className="center";

  center.innerHTML=`
    <h1>WORLD MARBLE</h1>
    <p>WORLD TRAVEL</p>
  `;

  board.appendChild(center);
}

function typeText(type){

  return {
    start:"출발",
    gold:"황금열쇠",
    island:"무인도",
    welfare:"사회복지기금",
    tour:"우주여행"
  }[type]||"";
}

/* =========================================================
   RENDER
========================================================= */

function render(){

  buildBoard();

  if(!players.length){

    document.getElementById("turnName").textContent="게임 시작 전";
    document.getElementById("turnState").textContent="새 게임을 시작하세요.";
    document.getElementById("turnMoney").textContent=money(0);

    return;
  }

  const p=players[turn];

  document.getElementById("turnName").textContent=p.name;

  document.getElementById("turnDot").style.background=colors[p.id];

  document.getElementById("turnMoney").textContent=money(p.money);

  let state="";

  if(p.money<0){

    state="⚠ 빚 상태";

  }else if(p.inIsland>0){

    state=
      `🏝️ 무인도 ${p.islandTurns}/3회 · 더블이면 탈출`;

  }else if(!rolled){

    state="주사위를 굴리세요.";

  }else if(dice[0]===dice[1]){

    state="더블! 한 번 더 굴릴 수 있습니다.";

  }else{

    state="이동 완료. 턴 종료를 누르세요.";
  }

  if(p.pendingSpace)
    state+=" · 우주여행 가능";

  document.getElementById("turnState").textContent=state;

  document.getElementById("die1").textContent=
    dice[0]||"–";

  document.getElementById("die2").textContent=
    dice[1]||"–";

  /*
    일반 더블이 아니면 종료 가능.
    무인도에서는 더블이어도 이동 후 상태를 처리.
  */
  document.getElementById("rollBtn").disabled=
    moving ||
    (rolled && dice[0]!==dice[1]);

  document.getElementById("endBtn").disabled=
    moving ||
    !rolled ||
    dice[0]===dice[1] ||
    p.inIsland>0;

  document.getElementById("fund").textContent=money(fund);

  const pl=document.getElementById("players");

  pl.innerHTML=players.map(p=>`

    <div class="playerRow"
      style="${p.id===turn?
      'outline:2px solid '+colors[p.id]:''}">

      <div class="playerDot"
           style="background:${colors[p.id]}"></div>

      <div>
        <div class="name">${p.name}</div>

        <div class="pos">
          ${boardData[p.pos].name}
          ${p.inIsland>0?
            ` · 무인도 ${p.islandTurns}/3`:""}
          ${p.alive?"":" · 탈락"}
        </div>
      </div>

      <div class="cash">${money(p.money)}</div>

    </div>

  `).join("");

  showCurrentInfo();
}

/* =========================================================
   주사위
========================================================= */

function rollDice(){

  if(actionLocked||moving)
    return;

  if(!players.length){

    newGame();
    return;
  }

  const p=players[turn];

  if(!p.alive)
    return;

  if(p.money<0){

    settleDebt();
    return;
  }

  /*
    일반 턴에서는 더블일 때만 다시 굴릴 수 있음.
  */
  if(rolled && dice[0]!==dice[1])
    return;

  actionLocked=true;

  dice=[
    Math.floor(Math.random()*6)+1,
    Math.floor(Math.random()*6)+1
  ];

  rolled=true;

  const steps=dice[0]+dice[1];

  log(`${p.name} 주사위 ${dice[0]} + ${dice[1]} = ${steps}.`);

  /*
    무인도 처리
  */
  if(p.inIsland>0){

    handleIslandRoll(p,steps);

    return;
  }

  movePlayerAnimated(p,steps);
}

/* =========================================================
   무인도
========================================================= */

function handleIslandRoll(p,steps){

  const isDouble=dice[0]===dice[1];

  p.islandTurns++;

  /*
    더블이면 즉시 탈출
  */
  if(isDouble){

    log(
      `${p.name} 무인도에서 더블! 무인도를 탈출합니다.`
    );

    p.inIsland=0;
    p.islandTurns=0;

    /*
      더블로 탈출하면서 주사위 숫자만큼 이동
    */
    movePlayerAnimated(p,steps);

    return;
  }

  /*
    3번째 시도까지 더블이 아니면
    3회 제한으로 탈출
  */
  if(p.islandTurns>=3){

    log(
      `${p.name} 무인도 3회 시도 완료. 무인도를 탈출합니다.`
    );

    p.inIsland=0;
    p.islandTurns=0;

    /*
      3회째 이동은 하지 않고 탈출만 처리
    */
    rolled=false;
    dice=[1,1];

    actionLocked=false;

    render();

    /*
      무인도 탈출 후 이번 턴 종료
    */
    setTimeout(()=>{
      nextTurn();
    },300);

    return;
  }

  /*
    아직 3회 미만이고 더블도 아님
    이동하지 않고 턴 종료
  */

  log(
    `${p.name} 무인도 ${p.islandTurns}/3회. 더블이 나오지 않았습니다.`
  );

  actionLocked=false;

  render();

  setTimeout(()=>{
    nextTurn();
  },500);
}

/* =========================================================
   이동
   0.5초마다 한 칸
========================================================= */

function movePlayerAnimated(p,steps){

  moving=true;

  let count=0;

  const timer=setInterval(()=>{

    if(count>=steps){

      clearInterval(timer);

      moving=false;

      resolveLanding(p,p.pos);

      actionLocked=false;

      render();

      return;
    }

    const old=p.pos;

    const newPos=(old+1)%40;

    /*
      실제로 한 칸씩 이동
    */
    p.pos=newPos;

    /*
      출발점 통과 시 정확히 한 번만 지급
    */
    if(newPos===0){

      p.completedRounds++;

      round++;

      p.money+=20;

      log(
        `${p.name}이(가) 출발점을 통과했습니다. ${money(20)} 지급.`
      );
    }

    count++;

    log(
      `${p.name} → ${boardData[p.pos].name}`
    );

    render();

  },500);
}

/*
  여행권/카드/우주여행 전용 이동
  출발점 보너스 없음
*/
function moveDirect(p,pos){

  p.pos=pos;

  log(
    `${p.name} → ${boardData[pos].name}`
  );

  resolveLanding(p,pos);

  render();
}

/* =========================================================
   착지
========================================================= */

function resolveLanding(p,pos){

  const c=boardData[pos];

  if(c.type==="start")
    return;

  if(c.type==="property"){

    propertyLanding(p,pos);

    return;
  }

  if(c.type==="vehicle"){

    vehicleLanding(p,pos);

    return;
  }

  if(c.type==="gold"){

    drawGold();

    return;
  }

  if(c.type==="welfare"){

    if(c.name.includes("수령")){

      const amount=fund;

      p.money+=amount;

      fund=0;

      log(
        `${p.name}이(가) 사회복지기금 ${money(amount)}을 받았습니다.`
      );

    }else{

      /*
        사회복지금 면제 카드
      */
      if(p.welfareFree){

        p.welfareFree=false;

        log(
          `${p.name} 사회복지기금 면제권 사용.`
        );

      }else{

        fund+=10;

        p.money-=10;

        log(
          `${p.name} 사회복지기금 ${money(10)} 납부.`
        );

      }
    }

    return;
  }

  if(c.type==="island"){

    /*
      무인도에 새로 들어온 경우
      3회 제한을 새로 시작
    */
    p.inIsland=1;
    p.islandTurns=0;

    log(`${p.name} 무인도에 갇혔습니다.`);

    return;
  }

  if(c.type==="tour"){

    /*
      다음 턴부터 사용 가능
    */
    p.pendingSpace=true;

    log(
      `${p.name} 우주여행 도착. 다음 턴부터 이용할 수 있습니다.`
    );

    return;
  }
}

/* =========================================================
   토지
========================================================= */

function propertyLanding(p,pos){

  const c=boardData[pos];

  /*
    이미 다른 사람 소유
  */
  if(c.owner!==undefined){

    if(c.owner===p.id){

      /*
        서울은 건물 불가
      */
      if(c.seoul){

        log(
          `${p.name} 서울은 건물 설치가 불가능합니다.`
        );

        return;
      }

      /*
        구매 후 한 바퀴 이상 돌아야 함
      */
      if(
        p.completedRounds >
        (c.purchaseRound??0)
      ){

        showBuildMenu(p,pos);

      }else{

        log(
          `${c.name}: 아직 구매 후 한 바퀴를 완료하지 않았습니다.`
        );
      }

      return;
    }

    /*
      남의 땅
    */
    const owner=players[c.owner];

    const toll=calcPropertyToll(c);

    p.money-=toll;

    owner.money+=toll;

    log(
      `${p.name} → ${owner.name}에게 ${c.name} 통행료 ${money(toll)} 지급.`
    );

    if(p.money<0)
      settleDebt();

    return;
  }

  /*
    빈 땅
    여행권으로 왔더라도 똑같이 구매 가능
  */
  showModal(
    `${c.name} 도착`,
    `빈 땅입니다.

땅 가격: ${money(c.price)}
대지료: ${money(c.landFee)}

지금 땅을 구매할 수 있습니다.

※ 여행권으로 이동한 경우에도 해당 지역의 정상적인 구매 규칙이 적용됩니다.
※ 건물은 땅 구매 후 한 바퀴 이상 돌아 다시 방문해야 합니다.`,
    [
      [
        `땅 구매 ${money(c.price)}`,
        ()=>buyLand(p,pos)
      ],
      [
        "구매하지 않기",
        closeModal
      ]
    ]
  );
}

function buyLand(p,pos){

  const c=boardData[pos];

  /*
    이중 클릭/동시 구매 방지
  */
  if(c.owner!==undefined){

    alert("이미 다른 플레이어가 소유한 땅입니다.");

    closeModal();

    render();

    return;
  }

  if(p.money<0){

    alert("빚이 있는 상태에서는 구매할 수 없습니다.");

    return;
  }

  if(p.money<c.price){

    alert("돈이 부족합니다.");

    return;
  }

  p.money-=c.price;

  c.owner=p.id;

  c.purchaseRound=p.completedRounds;

  c.building=null;

  log(
    `${p.name}이(가) ${c.name}을(를) ${money(c.price)}에 구매했습니다.`
  );

  closeModal();

  render();
}

/* =========================================================
   건물
========================================================= */

function showBuildMenu(p,pos){

  const c=boardData[pos];

  if(c.seoul){

    alert("서울은 건물을 지을 수 없습니다.");

    return;
  }

  let buttons=[];

  /*
    순서 강제
  */

  if(!c.building){

    buttons.push([
      `별장 구매 ${money(c.villa)}`,
      ()=>buyBuilding(p,pos,"villa")
    ]);

  }else if(c.building==="villa"){

    buttons.push([
      `빌딩 건설 ${money(c.buildingCost)}`,
      ()=>buyBuilding(p,pos,"building")
    ]);

  }else if(c.building==="building"){

    buttons.push([
      `호텔 건설 ${money(c.hotel)}`,
      ()=>buyBuilding(p,pos,"hotel")
    ]);

  }else{

    buttons.push([
      "호텔 완성 — 추가 건설 불가",
      ()=>{}
    ]);
  }

  buttons.push([
    "취소",
    closeModal
  ]);

  showModal(
    `${c.name} 건물`,
    `현재 지역: ${c.name}

현재 건물: ${c.building?
      buildingName(c.building):"없음"}

건설 순서:

① 별장
↓
② 빌딩
↓
③ 호텔

※ 건물은 현재 플레이어가 서 있는 자기 땅에서만 건설할 수 있습니다.
※ 구매 후 한 바퀴 이상 돌아야 건설할 수 있습니다.`,
    buttons
  );
}

function buyBuilding(p,pos,type){

  const c=boardData[pos];

  if(c.owner!==p.id){

    alert("자기 땅만 건설할 수 있습니다.");

    return;
  }

  if(c.seoul){

    alert("서울은 건물을 설치할 수 없습니다.");

    return;
  }

  if(
    p.completedRounds <=
    (c.purchaseRound??0)
  ){

    alert(
      "땅을 산 후 한 바퀴 이상 돌아야 합니다."
    );

    return;
  }

  /*
    건설 순서 강제
  */
  if(type==="villa" && c.building){

    alert("이미 건물이 있습니다.");

    return;
  }

  if(type==="building" && c.building!=="villa"){

    alert("빌딩은 별장 다음에 건설할 수 있습니다.");

    return;
  }

  if(type==="hotel" &&
     c.building!=="building"){

    alert("호텔은 빌딩 다음에 건설할 수 있습니다.");

    return;
  }

  let cost=0;

  if(type==="villa")
    cost=c.villa;

  if(type==="building")
    cost=c.buildingCost;

  if(type==="hotel")
    cost=c.hotel;

  /*
    돈이 부족하면 절대 건설하지 않음
  */
  if(p.money<cost){

    alert(
      `건설비가 부족합니다.\n필요 금액: ${money(cost)}`
    );

    return;
  }

  p.money-=cost;

  c.building=type;

  log(
    `${p.name}이(가) ${c.name}에 ${buildingName(type)} 건설.
비용 ${money(cost)}.`
  );

  closeModal();

  render();
}

function buildingName(type){

  return type==="villa"?
    "별장":
    type==="building"?
      "빌딩":
      "호텔";
}

function calcPropertyToll(c){

  if(c.building==="villa")
    return c.villaFee;

  if(c.building==="building")
    return c.buildingFee;

  if(c.building==="hotel")
    return c.hotelFee;

  return c.landFee;
}

/* =========================================================
   탈것
========================================================= */

function vehicleLanding(p,pos){

  const c=boardData[pos];

  if(c.owner===undefined){

    showModal(
      `${c.name} 도착`,
      `구입 가격: ${money(c.price)}
통행료: ${money(c.toll)}

탈것은 건물을 지을 수 없습니다.`,
      [
        [
          `구매 ${money(c.price)}`,
          ()=>buyVehicle(p,pos)
        ],
        [
          "구매하지 않기",
          closeModal
        ]
      ]
    );

    return;
  }

  if(c.owner===p.id){

    log(`${p.name}의 ${c.name}입니다.`);

    return;
  }

  p.money-=c.toll;

  players[c.owner].money+=c.toll;

  log(
    `${p.name} → ${players[c.owner].name}에게 ${c.name} 통행료 ${money(c.toll)} 지급.`
  );

  if(p.money<0)
    settleDebt();
}

function buyVehicle(p,pos){

  const c=boardData[pos];

  if(c.owner!==undefined){

    alert("이미 다른 플레이어가 소유한 탈것입니다.");

    return;
  }

  if(p.money<0){

    alert("빚이 있는 상태에서는 구매할 수 없습니다.");

    return;
  }

  if(p.money<c.price){

    alert("돈이 부족합니다.");

    return;
  }

  p.money-=c.price;

  c.owner=p.id;

  c.purchasePrice=c.price;

  log(
    `${p.name}이(가) ${c.name}을(를) ${money(c.price)}에 구매했습니다.`
  );

  closeModal();

  render();
}

function useSpaceTravel(){

  const p=players[turn];

  if(!p.pendingSpace){

    alert(
      "우주여행 칸에 도착한 다음 턴부터 이용할 수 있습니다."
    );

    return;
  }

  const destinations=[
    1,3,4,5,7,8,9,11,13,14,16,18,19,
    21,23,24,25,26,27,29,31,33,34,36,37,39
  ];

  const buttons=destinations.map(pos=>[

    boardData[pos].name,

    ()=>{

      if(actionLocked)
        return;

      actionLocked=true;

      const fee=20;

      const col=boardData[32];

      /*
        콜럼비아호 소유자가 다른 사람일 때만 이용료
      */

        col.owner!==undefined &&
        col.owner!==p.id
      ){

        players[col.owner].money+=fee;

        log(

      */

        우주여행은 출발점 보너스를 지급하지 않는 직접 이동
      */
      moveDirect(p,pos);

      closeModal();

      actionLocked=false;

      render();

      if(p.money<0)
        settleDebt();

  ]);

  buttons.push([
    "취소",
    closeModal
  ]);

  showModal(
    "우주여행",

    buttons
  );
}

/* =========================================================
   황금열쇠
========================================================= */

function drawGold(){

  if(!deck.length)
    return;

  const card=deck[deckPos];

  deckPos=
    (deckPos+1)%deck.length;

  /*
    카드 한 번만 실행
  */
  showModal(
    `황금열쇠 — ${card.title}`,
    card.text,
    [
      [
        "확인",
        ()=>applyCard(card)
      ]
    ]
  );
}

function applyCard(card){

  const p=players[turn];

  if(!p||!p.alive)
    return;

  /*
    카드 효과는 여기서 단 한 번만 실행
  */

  if(card.action==="money"){

    p.money+=card.value;

    log(
      `${p.name}: ${card.title} → ${money(Math.abs(card.value))}
      ${card.value>=0?"수령":"지불"}.`
    );
  }

  if(card.action==="hotelBonus"){

    p.money+=card.value;

    log(
      `${p.name}: 호텔 건설비 지원 ${money(card.value)} 수령.`
    );
  }

  if(card.action==="start"){

    /*
      카드 이동은 출발점 보너스 없음
    */
    moveDirect(p,0);
  }

  if(card.action==="move"){

    /*
      여행권 이동
      출발점 보너스 없음
      목적지의 정상 착지 처리
    */
    moveDirect(p,card.value);
  }

  if(card.action==="concord"){

    const concord=
      boardData.findIndex(
        x=>x.name==="콩코드 여객기"
      );

    moveDirect(p,concord);
  }

  if(card.action==="escape"){

    p.escapeCard++;

    log(
      `${p.name}: 무인도 탈출권 획득.`
    );
  }

  if(card.action==="halfSale"){

    /*
      카드가 즉시 매각하지 않고
      다음 실제 자산 매각 1회에만 적용
    */
    p.halfSale=true;

    log(
      `${p.name}: 반액 대매출 카드 사용 준비. 다음 자산 1회 매각가가 절반으로 적용됩니다.`
    );
  }

  if(card.action==="welfareFree"){

    p.welfareFree=true;

    log(
      `${p.name}: 사회복지기금 면제권 획득.`
    );
  }

  closeModal();

  render();

  if(p.money<0)
    settleDebt();
}

   은행 / 매각
========================================================= */

function showBank(){

  if(!players.length){

    alert("게임을 먼저 시작하세요.");

    return;
  }

  const p=players[turn];

  let buttons=[];

  /*
    현재 보드의 실제 소유권만 사용
  */
  boardData.forEach((c,i)=>{

    if(c.owner===p.id &&
       c.type==="property"){

      const base=c.price;

      const value=
        p.halfSale?
        Math.floor(base/2):
        base;

      buttons.push([
        `${c.name} — ${money(value)}에 매각`,
        ()=>sellLand(i)
      ]);
    }
  });

  boardData.forEach((c,i)=>{

    if(c.owner===p.id &&
       c.type==="vehicle"){

      const base=c.purchasePrice||c.price;

      const value=
        p.halfSale?
        Math.floor(base/2):
        base;

      buttons.push([
        `${c.name} — ${money(value)}에 매각`,
        ()=>sellVehicle(i)
      ]);
    }
  });

  if(!buttons.length){

    buttons.push([
      "매각할 자산 없음",
      ()=>{}
    ]);
  }

  buttons.push([
    "닫기",
    closeModal
  ]);

  showModal(
    "은행 / 자산 매각",
    `현재 자금: ${money(p.money)}

땅과 탈것은 은행에만 판매할 수 있습니다.

${
p.halfSale?
"⚠ 반액 대매출 적용 중\n다음 자산 1개를 정상 매각가의 50%에 판매합니다."
:
""
}

건물이 있는 땅을 판매하면 건물도 함께 없어집니다.`,
    buttons
  );
}

function sellLand(pos){

  const p=players[turn];

  const c=boardData[pos];

  if(c.owner!==p.id){

    alert("본인 소유 자산만 판매할 수 있습니다.");

    return;
  }

  const base=c.price;

  /*
    반액 대매출 적용
  */
  const value=
    p.halfSale?
    Math.floor(base/2):
    base;

  p.money+=value;

  /*
    반액 카드는 정확히 한 번만 사용
  */
  if(p.halfSale){

    p.halfSale=false;

    log(
      `${p.name}: 반액 대매출 적용 → ${c.name} ${money(value)} 매각.`
    );

  }else{

    log(
      `${p.name}이(가) ${c.name}을(를) 은행에 ${money(value)}에 판매했습니다.`
    );
  }

  delete c.owner;
  delete c.building;
  delete c.purchaseRound;

  /*
    매각 후에도 은행창을 닫지 않고 다시 생성
    → 여러 자산을 연속으로 매각 가능
  */
  showBank();

  render();
}

function sellVehicle(pos){

  const p=players[turn];

  const c=boardData[pos];

  if(c.owner!==p.id)
    return;

  const base=c.purchasePrice||c.price;

  const value=
    p.halfSale?
    Math.floor(base/2):
    base;

  p.money+=value;

  if(p.halfSale){

    p.halfSale=false;

    log(
      `${p.name}: 반액 대매출 적용 → ${c.name} ${money(value)} 매각.`
    );

  }else{

    log(
      `${p.name}이(가) ${c.name}을(를) 은행에 ${money(value)}에 판매했습니다.`
    );
  }

  delete c.owner;
  delete c.purchasePrice;

  /*
    여러 번 매각 가능
  */
  showBank();

  render();
}

========================================================= */

function settleDebt(){

  const p=players[turn];

  if(p.money>=0){

    render();

    return;
  }

  showModal(
    "빚 상환",
    `${p.name}의 현재 자금은 ${money(p.money)}입니다.

자산을 팔아 빚을 갚아야 합니다.

자산을 모두 팔아도 0원 미만이면 파산합니다.

0원은 파산이 아닙니다.`,
    [
      [
        "자산 매각",
        showBank
      ],
      [
        "파산 확인",
        checkBankruptcy
      ]
    ]
  );
}

function checkBankruptcy(){

  const p=players[turn];

  if(p.money>=0){

    closeModal();

    render();

    return;
  }

  const hasAsset=
    boardData.some(
      c=>c.owner===p.id
    );

  if(hasAsset){

    alert(
      "아직 자산을 팔아 빚을 갚을 수 있습니다."
    );

    showBank();

    return;
  }

  p.alive=false;

  boardData.forEach(c=>{

    if(c.owner===p.id){

      delete c.owner;
      delete c.building;
      delete c.purchaseRound;
      delete c.purchasePrice;
    }
  });

  log(`${p.name} 파산.`);

  closeModal();

  if(activePlayers().length<=1){

    endGame();

  }else{

    nextTurn();
  }
}

/* =========================================================
   턴
========================================================= */

function endTurn(){

  if(!players.length)
    return;

  const p=players[turn];

  if(!rolled)
    return;

  /*
    무인도에서는 일반 턴 종료 버튼 사용 안 함
  */
  if(p.inIsland>0)
    return;

  /*
    더블이면 반드시 다시 굴림
  */
  if(dice[0]===dice[1]){

    alert(
      "더블이므로 한 번 더 굴려야 합니다."
    );

    return;
  }

  if(p.money<0){

    settleDebt();

    return;
  }

  nextTurn();
}

function nextTurn(){

  if(activePlayers().length<=1){

    endGame();

    return;
  }

  let next=turn;

  let guard=0;

  do{

    next=(next+1)%players.length;

    guard++;

  }while(
    !players[next].alive &&
    guard<players.length+2
  );

  turn=next;

  rolled=false;

  dice=[1,1];

  actionLocked=false;

  const p=players[turn];

  log(`${p.name}의 턴.`);

  render();

  /*
    우주여행 가능
  */
  if(p.pendingSpace){

    setTimeout(()=>{

      if(
        players[turn]!==p ||
        p.pendingSpace===false
      )
        return;

      showModal(
        "우주여행 가능",
        `${p.name}은(는) 지난 턴에 우주여행 칸에 도착했습니다.

이번 턴부터 우주여행을 이용할 수 있습니다.`,
        [
          [
            "우주여행 이용",
            useSpaceTravel
          ],
          [
            "이번에는 이용하지 않기",
            closeModal
          ]
        ]
      );

    },300);
  }
}

function endGame(){

  const alive=activePlayers();

  if(alive.length===1){

    showModal(
      "게임 종료",
      `${alive[0].name}만 남았습니다.

게임이 종료되었습니다.`,
      [
        [
          "확인",
          closeModal
        ]
      ]
    );

    log(
      `게임 종료 — ${alive[0].name} 생존.`
    );
  }
}

/* =========================================================
   MODAL
========================================================= */

function showModal(title,text,buttons=[]){

  modalOpen=true;

  document.getElementById("modalTitle")
    .textContent=title;

  document.getElementById("modalBody")
    .innerHTML=
      `<div class="modalText">
        ${escapeHtml(text)}
      </div>`;

  const mb=
    document.getElementById("modalBtns");

  mb.innerHTML="";

  buttons.forEach(([label,fn])=>{

    const b=
      document.createElement("button");

    b.textContent=label;

    b.onclick=()=>{

      /*
        버튼을 누르면 해당 버튼 자체를 잠시 비활성
        → 빠른 더블 클릭 방지
      */
      if(b.dataset.busy==="1")
        return;

      b.dataset.busy="1";

      fn();
    };

    mb.appendChild(b);
  });

  document.getElementById("modalBack")
    .style.display="flex";
}

function closeModal(){

  modalOpen=false;

  document.getElementById("modalBack")
    .style.display="none";
}

function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/\n/g,"<br>");
}
