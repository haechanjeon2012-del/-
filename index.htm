<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CPL SPORTS 3.0</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:#070707;
  color:#fff;
  font-family:Arial,"Noto Sans KR",sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

:root{
  --bg:#070707;
  --card:#111;
  --card2:#171717;
  --line:#292929;
  --muted:#999;
  --accent:#fff;
  --blue:#268cff;
  --red:#ff3d4d;
  --green:#24d17e;
  --yellow:#ffd43b;
}

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(7,7,7,.96);
  border-bottom:1px solid #222;
  backdrop-filter:blur(12px);
}

.top{
  max-width:1400px;
  margin:auto;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{color:#aaa}

.nav{
  max-width:1400px;
  margin:auto;
  display:flex;
  gap:5px;
  padding:0 15px 10px;
  overflow-x:auto;
}

.nav button{
  white-space:nowrap;
  border:1px solid #292929;
  background:#111;
  color:#aaa;
  padding:9px 14px;
  border-radius:9px;
}

.nav button:hover,
.nav button.active{
  background:#fff;
  color:#000;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:25px 18px 70px;
}

.hero{
  min-height:330px;
  border:1px solid #292929;
  border-radius:22px;
  padding:35px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:
    radial-gradient(circle at 80% 20%,#252525 0,transparent 35%),
    linear-gradient(135deg,#111,#080808);
}

.hero h1{
  font-size:48px;
  margin:0 0 10px;
}

.hero p{
  color:#aaa;
  font-size:17px;
}

.next-game{
  min-width:330px;
  border:1px solid #333;
  border-radius:18px;
  padding:25px;
  background:#101010;
}

.next-game .vs{
  font-size:32px;
  font-weight:900;
  text-align:center;
  margin:15px 0;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:35px 0 15px;
}

.section-title h2{margin:0}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.grid3{grid-template-columns:repeat(3,1fr)}
.grid2{grid-template-columns:repeat(2,1fr)}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
}

.card.clickable:hover{
  border-color:#777;
  transform:translateY(-2px);
}

.team-card{
  min-height:150px;
}

.team-name{
  font-size:21px;
  font-weight:900;
}

.team-color{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-block;
  margin-right:7px;
}

.stat{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #202020;
}

.stat:last-child{border:0}

.big{
  font-size:30px;
  font-weight:900;
}

.muted{color:var(--muted)}
.blue{color:var(--blue)}
.red{color:var(--red)}
.green{color:var(--green)}
.yellow{color:var(--yellow)}

.table-wrap{
  overflow:auto;
  border:1px solid #292929;
  border-radius:14px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid #222;
}

th{
  background:#151515;
  color:#aaa;
}

tr:hover td{background:#151515}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:7px;
  background:#222;
  font-size:12px;
}

.match{
  border:1px solid #292929;
  background:#101010;
  border-radius:17px;
  padding:18px;
  cursor:pointer;
}

.match:hover{border-color:#777}

.match-top{
  display:flex;
  justify-content:space-between;
  color:#888;
  font-size:13px;
}

.match-teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:15px;
  margin-top:15px;
  text-align:center;
}

.team-big{
  font-size:20px;
  font-weight:900;
}

.score{
  font-size:30px;
  font-weight:900;
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:18px;
}

.tabs button{
  background:#111;
  border:1px solid #292929;
  color:#aaa;
  padding:10px 14px;
  border-radius:8px;
  white-space:nowrap;
}

.tabs button.active{
  background:#fff;
  color:#000;
}

.search{
  width:100%;
  padding:13px 15px;
  background:#111;
  border:1px solid #292929;
  border-radius:10px;
  color:white;
  outline:none;
}

.form{
  display:grid;
  gap:12px;
}

.form input,
.form select,
.form textarea{
  width:100%;
  background:#0d0d0d;
  color:#fff;
  border:1px solid #292929;
  border-radius:9px;
  padding:12px;
}

.form textarea{min-height:100px}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  background:#fff;
  color:#000;
  font-weight:800;
}

.btn.dark{
  background:#222;
  color:#fff;
  border:1px solid #333;
}

.btn.danger{
  background:#ff3948;
  color:#fff;
}

.empty{
  padding:45px 20px;
  text-align:center;
  color:#777;
  border:1px dashed #292929;
  border-radius:15px;
}

.detail-head{
  border:1px solid #292929;
  background:#101010;
  border-radius:18px;
  padding:25px;
}

.kpi{
  text-align:center;
  padding:15px;
  border:1px solid #292929;
  border-radius:13px;
  background:#101010;
}

.kpi strong{
  display:block;
  font-size:26px;
  margin-top:5px;
}

.comment{
  border-bottom:1px solid #222;
  padding:14px 0;
}

.comment:last-child{border:0}

.admin{
  border:1px solid #452020;
  background:#160c0c;
}

.footer{
  border-top:1px solid #222;
  color:#666;
  text-align:center;
  padding:35px;
  margin-top:50px;
}

@media(max-width:1000px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:repeat(2,1fr)}
  .hero{display:block}
  .next-game{margin-top:25px}
}

@media(max-width:600px){
  .grid,.grid2,.grid3{grid-template-columns:1fr}
  .hero{padding:23px}
  .hero h1{font-size:34px}
  .top{height:60px}
}
</style>
</head>

<body>

<header class="header">
  <div class="top">
    <div class="logo">CPL <span>SPORTS</span></div>
    <div id="clock" class="muted"></div>
  </div>

  <nav class="nav" id="nav">
    <button onclick="showPage('home')" class="active">🏠 홈</button>
    <button onclick="showPage('schedule')">📅 일정</button>
    <button onclick="showPage('games')">⚾ 경기센터</button>
    <button onclick="showPage('standings')">🏆 순위</button>
    <button onclick="showPage('teams')">👥 팀</button>
    <button onclick="showPage('players')">👤 선수</button>
    <button onclick="showPage('records')">📊 기록</button>
    <button onclick="showPage('fun')">🎮 CPL 재미</button>
    <button onclick="showPage('community')">💬 커뮤니티</button>
    <button onclick="showPage('weather')">🌦️ 경기장</button>
    <button onclick="showPage('notice')">📢 공지</button>
    <button onclick="showPage('admin')">🔐 관리자</button>
  </nav>
</header>

<main class="container" id="app"></main>

<footer class="footer">
  CPL SPORTS 3.0 · CHEONJUNG BASEBALL LEAGUE
</footer>

<script>

/* =========================================================
   CPL SPORTS 3.0
   310-FEATURE DATA ARCHITECTURE
========================================================= */

const TEAMS = [
  {
    id:"sihwan",
    name:"시환팀",
    color:"#268cff"
  },
  {
    id:"jaewoo",
    name:"재우팀",
    color:"#ff3d4d"
  },
  {
    id:"haechan",
    name:"해찬팀",
    color:"#24d17e"
  },
  {
    id:"minpung",
    name:"민푹팀",
    color:"#ffd43b"
  }
];

const PLAYERS = [
  {id:"sihwan",name:"시환",team:"sihwan"},
  {id:"jaewoo",name:"재우",team:"jaewoo"},
  {id:"haechan",name:"해찬",team:"haechan"},
  {id:"minpung",name:"민푹",team:"minpung"}
];

/*
  실제 경기 데이터가 아직 없으므로 빈 배열로 시작한다.
  관리자에서 경기를 등록하면 여기에 데이터가 들어간다.
*/
let games = JSON.parse(localStorage.getItem("cpl_games") || "[]");
let comments = JSON.parse(localStorage.getItem("cpl_comments") || "[]");
let notices = JSON.parse(localStorage.getItem("cpl_notices") || "[]");

let currentPage="home";

/* =========================================================
   310 FEATURE REGISTRY
========================================================= */

const FEATURES = [
"최근 경기 성적","시즌 승률","득점력","실점력","최근 연승/연패",
"상대전적","투수 스타트 기록","US 횟수","타격 기록","홈런/타점",
"최근 경기 결과","경기 상세","경기 전 예상 승률","팀 전력 비교",
"경기 후 실제 결과 비교","경기 MVP","예측 적중 표시","최근 경기 5개",
"다음 경기 카운트다운","팀 승률","최근 폼","득점력 자동분석",
"실점력 자동분석","상대전적 자동분석","연승/연패 자동분석",
"자동 파워랭킹","경기 예상 승리확률","투수+타자 통합 기록",
"개인 기록 변화","경기별 기록","스타트 기록 횟수","FS","DS","CS",
"QS","PS","SS","US","US 최다 기록","개인 최고 기록","최근 활약",
"투수 TOP 4","타자 TOP 4","K TOP","홈런 TOP","타점 TOP","US TOP",
"스타트 기록 TOP","연승 TOP","타율 TOP","ERA TOP","득점 TOP",
"안타 TOP","오늘의 선수","오늘의 기록","오늘의 경기 예측",
"선수 맞대결","팀 맞대결","MVP 후보","기록 경신 알림",
"특별기록 달성 배지","완전 익명 댓글","경기별 댓글","선수별 댓글",
"공지 댓글","관리자 댓글 삭제","현재 날씨","강수확률","풍속",
"경기 위험도","우천 가능성","일정 관리","결과 관리","팀 관리",
"선수 관리","투수 기록 관리","타자 기록 관리","MVP 관리",
"개인상 관리","우승팀 관리","공지 관리","댓글 관리",
"날씨 관리","비밀번호 관리","백업","복원"
];

/* =========================================================
   UTILITIES
========================================================= */

function save(){
  localStorage.setItem("cpl_games",JSON.stringify(games));
  localStorage.setItem("cpl_comments",JSON.stringify(comments));
  localStorage.setItem("cpl_notices",JSON.stringify(notices));
}

function team(id){
  return TEAMS.find(x=>x.id===id);
}

function player(id){
  return PLAYERS.find(x=>x.id===id);
}

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function pct(a,b){
  if(!b)return "-";
  return ((a/b)*100).toFixed(1)+"%";
}

function winRate(teamId){
  const gs=games.filter(g=>g.status==="final" &&
    (g.home===teamId || g.away===teamId));

  if(!gs.length)return "-";

  let w=0;

  gs.forEach(g=>{
    const myScore=g.home===teamId?g.homeScore:g.awayScore;
    const opScore=g.home===teamId?g.awayScore:g.homeScore;

    if(myScore>opScore)w++;
  });

  return pct(w,gs.length);
}

function record(teamId){
  let w=0,l=0,d=0,r=0,a=0;

  games.filter(g=>g.status==="final" &&
    (g.home===teamId || g.away===teamId))
  .forEach(g=>{
    const home=g.home===teamId;
    const me=home?g.homeScore:g.awayScore;
    const opp=home?g.awayScore:g.homeScore;

    r+=me;
    a+=opp;

    if(me>opp)w++;
    else if(me<opp)l++;
    else d++;
  });

  return {w,l,d,r,a,diff:r-a};
}

function streak(teamId){
  const gs=games
    .filter(g=>g.status==="final" &&
      (g.home===teamId || g.away===teamId))
    .sort((a,b)=>new Date(a.date)-new Date(b.date));

  if(!gs.length)return "-";

  let result="";

  gs.forEach(g=>{
    const home=g.home===teamId;
    const me=home?g.homeScore:g.awayScore;
    const op=home?g.awayScore:g.homeScore;

    result=me>op?"W":me<op?"L":"D";
  });

  let count=0;

  for(let i=gs.length-1;i>=0;i--){
    const g=gs[i];
    const home=g.home===teamId;
    const me=home?g.homeScore:g.awayScore;
    const op=home?g.awayScore:g.homeScore;

    const r=me>op?"W":me<op?"L":"D";

    if(r===result)count++;
    else break;
  }

  return result==="W"?"🔥 "+count+"연승":
         result==="L"?"❄️ "+count+"연패":
         "무승부";
}

function lastGames(teamId,n=5){
  return games
    .filter(g=>g.status==="final" &&
      (g.home===teamId || g.away===teamId))
    .sort((a,b)=>new Date(b.date)-new Date(a.date))
    .slice(0,n);
}

function h2h(a,b){
  let w=0,l=0,d=0;

  games.filter(g=>g.status==="final" &&
    ((g.home===a&&g.away===b) ||
     (g.home===b&&g.away===a)))
  .forEach(g=>{
    const aScore=g.home===a?g.homeScore:g.awayScore;
    const bScore=g.home===b?g.homeScore:g.awayScore;

    if(aScore>bScore)w++;
    else if(aScore<bScore)l++;
    else d++;
  });

  return {w,l,d};
}

function expected(teamA,teamB){

  const a=record(teamA);
  const b=record(teamB);

  if(a.w+a.l===0 && b.w+b.l===0)
    return [50,50];

  const ar=a.w/(a.w+a.l||1);
  const br=b.w/(b.w+b.l||1);

  const total=ar+br||1;

  return [
    Math.round(ar/total*100),
    Math.round(br/total*100)
  ];
}

/* =========================================================
   PAGE SYSTEM
========================================================= */

function showPage(page){
  currentPage=page;

  document.querySelectorAll(".nav button")
    .forEach(x=>x.classList.remove("active"));

  const btn=[...document.querySelectorAll(".nav button")]
    .find(x=>x.getAttribute("onclick")===`showPage('${page}')`);

  if(btn)btn.classList.add("active");

  if(page==="home")home();
  if(page==="schedule")schedule();
  if(page==="games")gamesPage();
  if(page==="standings")standings();
  if(page==="teams")teamsPage();
  if(page==="players")playersPage();
  if(page==="records")recordsPage();
  if(page==="fun")funPage();
  if(page==="community")communityPage();
  if(page==="weather")weatherPage();
  if(page==="notice")noticePage();
  if(page==="admin")adminPage();

  window.scrollTo({top:0,behavior:"smooth"});
}

/* =========================================================
   HOME
========================================================= */

function home(){

  const next=games
    .filter(g=>g.status!=="final")
    .sort((a,b)=>new Date(a.date)-new Date(b.date))[0];

  document.getElementById("app").innerHTML=`

    <section class="hero">

      <div>
        <div class="badge">CPL SPORTS 3.0</div>
        <h1>CHEONJUNG<br>BASEBALL LEAGUE</h1>
        <p>
          경기 · 선수 · 기록 · 분석을 하나로 연결하는<br>
          CPL 통합 스포츠 플랫폼
        </p>
      </div>

      <div class="next-game">

        <div class="muted">⚾ NEXT GAME</div>

        ${
          next
          ?
          `
          <div class="vs">
            ${team(next.home).name}
            <br>VS<br>
            ${team(next.away).name}
          </div>

          <div class="muted" style="text-align:center">
            ${esc(next.date)}
          </div>
          `
          :
          `
          <div class="empty">
            아직 등록된 경기가 없습니다.
          </div>
          `
        }

      </div>

    </section>

    <div class="section-title">
      <h2>🏆 시즌 순위</h2>
      <button class="btn dark" onclick="showPage('standings')">전체보기</button>
    </div>

    <div class="grid">

      ${TEAMS.map((t,i)=>{

        const r=record(t.id);

        return `
          <div class="card team-card clickable"
               onclick="teamDetail('${t.id}')">

            <div class="team-name">
              <span class="team-color"
                    style="background:${t.color}"></span>
              ${t.name}
            </div>

            <div style="margin-top:18px">
              <span class="big">${r.w}</span>승
              <span class="muted"> / ${r.l}패 / ${r.d}무</span>
            </div>

            <div class="stat">
              <span>승률</span>
              <b>${winRate(t.id)}</b>
            </div>

            <div class="stat">
              <span>연속</span>
              <b>${streak(t.id)}</b>
            </div>

          </div>
        `;

      }).join("")}

    </div>

    <div class="section-title">
      <h2>⚾ 최근 경기</h2>
    </div>

    ${
      games.filter(g=>g.status==="final").length
      ?
      `<div class="grid2">
        ${games
          .filter(g=>g.status==="final")
          .sort((a,b)=>new Date(b.date)-new Date(a.date))
          .slice(0,5)
          .map(gameCard)
          .join("")}
      </div>`
      :
      `<div class="empty">
        아직 진행된 경기가 없습니다.<br>
        첫 경기 결과를 관리자에서 등록해주세요.
      </div>`
    }

    <div class="section-title">
      <h2>📊 CPL 자동 분석</h2>
    </div>

    <div class="grid">

      <div class="kpi">
        최근 경기
        <strong>${games.filter(g=>g.status==="final").length}</strong>
      </div>

      <div class="kpi">
        등록 선수
        <strong>${PLAYERS.length}</strong>
      </div>

      <div class="kpi">
        등록 팀
        <strong>${TEAMS.length}</strong>
      </div>

      <div class="kpi">
        US 기록
        <strong>-</strong>
      </div>

    </div>
  `;
}

/* =========================================================
   GAME CARD
========================================================= */

function gameCard(g){

  return `
    <div class="match" onclick="gameDetail('${g.id}')">

      <div class="match-top">
        <span>${esc(g.date)}</span>
        <span>${g.type||"정규시즌"}</span>
      </div>

      <div class="match-teams">

        <div>
          <div class="team-big">${team(g.home).name}</div>
        </div>

        <div class="score">
          ${g.homeScore}
          :
          ${g.awayScore}
        </div>

        <div>
          <div class="team-big">${team(g.away).name}</div>
        </div>

      </div>

    </div>
  `;
}

/* =========================================================
   SCHEDULE
========================================================= */

function schedule(){

  const sorted=[...games].sort(
    (a,b)=>new Date(a.date)-new Date(b.date)
  );

  document.getElementById("app").innerHTML=`

    <div class="section-title">
      <h1>📅 경기 일정</h1>
    </div>

    <div class="tabs">

  const B=team(g.away);

    </div>

    <div class="table-wrap">

          <th>${B.name}</th>

        <tr>

          <td>${winRate(A.id)}</td>
          <td>${winRate(B.id)}</td>

        <tr>
          <td>득점</td>
          <td>${a.r}</td>
          <td>${b.r}</td>
        </tr>

function standings(){

  const rows=TEAMS.map(t=>{
    const r=record(t.id);

    return {...t,...r,rate:winRate(t.id)};
  }).sort((a,b)=>{

    const ar=a.w/(a.w+a.l||1);
    const br=b.w/(b.w+b.l||1);

    return br-ar;

  });

  document.getElementById("app").innerHTML=`

    <div class="section-title">
      <h1>🏆 전체 순위</h1>
    </div>

    <div class="table-wrap">

      <table>

        <tr>
          <th>순위</th>
          <th>팀</th>
          <th>승</th>
          <th>패</th>
          <th>무</th>
          <th>승률</th>
          <th>득점</th>
          <th>실점</th>
          <th>득실차</th>
          <th>연속</th>
        </tr>

        ${rows.map((t,i)=>`

          <tr onclick="teamDetail('${t.id}')"
              style="cursor:pointer">

            <td>${i+1}</td>

            <td>
              <b>${t.name}</b>
            </td>

            <td>${t.w}</td>
            <td>${t.l}</td>
            <td>${t.d}</td>

            <td>${t.rate}</td>

            <td>${t.r}</td>
            <td>${t.a}</td>

            <td>${t.diff}</td>

            <td>${streak(t.id)}</td>

          </tr>

        `).join("")}

      </table>

    </div>

    <div class="section-title">
      <h2>📊 자동 파워랭킹</h2>
    </div>

    <div class="grid">

      ${rows.map((t,i)=>`

        <div class="card">

          <div class="muted">POWER RANK ${i+1}</div>

          <div class="team-name">
            ${t.name}
          </div>

          <div class="big" style="margin-top:12px">
            ${
              Math.max(
                0,
                100 +
                t.w*10 -
                t.l*8 +
                t.diff
              )
            }
          </div>

        </div>

      `).join("")}

    </div>
  `;
}

function commentBox(type,target){

  const list=comments.filter(
    c=>c.type===type && c.target===target
  );

  return `

    <div class="card">

      <div class="form">

        <textarea
          id="comment-${type}-${target}"
          placeholder="익명으로 댓글을 남겨주세요."></textarea>

        <button class="btn"
          onclick="addComment('${type}','${target}')">
          댓글 등록
        </button>

      </div>

      <div style="margin-top:20px">

        ${
          list.length
          ?
          list.map(c=>`

            <div class="comment">

              <div class="muted">
                익명 · ${esc(c.date)}
              </div>

              <div style="margin-top:6px">
                ${esc(c.text)}
              </div>

            </div>

          `).join("")
          :
          `<div class="empty">
            아직 댓글이 없습니다.
          </div>`
        }

      </div>

    </div>
  `;
}

function addComment(type,target){

  const el=document.getElementById(
    `comment-${type}-${target}`
  );

  if(!el || !el.value.trim())return;

  comments.push({
    id:Date.now(),
    type,
    target,
    text:el.value.trim(),
    date:new Date().toLocaleString("ko-KR")
  });

  save();

  if(type==="game")gameDetail(target);
  if(type==="team")teamDetail(target);
  if(type==="player")playerDetail(target);
}

          onclick="addFreeComment()">
          등록
        </button>

      </div>

    </div>

    <div class="section-title">
      <h2>최근 댓글</h2>
    </div>

    <div class="card">

      ${
        comments.length
        ?
        comments.slice().reverse().map(c=>`

          <div class="comment">

            <div class="muted">
              익명 · ${esc(c.date)}
            </div>

            <div>${esc(c.text)}</div>

          </div>

        `).join("")
        :
        `<div class="empty">
          아직 댓글이 없습니다.
        </div>`
      }

    </div>
  `;
}

function addFreeComment(){

  const el=document.getElementById("freeComment");

  if(!el.value.trim())return;

  comments.push({
    id:Date.now(),
    type:"free",
    target:"all",
    text:el.value.trim(),
    date:new Date().toLocaleString("ko-KR")
  });

  save();
  communityPage();
}

/* =========================================================
   WEATHER
========================================================= */

function weatherPage(){

  document.getElementById("app").innerHTML=`

    <div class="section-title">
      <h1>🌦️ 경기장</h1>
    </div>

    <div class="grid">

      <div class="kpi">
        현재 날씨
        <strong>-</strong>
      </div>

      <div class="kpi">
        강수확률
        <strong>-</strong>
      </div>

      <div class="kpi">
        풍속
        <strong>-</strong>
      </div>

      <div class="kpi">
        경기 위험도
        <strong>정보 대기</strong>
      </div>

    </div>

    <div class="card" style="margin-top:20px">

      <h2>☔ 우천 가능성</h2>

      <p class="muted">
        경기 날짜가 등록되면 날씨 정보를 기준으로
        경기 위험도를 표시할 수 있도록 설계되어 있습니다.
      </p>

    </div>

/* =========================================================
   NOTICE
========================================================= */

function noticePage(){

  document.getElementById("app").innerHTML=`

    <div class="section-title">
      <h1>📢 공지사항</h1>
    </div>

    ${
      notices.length
      ?
      notices.map(n=>`

        <div class="card" style="margin-bottom:12px">

          <h2>${esc(n.title)}</h2>

          <div class="muted">
            ${esc(n.date)}
          </div>

          <p>${esc(n.text)}</p>

        </div>

      `).join("")

        등록된 공지가 없습니다.
      </div>`
    }

  `;
}

/* =========================================================
   ADMIN
========================================================= */

function adminPage(){

  document.getElementById("app").innerHTML=`

    <div class="section-title">
      <h1>🔐 관리자</h1>
    </div>

    <div class="card admin">

      <h2>⚠️ 관리자 기능</h2>

      <p class="muted">
        현재 버전은 브라우저에서 동작하는 CPL 관리자 데이터 구조입니다.
      </p>

    </div>

    <div class="section-title">
      <h2>⚾ 경기 등록</h2>
    </div>

    <div class="card">

      <div class="form">

        <input id="gameDate"
          placeholder="날짜 예: 2026-09-01">

        <select id="gameHome">
          ${TEAMS.map(t=>`
            <option value="${t.id}">
              ${t.name}
            </option>
          `).join("")}
        </select>

        <select id="gameAway">
          ${TEAMS.map(t=>`
            <option value="${t.id}">
              ${t.name}
            </option>
          `).join("")}
        </select>

        <select id="gameStatus">
          <option value="scheduled">예정</option>
          <option value="final">종료</option>
        </select>

        <input id="homeScore"
          type="number"
          value="0"
          placeholder="홈 점수">

        <input id="awayScore"
          type="number"
          value="0"
          placeholder="원정 점수">

        <input id="gameMvp"
          placeholder="MVP">

        <button class="btn"
          onclick="addGame()">
          경기 등록
        </button>

      </div>

    </div>

    <div class="section-title">
      <h2>📋 등록된 경기</h2>
    </div>

    <div class="card">

      ${
        games.length
        ?
        games.map(g=>`

          <div class="stat">

            <span>
              ${esc(g.date)}
              · ${team(g.home).name}
              VS ${team(g.away).name}
            </span>

            <span>

              ${
                g.status==="final"
                ?`${g.homeScore}:${g.awayScore}`
                :"예정"
              }

              <button
                class="btn danger"
                style="padding:5px 8px;margin-left:5px"
                onclick="deleteGame('${g.id}')">
                삭제
              </button>

            </span>

          </div>

        `).join("")
        :
        `<div class="empty">
          등록된 경기가 없습니다.
        </div>`
      }

    </div>

    <div class="section-title">
      <h2>📢 공지 등록</h2>
    </div>

    <div class="card">

      <div class="form">

        <input id="noticeTitle"
          placeholder="공지 제목">

        <textarea id="noticeText"
          placeholder="공지 내용"></textarea>

        <button class="btn"
          onclick="addNotice()">
          공지 등록
        </button>

      </div>

    </div>

    <div class="section-title">
      <h2>💾 데이터 관리</h2>
    </div>

    <div class="grid">

      <button class="btn"
        onclick="backupData()">
        백업
      </button>

      <label class="btn dark"
             style="text-align:center">
        복원
        <input type="file"
          id="restoreFile"
          accept=".json"
          onchange="restoreData(event)"
          hidden>
      </label>

      <button class="btn danger"
        onclick="clearData()">
        전체 데이터 초기화
      </button>

    </div>
  `;
}

function addGame(){

  const date=document.getElementById("gameDate").value;
  const home=document.getElementById("gameHome").value;
  const away=document.getElementById("gameAway").value;
  const status=document.getElementById("gameStatus").value;

  if(home===away){
    alert("같은 팀끼리는 경기를 만들 수 없습니다.");
    return;
  }

  games.push({
    id:"g_"+Date.now(),
    date,
    home,
    away,
    status,
    homeScore:Number(
      document.getElementById("homeScore").value||0
    ),
    awayScore:Number(
      document.getElementById("awayScore").value||0
    ),
    mvp:document.getElementById("gameMvp").value,
    type:"정규시즌"
  });

  save();
  adminPage();
}

function deleteGame(id){

  if(!confirm("이 경기를 삭제할까요?"))return;

  games=games.filter(g=>g.id!==id);

  save();
  adminPage();
}

function addNotice(){

  const title=document.getElementById("noticeTitle").value;
  const text=document.getElementById("noticeText").value;

  if(!title || !text)return;

  notices.push({
    id:Date.now(),
    title,
    text,
    date:new Date().toLocaleString("ko-KR")
  });

  save();
  adminPage();
}

function backupData(){

  const data={
    games,
    comments,
    notices
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const a=document.createElement("a");

  a.href=URL.createObjectURL(blob);
  a.download="cpl-backup.json";
  a.click();

  URL.revokeObjectURL(a.href);
}

function restoreData(event){

  const file=event.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=e=>{

    try{

      const data=JSON.parse(e.target.result);

      games=data.games||[];
      comments=data.comments||[];
      notices=data.notices||[];

      save();

      alert("복원 완료");
      adminPage();

    }catch{
      alert("백업 파일을 읽을 수 없습니다.");
    }

  };

  reader.readAsText(file);
}

function clearData(){

  if(!confirm(
    "정말 모든 CPL 데이터를 삭제할까요?"
  ))return;

  games=[];
  comments=[];
  notices=[];

  save();

  adminPage();
}

/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

  const now=new Date();

  document.getElementById("clock")
    .textContent=
      now.toLocaleDateString("ko-KR")
      +" "
      +now.toLocaleTimeString("ko-KR");
}

setInterval(updateClock,1000);
updateClock();

/* =========================================================
   START
========================================================= */

showPage("home");

</script>

</html>
