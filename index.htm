function shuffle(arr){
  return [...arr].sort(()=>Math.random()-.5);
}

/* =========================

function startGame(count){

  playerCount=count;

  initPlayers();

  turn=0;
  rolled=false;
  dice=[1,1];
  fund=0;

  deck=shuffle(
    golden.map((c,i)=>({
      ...c,
      id:i+1
    }))
  );

  deckPos=0;

  gameStarted=true;

  board.forEach(x=>{
    if(x){
      delete x.owner;
      x.build=0;
    }
  });

  log(
    `${playerCount}인 게임을 시작했습니다. 4인 클래식 규칙, 시작자금 300만원.`

  closeModal();

  render();

}

function showModal(title,body,buttons=[]){

  document.getElementById('modalTitle').textContent=title;

  document.getElementById('modalBody').innerHTML=body;

  const box=document.getElementById('modalButtons');

  box.innerHTML='';

  buttons.forEach((b,i)=>{

    const btn=document.createElement('button');

    btn.textContent=b[0];

    if(i===buttons.length-1){
      btn.classList.add('primary');
    }

    btn.onclick=b[1];

    box.appendChild(btn);

  });

  document.getElementById('modalBg').classList.add('show');

}

function closeModal(){

  document.getElementById('modalBg').classList.remove('show');

}

/* =========================
   보드 생성
========================= */

function buildBoard(){

  const el=document.getElementById('board');

  el.innerHTML='';

  board=[];

  for(let i=0;i<40;i++){

    const c=boardData[i];

    const cell=document.createElement('div');

    cell.className='cell';

    if(c.type==='start')cell.classList.add('start');
    if(c.type==='gold')cell.classList.add('gold');
    if(c.type==='island')cell.classList.add('island');
    if(c.type==='vehicle'||c.type==='tour')cell.classList.add('vehicle');
    if(c.type==='welfare')cell.classList.add('welfare');

    cell.dataset.index=i;

    cell.onclick=()=>{
      if(gameStarted) spaceAction(i);
    };

    board[i]={
      ...c,
      build:0
    };

    cell.id='cell-'+i;

    el.appendChild(cell);

  }

  const cells=[...el.children];

  const positions=[];

  for(let x=0;x<11;x++)positions.push([0,x]);
  for(let y=1;y<11;y++)positions.push([y,10]);
  for(let x=9;x>=0;x--)positions.push([10,x]);
  for(let y=9;y>=1;y--)positions.push([y,0]);

  positions.forEach((pos,i)=>{

    const cell=cells[i];

    cell.style.gridRow=pos[0]+1;
    cell.style.gridColumn=pos[1]+1;

  });

  const center=document.createElement('div');

  center.className='cell center';

  center.innerHTML='<div class="center-title">WORLD MARBLE</div>';

  el.appendChild(center);

}


/* =========================
   보드 렌더링
========================= */

function renderBoard(){

  board.forEach((c,i)=>{

    const cell=document.getElementById('cell-'+i);

    if(!cell)return;

    cell.className='cell';

    if(c.type==='start')cell.classList.add('start');
    if(c.type==='gold')cell.classList.add('gold');
    if(c.type==='island')cell.classList.add('island');
    if(c.type==='vehicle'||c.type==='tour')cell.classList.add('vehicle');
    if(c.type==='welfare')cell.classList.add('welfare');

    if(c.owner!==undefined){
      cell.classList.add('owner'+(c.owner+1));
    }

    let html='';

    html+=`<div class="cell-name">${c.name}</div>`;

    if(c.price){
      html+=`<div class="cell-price">${fmt(c.price)}</div>`;
    }

    if(c.toll){
      html+=`<div class="cell-toll">통행료 ${fmt(c.toll)}</div>`;
    }

    if(c.t){
      html+=`<div class="cell-toll">대지료 ${fmt(c.t[c.build||0])}</div>`;
    }

    const tokens=players
      .filter(p=>p.alive&&p.pos===i)
      .map(p=>
        `<div class="token" style="background:${PColors[p.id]}">${p.id+1}</div>`
      )
      .join('');

    html+=`<div class="tokens">${tokens}</div>`;

    cell.innerHTML=html;

  });

}


/* =========================
   플레이어 렌더링
========================= */

function renderPlayers(){

  const el=document.getElementById('playersPanel');

  el.innerHTML='';

  players.forEach(p=>{

    const row=document.createElement('div');

    row.className='player';

    row.innerHTML=`
      <div class="player-dot" style="background:${PColors[p.id]}"></div>
      <div class="player-info">
        <div class="player-name">
          ${p.name}${turn===p.id?' ◀':''}
        </div>
        <div class="player-money">
          ${fmt(p.money)} · ${board[p.pos]?.name||''}
        </div>
      </div>
    `;

    el.appendChild(row);

  });

}


/* =========================
   전체 렌더링
========================= */

function render(){

  renderBoard();

  renderPlayers();

  const p=players[turn];

  if(p){

    document.getElementById('turnName').textContent=p.name;

    document.getElementById('turnMoney').textContent=fmt(p.money);

  document.getElementById('fund').textContent=fmt(fund);

/* =========================
   주사위
========================= */

const diceFace=[
  '',
  '⚀',
  '⚁',
  '⚂',
  '⚃',
  '⚄',
  '⚅'
];

function renderDice(){

  document.getElementById('die1').textContent=diceFace[dice[0]];

  document.getElementById('die2').textContent=diceFace[dice[1]];

  const btn=document.getElementById('rollBtn');

  btn.disabled=
    !gameStarted ||
    rolled ||
    !players.length ||
    !players[turn]?.alive;

}


/* =========================
   주사위 굴리기
========================= */

function rollDice(){

  if(!gameStarted){

    newGame();

    return;

  }

  if(rolled)return;

  const p=players[turn];

  if(!p.alive){

    nextTurn();

    return;

  }

  if(p.island>0){

    islandTurn(p);

    return;

  }

  dice=[
    1+Math.floor(Math.random()*6),
    1+Math.floor(Math.random()*6)
  ];

  rolled=true;

  renderDice();

  const total=dice[0]+dice[1];

  log(
    `${p.name} 주사위 ${dice[0]} + ${dice[1]} = ${total}`
  );

  moveSteps(
    p,
    total,
    ()=>{
      afterMove(
        p,
        dice[0]===dice[1]
      );
    }
  );

}


/* =========================
   이동
========================= */

function moveSteps(p,n,done){

  let count=0;

  function step(){

    if(count>=n){

      done();

      return;

    }

    p.pos=(p.pos+1)%40;

    if(p.pos===0){

      p.money+=20;

      log(`${p.name} 출발을 지나 20만원을 받았습니다.`);

    }

    count++;

    render();

    setTimeout(step,180);

  }

  step();

}


/* =========================
   도착 처리
========================= */

function afterMove(p,doubles){

  spaceAction(
    p.pos,
    ()=>{
      if(doubles){

        log(`${p.name} 더블! 한 번 더 굴릴 수 있습니다.`);

        rolled=false;

        render();

      }else{

        nextTurn();

      }
    }
  );

}


/* =========================
   칸 행동
========================= */

function spaceAction(index,done=()=>{}){

  const c=board[index];

  if(!c)return;

  const p=players[turn];

  if(c.type==='property'){

    if(c.owner===undefined){

      showModal(
        c.name,
        `
        <p>
        가격: <b>${fmt(c.price)}</b><br>
        현재 보유금액: <b>${fmt(p.money)}</b>
        </p>
        `,
        [
          ['구매',()=>buyProperty(index,done)],
          ['구매하지 않기',()=>{
            closeModal();
            done();
          }]
        ]
      );

      return;

    }

    if(c.owner!==p.id){

      payToll(p,c,done);

      return;

    }

  }

  if(c.type==='gold'){

    drawGolden(p,done);

    return;

  }

  if(c.type==='island'){

    p.island=2;

    log(`${p.name} 무인도에 갇혔습니다.`);

  }

  if(c.type==='welfare'){

    if(index===38){

      const amount=Math.min(30,p.money);

      p.money-=amount;

      fund+=amount;

      log(`${p.name} 사회복지기금 ${fmt(amount)}을 납부했습니다.`);

    }else{

      p.money+=fund;

      log(`${p.name} 사회복지기금 ${fmt(fund)}을 받았습니다.`);

      fund=0;

    }

  }

  if(c.type==='vehicle'||c.type==='tour'){

    if(c.toll){

      p.money+=c.toll;

      log(`${p.name} 특별칸 보상 ${fmt(c.toll)}을 받았습니다.`);

    }

  }

  render();

  done();

}


/* =========================
   토지 구매
========================= */

function buyProperty(index,done){

  const p=players[turn];

  const c=board[index];

  if(p.money<c.price){

    log(`${p.name}은(는) 돈이 부족하여 ${c.name}을 구매하지 못했습니다.`);

    closeModal();

    done();

    return;

  }

  p.money-=c.price;

  c.owner=p.id;

  c.build=0;

  p.props[index]=true;

  log(`${p.name}이(가) ${c.name}을 ${fmt(c.price)}에 구매했습니다.`);

  closeModal();

  render();

  done();

}


/* =========================
   통행료
========================= */

function calcToll(c){

  if(c.type==='tour'||c.type==='vehicle')return c.toll||0;

  return c.t[p=>p];

}

function payToll(p,c,done){

  const owner=players[c.owner];

  if(!owner){

    done();

    return;

  }

  let toll=calcToll(c);

  if(!Number.isFinite(toll)){

    toll=c.t[c.build||0]||0;

  }

  if(p.favor>0){

    p.favor--;

    log(`${p.name}이(가) 통행료 면제권을 사용했습니다.`);

    render();

    done();

    return;

  }

  toll=Math.min(toll,p.money);

  p.money-=toll;

  owner.money+=toll;

  log(
    `${p.name} → ${owner.name} ${c.name} 통행료 ${fmt(toll)}`
  );

  render();

  done();

}


/* =========================
   황금열쇠
========================= */

function drawGolden(p,done){

  const card=deck[deckPos];

  deckPos++;

  if(deckPos>=deck.length)deckPos=0;

  showModal(
    '황금열쇠',
    `
    <div class="card">
      <b>${card.title}</b>
      <p>${card.text}</p>
    </div>
    `,
    [
      ['확인',()=>{

        card.action(p);

        closeModal();

        if(pendingMove){

          const n=pendingMove;

          pendingMove=null;

          moveSteps(
            p,
            n,
            ()=>{
              spaceAction(
                p.pos,
                done
              );
            }
          );

        }else{

          render();

          done();

        }

      }]
    ]
  );

}


/* =========================
   무인도
========================= */

function islandTurn(p){

  p.island--;

  log(`${p.name} 무인도 턴 ${p.island}`);

  if(p.island<=0){

    log(`${p.name}이(가) 무인도에서 나왔습니다.`);

  }

  rolled=true;

  render();

  setTimeout(
    nextTurn,
    500
  );

}


/* =========================
   다음 턴
   ★ players.length가 선택 인원수
========================= */

function nextTurn(){

  if(activePlayers().length<=1){

    endGame();

    return;

  }

  rolled=false;

  let tries=0;

  do{

    turn=(turn+1)%players.length;

    tries++;

  }while(
    !players[turn].alive &&
    tries<10
  );

  render();

}


/* =========================
   게임 종료
========================= */

function endGame(){

  const alive=activePlayers();

  if(alive.length===1){

    showModal(
      '게임 종료',
      `<p><b>${alive[0].name}</b> 승리!</p>`,
      [
        ['닫기',closeModal]
      ]
    );

    return;

  }

  showModal(
    '게임 종료',
    '<p>게임이 종료되었습니다.</p>',
    [
      ['닫기',closeModal]
    ]
  );

}


/* =========================
   시작
========================= */

buildBoard();

/*
  페이지를 열면 바로
  2명 / 3명 / 4명 선택창이 나옵니다.
*/
newGame();

</script>

</html>
